    ],
    uniform: [
      () => { const b = pickOne([10, 15, 20, 30]); return { text: `A bus is equally likely to arrive at any moment in the next ${b} minutes. X is when it arrives.`, clue: 'equally likely to arrive at any moment',
        vars: { A: V(0, null, 'it starts now: 0'), B: V(b, `next ${b} minutes`) } } },
      () => { const a = ri(0, 5), b = a + ri(4, 10); return { text: `A program picks a number X between ${a} and ${b}, with every value equally likely.`, clue: 'every value equally likely',
        vars: { A: V(a, `between ${a}`), B: V(b, `and ${b}`) } } },
      () => { const b = pickOne([30, 50, 100]); return { text: `A ${b} cm rod is cut at a point chosen uniformly along its length. X is where it is cut.`, clue: 'chosen uniformly',
        vars: { A: V(0, null, 'one end of the rod: 0'), B: V(b, `${b} cm rod`) } } },
    ],
    exponential: [
      () => { const l = ri(3, 12), t = pickOne([0.25, 0.5]); return { text: `Customers walk into a coffee shop at an average rate of ${l} per hour. X is the time until the first customer arrives.`, clue: 'the time until the first customer',
        vars: { lam: V(l, `${l} per hour`), t: V(t, null, `say we want P(X > ${t} hour)`) } } },
      () => { const l = ri(2, 8), t = pickOne([0.5, 1]); return { text: `A Geiger counter clicks ${l} times a minute on average. X is the wait for the first click.`, clue: 'the wait for the first click',
        vars: { lam: V(l, `${l} times a minute`), t: V(t, null, `say we want P(X > ${t} minute)`) } } },
      () => { const m = ri(2, 10), t = ri(1, m); return { text: `A server crashes on average once every ${m} days. X is the time until its next crash.`, clue: 'the time until its next crash',
        vars: { lam: { ...frac(1, m), from: `once every ${m} days`, note: `1 crash per ${m} days` }, t: V(t, null, `say we want P(X > ${t} days)`) } } },
    ],
    gamma: [
      () => { const l = ri(3, 10), a = ri(2, 5); return { text: `Calls reach a help desk at an average rate of ${l} per hour. X is the time until the ${ord(a)} call.`, clue: `the time until the ${ord(a)} call`,
        vars: { al: V(a, `${ord(a)} call`), be: { ...frac(1, l), from: `${l} per hour`, note: 'β = 1 ÷ rate' } } } },
      () => { const l = ri(4, 12), a = ri(2, 5); return { text: `Emails arrive at an average of ${l} per hour. X is how long it takes for ${a} emails to arrive.`, clue: `how long it takes for ${a} emails`,
        vars: { al: V(a, `for ${a} emails`), be: { ...frac(1, l), from: `${l} per hour`, note: 'β = 1 ÷ rate' } } } },
    ],
    chi: [
      () => { const g = ri(3, 20); return { text: `X has a chi-squared distribution with ${g} degrees of freedom. Find the value with area 0.05 to its right.`, clue: `chi-squared distribution with ${g} degrees of freedom`,
        vars: { ga: V(g, `${g} degrees of freedom`) } } },
      () => { const g = ri(3, 20); return { text: `Use the χ² table with γ = ${g} to find the value of X that cuts off the top 1%.`, clue: 'the χ² table',
        vars: { ga: V(g, `γ = ${g}`) } } },
    ],
    normal: [
      () => ({ text: 'IQ scores are normally distributed with mean 100 and standard deviation 15. X is a random person’s IQ.', clue: 'normally distributed',
        vars: { mu: V(100, 'mean 100'), sig: V(15, 'standard deviation 15'), x: V(100 + pickOne([-20, -15, 10, 15, 25, 30]), null, 'say X is this score') } }),
      () => { const m = pickOne([63, 64, 65]); return { text: `Heights of adult women follow a bell curve with mean ${m} inches and standard deviation 2.5 inches. X is a random woman’s height.`, clue: 'follow a bell curve',
        vars: { mu: V(m, `mean ${m} inches`), sig: V(2.5, 'standard deviation 2.5 inches'), x: V(m + pickOne([-4, -2.5, 2, 3, 5]), null, 'say X is this height') } } },
      () => { const m = ri(65, 78), sd = ri(6, 10); return { text: `Exam scores are normal with μ = ${m} and σ = ${sd}. X is a random student’s score.`, clue: `normal with μ = ${m}`,
        vars: { mu: V(m, `μ = ${m}`), sig: V(sd, `σ = ${sd}`), x: V(Math.min(100, m + pickOne([-12, -5, 8, 10, 15])), null, 'say X is this score') } } },
    ],
  }

  // ---------- plug it in: the story's numbers go into the formula ----------
  const SYM = { n: 'n', p: 'p', q: 'q', x: 'x', r: 'r', N: 'N', k: 'k', t: 't', A: 'A', B: 'B', lam: '\\lambda', mu: '\\mu', sig: '\\sigma', al: '\\alpha', be: '\\beta', ga: '\\gamma' }
  const CHIP_SYM = { lam: 'λ', mu: 'μ', sig: 'σ', al: 'α', be: 'β', ga: 'γ' }
  const choose = (n, k) => {
    if (k < 0 || k > n) return 0
    let c = 1
    for (let i = 1; i <= k; i++) c = (c * (n - k + i)) / i
    return Math.round(c)
  }
  const fact = n => (n <= 1 ? 1 : n * fact(n - 1))
  const gcd = (a, b) => (b ? gcd(b, a % b) : a)
  const approx = (x, d = 4) => {
    let r = +x.toFixed(d)
    if (r === 0 && x > 0) r = +x.toPrecision(2)
    return `${Math.abs(r - x) < 1e-12 ? '=' : '\\approx'} ${r}`
  }
  // each line: a formula with slots (s(key) is the symbol, or the number once it is
  // plugged in; mode 1 wraps a non-whole number in brackets, mode 2 any number), the
  // order the numbers go in, and what it comes to
  const PLUG = {
    binomial: [{ order: ['n', 'p', 'q', 'x'], tex: s => `f(${s('x')}) = \\binom{${s('n')}}{${s('x')}}${s('p', 1)}^{${s('x')}}${s('q', 1)}^{${s('n')}-${s('x')}}`,
      result: v => approx(choose(v.n, v.x) * v.p ** v.x * v.q ** (v.n - v.x)) }],
    geometric: [{ order: ['p', 'q', 'x'], tex: s => `f(${s('x')}) = ${s('q', 1)}^{${s('x')}-1}${s('p', 2)}`, result: v => approx(v.q ** (v.x - 1) * v.p) }],
    negbin: [{ order: ['r', 'p', 'q', 'x'], tex: s => `f(${s('x')}) = \\binom{${s('x')}-1}{${s('r')}-1}${s('p', 1)}^{${s('r')}}${s('q', 1)}^{${s('x')}-${s('r')}}`,
      result: v => approx(choose(v.x - 1, v.r - 1) * v.p ** v.r * v.q ** (v.x - v.r)) }],
    hyper: [{ order: ['N', 'r', 'n', 'x'], tex: s => `f(${s('x')}) = \\frac{\\binom{${s('r')}}{${s('x')}}\\binom{${s('N')}-${s('r')}}{${s('n')}-${s('x')}}}{\\binom{${s('N')}}{${s('n')}}}`,
      result: v => approx((choose(v.r, v.x) * choose(v.N - v.r, v.n - v.x)) / choose(v.N, v.n)) }],
    poisson: [
      { order: ['lam', 't'], tex: s => `${s('k')} = ${s('lam')}${s('t', 2)}`, result: v => `= ${fmt(v.k)}` },
      { order: ['k', 'x'], tex: s => `f(${s('x')}) = \\frac{e^{-${s('k')}}${s('k', 1)}^{${s('x')}}}{${s('x')}!}`, result: v => approx((Math.exp(-v.k) * v.k ** v.x) / fact(v.x)) },
    ],
    uniform: [{ order: ['A', 'B'], tex: s => `f(x) = \\frac{1}{${s('B')} - ${s('A')}}`, result: v => `= \\frac{1}{${v.B - v.A}} \\quad \\text{for } ${v.A} \\le x \\le ${v.B}` }],
    exponential: [
      { order: ['lam'], tex: s => `f(x) = ${s('lam')}e^{-${s('lam')}x}`, result: () => '\\quad \\text{for } x > 0' },
      { order: ['lam', 't'], tex: s => `P(X > ${s('t')}) = e^{-${s('lam')}${s('t', 2)}}`, result: v => approx(Math.exp(-v.lam * v.t)) },
    ],
    gamma: [{ order: ['al', 'be'], tex: s => `f(x) = \\frac{x^{${s('al')}-1}e^{-x/${s('be', 1)}}}{\\Gamma(${s('al')})\\,${s('be', 1)}^{${s('al')}}}`,
      result: v => {
        const l = Math.round(1 / v.be), a = v.al, num = l ** a, den = fact(a - 1), g = gcd(num, den)
        const coef = den / g === 1 ? `${num / g}` : `\\frac{${num / g}}{${den / g}}`
        return `= ${coef}${a - 1 === 1 ? 'x' : `x^{${a - 1}}`}e^{-${l}x}`
      } }],
    chi: [
      { order: ['ga'], tex: s => `\\alpha = \\frac{${s('ga')}}{2}`, result: v => `= ${fmt(v.ga / 2)}` },
      { order: [], tex: () => '\\beta = 2', result: () => '\\quad \\text{(then read the } \\chi^2 \\text{ table)}' },
    ],
    normal: [
      { order: ['mu', 'sig'], tex: s => `f(x) = \\frac{1}{\\sqrt{2\\pi}\\,${s('sig', 1)}}e^{-(x-${s('mu')})^2/2${s('sig', 2)}^2}`, result: null },
      { order: ['x', 'mu', 'sig'], tex: s => `z = \\frac{${s('x')} - ${s('mu')}}{${s('sig')}}`, result: v => approx((v.x - v.mu) / v.sig, 2) },
    ],
  }

  const wait = ms => new Promise(r => setTimeout(r, ms))
  // send a copy of a chip's number from the chip to a spot in the formula
  function fly(fromEl, toEl, text, cls) {
    const a = fromEl.getBoundingClientRect()
    const b = toEl.getBoundingClientRect()
    const f = h('div', 'flyer ' + cls, text)
    document.body.append(f)
    const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2
    const x1 = b.left + b.width / 2, y1 = b.top + b.height / 2
    const anim = f.animate(
      [
        { transform: `translate(${x0}px, ${y0}px) translate(-50%, -50%) scale(1.15)` },
        { transform: `translate(${(x0 + x1) / 2}px, ${Math.min(y0, y1) - 40}px) translate(-50%, -50%) scale(1.25)`, offset: 0.45 },
        { transform: `translate(${x1}px, ${y1}px) translate(-50%, -50%) scale(0.8)`, opacity: 0.4 },
      ],
      { duration: 560, easing: 'cubic-bezier(.45,0,.3,1)', fill: 'forwards' },
    )
    // a busy or backgrounded tab can stall an animation: never wait on it for long
    return Promise.race([anim.finished.catch(() => {}), wait(800)]).then(() => f.remove())
  }
  // the story with one phrase lit up in a number's colour
  function storyMark(text, phrase, cls) {
    const p = h('p', 'story')
    const at = phrase ? text.indexOf(phrase) : -1
    if (at < 0) p.textContent = text
    else p.append(document.createTextNode(text.slice(0, at)), h('mark', 'pvmark ' + cls, phrase), document.createTextNode(text.slice(at + phrase.length)))
    return p
  }
  // the panel: chips for the story's numbers, the formula lines, and a replay.
  // auto: play straight away (a right answer); otherwise it starts filled in
  function plugPanel(p, { sheet = null, auto = false, next = null } = {}) {
    const lines = PLUG[p.leaf]
    const vars = p.vars
    const val = Object.fromEntries(Object.entries(vars).map(([k, v]) => [k, v.val]))
    const keys = [...new Set(lines.flatMap(l => l.order))]
    const color = Object.fromEntries(keys.map((k, i) => [k, 'pv' + (i % 5)]))
    const el = h('div', 'plug')
    const L = LEAVES[p.leaf]
    el.append(h('h3', '', `${L.name} · plug it in`), h('p', 'plug-sub', 'Every number in the story has a spot in the formula.'))
    const chips = h('div', 'plug-chips')
    const box = h('div')
    el.append(chips, box)
    const acts = h('div', 'row-actions')
    const replay = h('button', 'btn ghost', 'Replay')
    replay.type = 'button'
    acts.append(replay)
    if (next) acts.append(next)
    el.append(acts)

    const lineTex = (line, done, withResult) => {
      const s = (k, mode = 0) => {
        let body = SYM[k]
        if (done.has(k)) {
          const t = vars[k].tex
          body = mode === 2 || (mode === 1 && !/^\d+$/.test(t)) ? `\\left(${t}\\right)` : `{${t}}`
        }
        return color[k] ? `\\class{${color[k]}}{${body}}` : body
      }
      const r = withResult && line.result ? line.result(val) : ''
      return line.tex(s) + (r ? ` \\class{pvres}{${r}}` : '')
    }
    const chipFor = k => {
      let c = chips.querySelector(`[data-k="${k}"]`)
      if (c) return c
      const v = vars[k]
      c = h('span', 'plug-chip ' + color[k], `${CHIP_SYM[k] ?? k} = ${v.txt}`)
      c.dataset.k = k
      const why = v.from ? `“${v.from}”${v.note ? ' · ' + v.note : ''}` : v.note
      if (why) c.append(h('small', '', why))
      chips.append(c)
      return c
    }
    const story = () => sheet?.querySelector('.story')
    const lightStory = (phrase, cls) => story()?.replaceWith(storyMark(p.text, phrase, cls))

    function showFinal() {
      box.replaceChildren()
      for (const line of lines) {
        line.order.forEach(chipFor)
        const d = h('div', 'plug-line')
        d.append(tex(lineTex(line, new Set(line.order), true)))
        box.append(d)
      }
      if (sheet && p.clue) story()?.replaceWith(storyEl({ text: p.text, clue: p.clue }, true))
    }
    let run = 0
    async function play() {
      const me = ++run
      const alive = () => me === run && el.isConnected
      chips.replaceChildren()
      box.replaceChildren()
      for (const line of lines) {
        const done = new Set()
        const d = h('div', 'plug-line enter')
        const draw = res => d.replaceChildren(tex(lineTex(line, done, res)))
        draw(false)
        box.append(d)
        await wait(450)
        for (const k of line.order) {
          if (!alive()) return
          const v = vars[k]
          if (v.from) lightStory(v.from, color[k])
          const chip = chipFor(k)
          chip.animate([{ transform: 'scale(1.15)' }, { transform: 'none' }], { duration: 300 })
          await wait(420)
          if (!alive()) return
          const spots = [...d.querySelectorAll(`svg g.${color[k]}`)]
          await Promise.all(spots.map((g, i) => wait(i * 90).then(() => alive() && fly(chip, g, v.txt, color[k]))))
          if (!alive()) return
          done.add(k)
          draw(false)
          d.querySelectorAll(`svg g.${color[k]}`).forEach(g => g.classList.add('glow'))
          tone(semis(523.25, 4 + done.size * 2), 0, 0.09, 'sine', 0.08)
          await wait(260)
        }
        if (!alive()) return
        if (line.result) {
          await wait(200)
          if (!alive()) return
          draw(true)
          d.classList.remove('enter')
          void d.offsetWidth
          d.classList.add('bump')
          if (line.order.length) sfx.right(2)
        }
        await wait(500)
      }
      if (alive() && sheet && p.clue) story()?.replaceWith(storyEl({ text: p.text, clue: p.clue }, true))
    }
    replay.addEventListener('click', () => {
      if (reduced()) showFinal()
      else play()
    })
    if (auto && !reduced()) setTimeout(play, 0)
    else showFinal()
    return el
  }

  // the story with its deciding phrase highlighted (or plain, before the end)
  function storyEl(sc, lit) {
    const p = h('p', 'story')
    const at = lit ? sc.text.indexOf(sc.clue) : -1
    if (at < 0) {
      p.textContent = sc.text
      return p
    }
    p.append(document.createTextNode(sc.text.slice(0, at)), h('mark', 'clue', sc.clue), document.createTextNode(sc.text.slice(at + sc.clue.length)))
    return p
  }
  function leafCard(key) {
    const L = LEAVES[key]
    const c = h('div', 'leafcard')
    const t = h('h3', '', L.name)
    t.append(h('small', '', L.sec))
    const row = (label, text) => {
      const r = h('p')
      r.append(h('span', '', label), document.createTextNode(text))
      return r
    }
    const pdf = h('p')
    pdf.append(h('span', '', L.name === 'Chi-squared' ? 'Is' : 'pdf'), tex(L.tex, false))
    c.append(t, pdf, row('Use case', L.use), row('X is', L.x), row('Key', L.key))
    return c
  }
  // the whole tree as an outline: questions, the answers that branch, the leaves
  function outline(node) {
    const wrap = h('div')
    wrap.append(h('span', 'oq', node.q))
    const ul = h('ul')
    for (const b of node.branches) {
      const li = h('li')
      const a = h('span', 'oa')
      a.append(h('b', '', b.a), document.createTextNode(' · ' + b.more))
      li.append(a)
      if (b.leaf) {
        const L = LEAVES[b.leaf]
        const lf = h('span', 'oleaf')
        lf.append(h('b', '', L.name), document.createTextNode(` ${L.sec} · ${L.use}`), tex(L.tex, false))
        li.append(lf)
      } else li.append(outline(b.node))
      ul.append(li)
    }
    wrap.append(ul)
    return wrap
  }

  // the distributions a story is most often mistaken for
  const CONFUSED = {
    binomial: ['hyper', 'negbin', 'poisson', 'geometric'],
    geometric: ['negbin', 'binomial', 'exponential', 'poisson'],
    negbin: ['geometric', 'binomial', 'gamma', 'hyper'],
    hyper: ['binomial', 'poisson', 'negbin', 'geometric'],
    poisson: ['binomial', 'exponential', 'geometric', 'hyper'],
    uniform: ['normal', 'exponential', 'binomial', 'chi'],
    exponential: ['gamma', 'poisson', 'geometric', 'uniform'],
    gamma: ['exponential', 'negbin', 'chi', 'poisson'],
    chi: ['gamma', 'normal', 'exponential', 'uniform'],
    normal: ['uniform', 'chi', 'binomial', 'exponential'],
  }
  // a story, four distribution names, and the tree path as the explanation
  function treeProblem(leaf = pickOne(Object.keys(LEAVES))) {
    const sc = pickOne(STORIES[leaf])()
    const path = pathTo(leaf)
    const names = [leaf, ...CONFUSED[leaf].sort(() => Math.random() - 0.5).slice(0, 3)].sort(() => Math.random() - 0.5)
    return {
      ask: 'Which distribution does X have?',
      text: sc.text,
      latex: 'X \\sim \\,?',
      options: names.map(k => ({ name: LEAVES[k].name, latex: LEAVES[k].tex })),
      answer: 'abcd'[names.indexOf(leaf)],
      placeholder: 'a, b, c or d',
      hint: { text: `${path.map(x => x.b.a).join(' → ')}. ${path[path.length - 1].b.why}` },
      clue: sc.clue,
      leaf,
      vars: sc.vars,
    }
  }

  // ---------- tables and formula sheet ----------
  const overlay = document.getElementById('overlay')
  const TAB_NAMES = { binomial19: 'Binomial n = 19', binomial: 'Binomial n = 20', normal: 'Normal z', chi2: 'Chi-squared' }
  let tables = null
  function closeOverlay() {
    overlay.hidden = true
    overlay.replaceChildren()
    document.body.style.overflow = ''
  }
  function openTables(which = unit.tables[0]) {
    tables ??= unit.printedTables()
    overlay.replaceChildren()
    const inner = h('div', 'overlay-inner')
    const head = h('div', 'overlay-head')
    for (const name of unit.tables) {
      const b = h('button', 'tool', TAB_NAMES[name] ?? name)
      b.type = 'button'
      b.setAttribute('aria-pressed', String(name === which))
      b.addEventListener('click', () => openTables(name))
      head.append(b)
    }
    const close = h('button', 'tool', 'Close')
    close.type = 'button'
    close.addEventListener('click', closeOverlay)
    head.append(close)
    inner.append(head)
    const t = tables[which]
    inner.append(h('h3', '', t.title), h('p', 'note', t.note))
    const wrap = h('div', 'table-wrap')
    const table = h('table', 'ptable')
    const thead = h('thead')
    const hr = h('tr')
    hr.append(h('th', '', t.corner))
    t.cols.forEach(c => hr.append(h('th', '', c)))
    thead.append(hr)
    const tbody = h('tbody')
    t.rows.forEach(row => {
      const tr = h('tr')
      tr.append(h('th', '', row.label))
      row.values.forEach(v => tr.append(h('td', '', v)))
      tbody.append(tr)
    })
    table.append(thead, tbody)
    // tap a cell to light up its row and column, like a finger on the paper
    table.addEventListener('click', e => {
      const td = e.target.closest('td')
      if (!td) return
      const ri = td.parentElement.rowIndex
      const ci = td.cellIndex
      table.querySelectorAll('.line, .here').forEach(x => x.classList.remove('line', 'here'))
      for (const tr of table.rows) {
        if (tr.rowIndex === ri) for (const c of tr.cells) c.classList.add('line')
        else if (tr.cells[ci]) tr.cells[ci].classList.add('line')
      }
      td.classList.remove('line')
      td.classList.add('here')
    })
    wrap.append(table)
    inner.append(wrap)
    overlay.append(inner)
    overlay.hidden = false
    document.body.style.overflow = 'hidden'
  }
  async function openSheet() {
    await mathBoot
    overlay.replaceChildren()
    const inner = h('div', 'overlay-inner')
    const head = h('div', 'overlay-head')
    head.append(h('strong', '', 'Formula sheet'))
    const close = h('button', 'tool', 'Close')
    close.type = 'button'
    close.addEventListener('click', closeOverlay)
    head.append(close)
    inner.append(head)
    const group = (title, lines) => {
      inner.append(h('h3', '', title))
      const grid = h('div', 'sheet-grid')
      for (const f of lines) {
        const card = h('div', 'formula')
        card.append(h('p', '', f.label), tex(f.latex))
        grid.append(card)
      }
      inner.append(grid)
    }
    group('Printed on the sheet: you get these', unit.sheet.given)
    group('Might be on the sheet, might not: learn to build these yourself', unit.sheet.maybe)
    group('Never on the sheet: memorize these', unit.sheet.know)
    overlay.append(inner)
    overlay.hidden = false
    document.body.style.overflow = 'hidden'
  }

  // ---------- wiring ----------
  document.getElementById('home').addEventListener('click', () => {
    closeOverlay()
    renderMap()
  })
  document.getElementById('open-tables').addEventListener('click', () => openTables())
  document.getElementById('open-sheet').addEventListener('click', openSheet)
  document.getElementById('sound').addEventListener('click', () => {
    state.muted = !state.muted
    save()
    hud()
    if (!state.muted) sfx.right(0)
  })
  document.addEventListener('keydown', e => {
    if (!overlay.hidden) {
      if (e.key === 'Escape') closeOverlay()
      return
    }
    if (screen !== 'question' || e.metaKey || e.ctrlKey || e.altKey) return
    const k = e.key.toLowerCase()
    const idx = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k)
    const btns = [...view.querySelectorAll('.choice')]
    if (idx >= 0 && btns[idx] && !btns[idx].disabled) btns[idx].click()
  })

  // a new screen (question, card, results) starts with a clean page
  new MutationObserver(() => {
    clearInk()
    renderBuddy()
  }).observe(document.getElementById('view'), { childList: true })
  if (petTick()) setTimeout(() => toast('Devolved…'), 600)
  // a long-open tab gets hungry too
  setInterval(() => {
    petTick()
    if (screen === 'map') renderMap()
  }, 10 * 60 * 1000)
  hud()
  renderMap()
  connect()
})()
</script>

</body>
