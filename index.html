        lf.append(h('b', '', L.name), document.createTextNode(` ${L.sec} · ${L.use}`))
        li.append(lf)
      } else li.append(outline(b.node))
      ul.append(li)
    }
    wrap.append(ul)
    return wrap
  }

  function openTreeCard() {
    screen = 'card'
    view.replaceChildren()
    const sheet = h('section', 'sheet')
    sheet.append(h('div', 'eyebrow', 'Walk the tree · power-up'))
    sheet.append(h('h2', '', 'Which distribution?'))
    sheet.append(h('p', 'paper-note', 'Every question on the test starts here. Read the tree top to bottom once, then walk it for 8 stories.'))
    const o = h('div', 'outline')
    o.append(outline(TREE))
    sheet.append(o)
    const acts = h('div', 'row-actions')
    const go = h('button', 'btn', 'Walk it · 8 stories')
    go.type = 'button'
    go.addEventListener('click', startTree)
    const back = h('button', 'btn ghost', 'Map')
    back.type = 'button'
    back.addEventListener('click', renderMap)
    acts.append(go, back)
    sheet.append(acts)
    view.append(sheet)
    window.scrollTo({ top: 0 })
  }

  let walk = null
  function startTree() {
    // 8 different leaves, a fresh story for each
    const keys = Object.keys(LEAVES).sort(() => Math.random() - 0.5).slice(0, 8)
    const items = keys.map(k => ({ leaf: k, sc: pickOne(STORIES[k])(), path: pathTo(k), step: 0, missed: false }))
    walk = { items, at: 0, combo: 0, best: 0, misses: 0, gained: 0, marks: [] }
    // reuse the round bookkeeping for XP and streak sounds
    round = { short: 'Walk the tree', combo: 0, best: 0, misses: 0, gained: 0, marks: [], queue: items, at: 0 }
    showStep()
  }

  function showStep() {
    screen = 'tree'
    const it = walk.items[walk.at]
    view.replaceChildren()
    const sheet = h('section', 'sheet')
    const top = h('div', 'qtop')
    const prog = h('div', 'progress')
    walk.items.forEach((x, i) => prog.append(h('i', walk.marks[i] === 'ok' ? 'ok' : walk.marks[i] === 'bad' ? 'bad' : i === walk.at ? 'now' : '')))
    const combo = h('div', 'combo')
    combo.append(h('strong', '', `${round.combo}×`))
    ;['1σ', '2σ', '3σ'].forEach((s, i) => combo.append(h('span', comboTier(round.combo) > i ? 'on' : '', s)))
    top.append(prog, combo)
    sheet.append(top, h('div', 'eyebrow', `Walk the tree · story ${walk.at + 1} of ${walk.items.length}`))
    const done = it.step >= it.path.length
    sheet.append(storyEl(it.sc, done || it.missedHere))
    // the path so far
    const crumbs = h('div', 'crumbs')
    it.path.slice(0, it.step).forEach((s, i) => {
      if (i) crumbs.append(h('i', '', '→'))
      crumbs.append(h('span', '', s.b.a))
    })
    if (it.step) sheet.append(crumbs)

    if (done) {
      sheet.append(leafCard(it.leaf))
      const acts = h('div', 'row-actions')
      const next = h('button', 'btn', walk.at + 1 < walk.items.length ? 'Next story' : 'Finish')
      next.type = 'button'
      next.addEventListener('click', () => {
        walk.at++
        round.at = walk.at
        if (walk.at < walk.items.length) showStep()
        else finishTree()
      })
      acts.append(next)
      sheet.append(acts)
      view.append(sheet)
      next.focus({ preventScroll: true })
      window.scrollTo({ top: 0 })
      return
    }

    const { node, b: right } = it.path[it.step]
    sheet.append(h('div', 'step-q', node.q))
    const list = h('div', 'choices')
    const note = h('div')
    node.branches.forEach((b, i) => {
      const btn = h('button', 'choice')
      btn.type = 'button'
      const val = h('span', 'val')
      val.append(h('b', '', b.a), document.createTextNode(' · ' + b.more))
      btn.append(h('span', 'oval', 'ABCD'[i]), val)
      btn.addEventListener('click', () => {
        if (btn.disabled) return
        if (b === right) {
          list.querySelectorAll('button').forEach(x => (x.disabled = true))
          btn.classList.add('right')
          state.answered++
          state.correct++
          const gain = Math.round(5 * MULT[comboTier(round.combo)])
          state.xp += gain
          walk.gained += gain
          pop('+' + gain, btn)
          sfx.right(round.combo + it.step)
          hud()
          it.step++
          if (it.step >= it.path.length) {
            // a clean walk builds the streak
            if (!it.missed) {
              round.combo++
              round.best = Math.max(round.best, round.combo)
              const tier = comboTier(round.combo)
              if (round.combo === 3 || round.combo === 6) toast(`${tier}σ streak · ×${MULT[tier]}`)
            }
            walk.marks[walk.at] = it.missed ? 'bad' : 'ok'
          }
          setTimeout(showStep, 650)
          return
        }
        // wrong branch: say why, light up the clue, try again
        btn.disabled = true
        btn.classList.add('wrong')
        state.answered++
        if (!it.missed) {
          it.missed = true
          walk.misses++
        }
        round.combo = 0
        sfx.wrong()
        hud()
        note.replaceChildren()
        const why = h('div', 'why')
        why.append(h('h3', '', 'Not that branch'), h('p', '', right.why))
        why.append(h('p', '', 'The phrase that decides it is highlighted in the story. Pick again.'))
        note.append(why)
        it.missedHere = true
        const story = sheet.querySelector('.story')
        story.replaceWith(storyEl(it.sc, true))
      })
      list.append(btn)
    })
    sheet.append(list, note)
    view.append(sheet)
    window.scrollTo({ top: 0 })
  }

  function finishTree() {
    screen = 'results'
    const stars = walk.misses === 0 ? 3 : walk.misses <= 2 ? 2 : 1
    const before = level(state.xp)
    const bonus = 25 * stars
    state.xp += bonus
    state.tree = { stars: Math.max(state.tree?.stars ?? 0, stars), plays: (state.tree?.plays ?? 0) + 1 }
    markDay()
    save()
    hud()
    view.replaceChildren()
    const sheet = h('section', 'sheet')
    sheet.append(h('div', 'eyebrow', 'Walk the tree · cleared'), h('h2', '', 'Which distribution?'))
    const st = h('div', 'result-stars')
    for (let i = 0; i < 3; i++) {
      const s = h('span', i < stars ? '' : 'off', '★')
      s.style.animationDelay = i * 0.25 + 's'
      st.append(s)
    }
    sheet.append(st)
    const tally = h('div', 'tally')
    const cell = (label, value) => {
      const c = h('div')
      c.append(h('b', '', value), document.createTextNode(label))
      return c
    }
    tally.append(cell('XP', '+' + (walk.gained + bonus)), cell('best streak', String(round.best)), cell('wrong turns', String(walk.misses)))
    sheet.append(tally)
    sheet.append(h('p', 'note', stars === 3 ? 'Every story walked straight to its leaf. That is the skill.' : 'Run it again: the stories change, the tree does not.'))
    const acts = h('div', 'row-actions')
    const again = h('button', 'btn', 'Walk it again')
    again.type = 'button'
    again.addEventListener('click', startTree)
    const tree = h('button', 'btn ghost', 'See the tree')
    tree.type = 'button'
    tree.addEventListener('click', openTreeCard)
    const map = h('button', 'btn ghost', 'Map')
    map.type = 'button'
    map.addEventListener('click', renderMap)
    acts.append(again, tree, map)
    sheet.append(acts)
    view.append(sheet)
    window.scrollTo({ top: 0 })
    setTimeout(() => {
      sfx.clear()
      burst(stars === 3 ? 150 : 80)
      if (level(state.xp) > before) setTimeout(() => { toast(`Level ${level(state.xp)}!`); sfx.levelUp() }, 700)
    }, 150)
    walk = null
    round = null
  }

  // ---------- tables and formula sheet ----------
  const overlay = document.getElementById('overlay')
  const TAB_NAMES = { binomial19: 'Binomial n = 19', binomial: 'Binomial n = 20', normal: 'Normal z', chi2: 'Chi-squared' }
  let tables = null
  function closeOverlay() {
    overlay.hidden = true
    overlay.replaceChildren()
    document.body.style.overflow = ''
  }
  function openTables(which = unit.tables[0]) {
    tables ??= unit.printedTables()
    overlay.replaceChildren()
    const inner = h('div', 'overlay-inner')
    const head = h('div', 'overlay-head')
    for (const name of unit.tables) {
      const b = h('button', 'tool', TAB_NAMES[name] ?? name)
      b.type = 'button'
      b.setAttribute('aria-pressed', String(name === which))
      b.addEventListener('click', () => openTables(name))
      head.append(b)
    }
    const close = h('button', 'tool', 'Close')
    close.type = 'button'
    close.addEventListener('click', closeOverlay)
    head.append(close)
    inner.append(head)
    const t = tables[which]
    inner.append(h('h3', '', t.title), h('p', 'note', t.note))
    const wrap = h('div', 'table-wrap')
    const table = h('table', 'ptable')
    const thead = h('thead')
    const hr = h('tr')
    hr.append(h('th', '', t.corner))
    t.cols.forEach(c => hr.append(h('th', '', c)))
    thead.append(hr)
    const tbody = h('tbody')
    t.rows.forEach(row => {
      const tr = h('tr')
      tr.append(h('th', '', row.label))
      row.values.forEach(v => tr.append(h('td', '', v)))
      tbody.append(tr)
    })
    table.append(thead, tbody)
    // tap a cell to light up its row and column, like a finger on the paper
    table.addEventListener('click', e => {
      const td = e.target.closest('td')
      if (!td) return
      const ri = td.parentElement.rowIndex
      const ci = td.cellIndex
      table.querySelectorAll('.line, .here').forEach(x => x.classList.remove('line', 'here'))
      for (const tr of table.rows) {
        if (tr.rowIndex === ri) for (const c of tr.cells) c.classList.add('line')
        else if (tr.cells[ci]) tr.cells[ci].classList.add('line')
      }
      td.classList.remove('line')
      td.classList.add('here')
    })
    wrap.append(table)
    inner.append(wrap)
    overlay.append(inner)
    overlay.hidden = false
    document.body.style.overflow = 'hidden'
  }
  async function openSheet() {
    await mathBoot
    overlay.replaceChildren()
    const inner = h('div', 'overlay-inner')
    const head = h('div', 'overlay-head')
    head.append(h('strong', '', 'Formula sheet'))
    const close = h('button', 'tool', 'Close')
    close.type = 'button'
    close.addEventListener('click', closeOverlay)
    head.append(close)
    inner.append(head)
    const group = (title, lines) => {
      inner.append(h('h3', '', title))
      const grid = h('div', 'sheet-grid')
      for (const f of lines) {
        const card = h('div', 'formula')
        card.append(h('p', '', f.label), tex(f.latex))
        grid.append(card)
      }
      inner.append(grid)
    }
    group('Printed on the sheet: you get these', unit.sheet.given)
    group('Might be on the sheet, might not: learn to build these yourself', unit.sheet.maybe)
    group('Never on the sheet: memorize these', unit.sheet.know)
    overlay.append(inner)
    overlay.hidden = false
    document.body.style.overflow = 'hidden'
  }

  // ---------- wiring ----------
  document.getElementById('home').addEventListener('click', () => {
    closeOverlay()
    renderMap()
  })
  document.getElementById('open-tables').addEventListener('click', () => openTables())
  document.getElementById('open-sheet').addEventListener('click', openSheet)
  document.getElementById('sound').addEventListener('click', () => {
    state.muted = !state.muted
    save()
    hud()
    if (!state.muted) sfx.right(0)
  })
  document.addEventListener('keydown', e => {
    if (!overlay.hidden) {
      if (e.key === 'Escape') closeOverlay()
      return
    }
    if ((screen !== 'question' && screen !== 'tree') || e.metaKey || e.ctrlKey || e.altKey) return
    const k = e.key.toLowerCase()
    const idx = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k)
    const btns = [...view.querySelectorAll('.choice')]
    if (idx >= 0 && btns[idx] && !btns[idx].disabled) btns[idx].click()
  })

  hud()
  renderMap()
  connect()
})()
</script>
