<body>
<div class="app">
  <header class="hud">
    <button class="wordmark" id="home" type="button">Math 3800 Arcade</button>
    <div class="tools">
      <button class="tool" id="open-calc" type="button" aria-pressed="false">Calc</button>
      <button class="tool" id="open-ready" type="button">Weak spots</button>
      <button class="tool" id="open-tables" type="button" aria-pressed="false">Tables</button>
      <button class="tool" id="open-sheet" type="button">Formulas</button>
      <button class="tool" id="sound" type="button" aria-pressed="true">Sound</button>
    </div>
  </header>
  <main id="view"><p class="loading">Shuffling the deck…</p></main>
</div>
<div class="overlay" id="overlay" hidden></div>
<div class="calc" id="calc" role="dialog" aria-label="Calculator" hidden></div>
<div class="tables-pop" id="tables-pop" role="dialog" aria-label="Tables" hidden></div>
<canvas id="fx" aria-hidden="true"></canvas>
<canvas id="ink" aria-hidden="true"></canvas>
<div class="ink-tools" id="ink-tools" hidden>
  <button class="ink-clear" id="ink-erase" type="button" aria-pressed="false">Eraser</button>
  <button class="ink-clear" id="ink-clear" type="button">Clear ink</button>
</div>
