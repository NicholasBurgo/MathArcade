  // Six options where the question allows it: the answer plus five wrong ones.
  // Template distractors (the common mistakes) go first, then nearby values, the
  // same way the class app picks its four. Fixed lettered options stay as they are.
  const fmtChoice = v => String(parseFloat(Math.abs(v) < 1 ? v.toPrecision(4) : v.toFixed(4)))
  const shuffleArr = arr => {
    const a = [...arr]
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1))
      ;[a[i], a[j]] = [a[j], a[i]]
    }
    return a
  }
  const WRONG = 5
  function buildChoices6(p) {
    if (typeof p.answer === 'string') {
      if (p.options) return p.options.map((_, i) => ({ label: 'abcdefgh'[i], correct: 'abcdefgh'[i] === p.answer }))
      if (p.choices) {
        const wrong = [...new Set(p.choices.filter(c => c !== p.answer))].slice(0, WRONG)
        return shuffleArr([{ label: p.answer, correct: true }, ...wrong.map(w => ({ label: w, correct: false }))])
      }
      return T2.buildChoices(p)
    }
    const a = p.answer
    const tol = Math.max(p.tolerance ?? 1e-6, 1e-9)
    const generic =
      a > 0 && a < 1
        ? [1 - a, Math.min(0.99, a * 2), a / 2, Math.min(0.99, a + 0.1), Math.max(0.01, a - 0.1), Math.min(0.99, a + 0.05), Math.max(0.01, a - 0.05), Math.min(0.99, a + 0.2), Math.max(0.01, a - 0.2)]
        : Number.isInteger(a)
          ? [a + 1, a - 1, a * 2, Math.round(a / 2), a + 10, a + 2, a - 2, a * 3]
          : [a * 2, a / 2, a + 0.5, a - 0.5, a + 1, a - 1, a * 1.5]
    const used = new Set([fmtChoice(a)])
    const picked = []
    for (const c of [...(p.distractors ?? []), ...generic]) {
      if (picked.length === WRONG) break
      if (!Number.isFinite(c) || Math.abs(c - a) <= tol * (1 + 1e-9) || (a >= 0 && c < 0)) continue
      const l = fmtChoice(c)
      if (used.has(l) || Math.abs(parseFloat(l) - a) <= tol * (1 + 1e-9)) continue
      used.add(l)
      picked.push(c)
    }
    let bump = 1
    while (picked.length < WRONG) {
      const c = a + (Number.isInteger(a) ? bump : bump * 0.15)
      const l = fmtChoice(c)
      if (!used.has(l) && Math.abs(parseFloat(l) - a) > tol * (1 + 1e-9)) {
        used.add(l)
        picked.push(c)
      }
      bump += 1
    }
    return shuffleArr([{ label: fmtChoice(a), correct: true }, ...picked.map(v => ({ label: fmtChoice(v), correct: false }))])
  }
  // typed answers: the class app's check, except that "16" for 0.16 needs the % sign,
  // so a reciprocal slip (10 for 0.1) or a missing decimal is not marked right
  function checkTyped(raw, p) {
    const ok = T2.checkAnswer(raw, p)
    if (!ok || p.accept || typeof p.answer !== 'number' || /%/.test(raw)) return ok
    let t = String(raw).trim().toLowerCase().replace(/\s+/g, '').replace(/^[a-z]=/, '').replace(',', '.')
    const f = t.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/)
    const n = f ? (Number(f[2]) === 0 ? null : Number(f[1]) / Number(f[2])) : t !== '' && Number.isFinite(Number(t)) ? Number(t) : null
    return n !== null && Math.abs(n - p.answer) < (p.tolerance ?? 1e-6)
  }
  function choicesFor(p) {
    return buildChoices6(p).map(c => {
      if (p.options) {
        const o = p.options['abcdefgh'.indexOf(c.label)]
        if (typeof o === 'string') return { correct: c.correct, text: o }
        return o.name ? { correct: c.correct, name: o.name, tex: o.latex } : { correct: c.correct, tex: o.latex }
      }
      if (p.expr) return { correct: c.correct, tex: T2.toLatex(c.label, p.expr.vars) ?? c.label }
      return { correct: c.correct, text: c.label }
    })
  }

  function showQuestion() {
    screen = 'question'
    const q = round.queue[round.at]
    q.seen++
    const p = q.p
    view.replaceChildren()
    const sheet = h('section', 'sheet')
    const top = h('div', 'qtop')
    const prog = h('div', 'progress')
    round.queue.forEach((x, i) => {
      const mark = round.marks[i]
      prog.append(h('i', mark === 'ok' ? 'ok' : mark === 'bad' ? 'bad' : i === round.at ? 'now' : ''))
    })
    top.append(round.learn ? h('span', 'learn-tag', 'Learn mode · doesn’t count') : prog)
    sheet.append(top)
    sheet.append(h('div', 'eyebrow', round.short + (q.level ? ' · ' + q.level : '') + (round.paper ? ' · paper mode' : '') + (q.seen > 1 ? ' · second chance' : '')))
    if (p.ask) sheet.append(h('p', 'ask', p.ask))
    if (p.text) sheet.append(h('p', 'story', p.text))
    const qMath = tex(p.latex)
    qMath.classList.add('q-math')
    sheet.append(qMath)
    if (round.learn) sheet.append(learnBar(p, sheet))
    if (round.paper) {
      paperQuestion(p, sheet)
      return
    }
    if (p.buildIt) {
      buildQuestion(p, sheet)
      view.append(sheet)
      window.scrollTo({ top: 0 })
      return
    }
    if (p.leaf && p.vars) {
      pickQuestion(p, sheet)
      view.append(sheet)
      window.scrollTo({ top: 0 })
      return
    }
    const opts = choicesFor(p)
    const box = pickBox({
      placeholder: 'Choose an answer…',
      label: 'Answers',
      cls: 'answers',
      items: opts.map((o, i) => ({ key: i, row: () => optNodes(o), shown: () => optNodes(o) })),
      onCheck: (i, ui) => answer(i, opts, sheet, ui),
    })
    box.correctIndex = opts.findIndex(o => o.correct)
    sheet.append(box)
    view.append(sheet)
    window.scrollTo({ top: 0 })
  }

  // the last 12 first tries on each level, for readiness
  function track(right) {
    const q = round.queue[round.at]
    if (q.seen !== 1) return
    const r = (state.recent[q.level ?? round.short] ??= [])
    r.push(right ? 1 : 0)
    if (r.length > 12) r.shift()
    save()
  }
  // the streak, a sound and the progress mark for a right answer
  function award() {
    if (round.learn) {
      round.combo++
      sfx.right(round.combo)
      learnAnswered()
      return
    }
    track(true)
    state.answered++
    state.correct++
    round.combo++
    round.best = Math.max(round.best, round.combo)
    round.marks[round.at] = 'ok'
    sfx.right(round.combo)
    hud()
  }
  // a miss: the streak resets, and the question comes back at the end of the round (up to twice)
  function miss(q) {
    if (round.learn) {
      round.combo = 0
      sfx.wrong()
      learnAnswered()
      return
    }
    track(false)
    state.answered++
    round.combo = 0
    if (!q.missed) {
      q.missed = true
      round.misses++
    }
    round.marks[round.at] = 'bad'
    if (q.seen < 3) round.queue.push(q)
    sfx.wrong()
    hud()
  }
  function gotIt(q) {
    const acts = h('div', 'row-actions')
    const cont = h('button', 'btn', round.learn ? 'Next' : q.seen < 3 ? 'Got it · it comes back later' : 'Got it')
    cont.type = 'button'
    cont.addEventListener('click', advance)
    acts.append(cont)
    return { acts, cont }
  }

  // an option as it is drawn: a name and a formula, a formula, or words
  const optNodes = o => (o.name ? [h('b', 'choice-name', o.name), tex(o.tex, false)] : o.tex ? [tex(o.tex, false)] : [h('span', 'pick-text', o.text)])
  function answer(i, opts, sheet, { sel, check, wrap }) {
    if (round.locked) return
    round.locked = true
    sel.disabled = true
    check.disabled = true
    const q = round.queue[round.at]
    if (opts[i].correct) {
      wrap.classList.add('right')
      award()
      const p = q.p
      if (p.mgf) {
        showBuild(p, sheet)
        return
      }
      if (p.params) {
        showParams(p, sheet)
        return
      }
      if (p.leaf && p.vars) {
        showPlug(p, sheet)
        return
      }
      const level = q.level ?? round.short
      if (!isTree(level) && (p.answerLatex || p.hint)) {
        const next = h('button', 'btn', 'Next')
        next.type = 'button'
        next.addEventListener('click', advance)
        const panel = workPanel(p, { sheet, auto: true, next, level })
        sheet.append(panel)
        next.focus({ preventScroll: true })
        panel.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
        return
      }
      setTimeout(advance, 850)
      return
    }
    miss(q)
    wrap.classList.add('wrong')
    const good = opts.findIndex(o => o.correct)
    const why = h('div', 'why')
    why.append(h('h3', '', 'How it works'))
    const said = h('p', 'pick-said')
    said.append('You picked ', ...optNodes(opts[i]), '. The answer is ', ...optNodes(opts[good]), '.')
    why.append(said)
    const p = q.p
    if (p.hint?.latex) why.append(tex(p.hint.latex))
    if (p.hint?.text) why.append(h('p', '', p.hint.text))
    const shown = T2.answerDisplay(p)
    if (!p.options && shown) {
      why.append(h('p', '', 'Worked answer:'))
      why.append(tex(shown))
    }
    if (p.clue) sheet.querySelector('.story')?.replaceWith(storyEl({ text: p.text, clue: p.clue }, true))
    if (p.trap) why.append(h('p', 'trap', 'The trap: ' + p.trap))
    if (p.leaf) why.append(leafCard(p.leaf))
    if (p.mgf) why.append(mgfPlayer(p.mgf.build, { at: p.mgf.at }))
    if (p.params) why.append(paramCard(p.params, { host: sheet }))
    const { acts, cont } = gotIt(q)
    why.append(acts)
    sheet.append(why)
    cont.focus({ preventScroll: true })
    why.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
  }

  // a button that plays the tree's path to one distribution, right where it is
  function walkButton(leaf) {
    const b = h('button', 'btn ghost tw-open', 'Walk the tree to the answer')
    b.type = 'button'
    b.addEventListener('click', () => b.replaceWith(treeWalk({ leaf })))
    return b
  }

  function showPlug(p, sheet) {
    const next = h('button', 'btn', 'Next')
    next.type = 'button'
    next.addEventListener('click', advance)
    const panel = plugPanel(p, { sheet, auto: true, next })
    sheet.append(panel)
    next.focus({ preventScroll: true })
    panel.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
  }

  // ---------- World 0: pick from every distribution ----------
  // All ten, in the tree's order (counting, then measuring), so where a name sits
  // gives nothing away. Picking one shows its formula; Check grades it.
  const PICK_ORDER = ['binomial', 'geometric', 'negbin', 'hyper', 'poisson', 'uniform', 'exponential', 'gamma', 'chi', 'normal']
  // A dropdown answer: the options in a list (formulas drawn), the choice shown in the
  // box, then Check. Each item is { key, group?, row: () => nodes, shown: () => nodes }.
  function pickBox({ placeholder, label, items, onCheck, cls = '', title = 'Your answer' }) {
    const wrap = h('div', 'pick' + (cls ? ' ' + cls : ''))
    const box = h('div', 'pick-box')
    const toggle = h('button', 'pick-toggle')
    toggle.type = 'button'
    toggle.setAttribute('aria-haspopup', 'listbox')
    toggle.setAttribute('aria-expanded', 'false')
    const shown = h('span', 'pick-shown', placeholder)
    toggle.append(shown, h('span', 'pick-caret', '▾'))
    const list = h('div', 'pick-list')
    list.setAttribute('role', 'listbox')
    list.setAttribute('aria-label', label)
    list.hidden = true
    const rows = items.map(it => {
      if (it.group) list.append(h('div', 'pick-group', it.group))
      const row = h('button', 'pick-opt')
      row.type = 'button'
      row.setAttribute('role', 'option')
      row.setAttribute('aria-selected', 'false')
      row.append(...it.row())
      row.addEventListener('click', () => choose(it, row))
      list.append(row)
      return row
    })
    box.append(toggle, list)
    const check = h('button', 'btn', 'Check')
    check.type = 'button'
    check.disabled = true
    let chosen = null
    let chosenRow = null
    const away = e => {
      if (!box.contains(e.target)) open(false)
    }
    function open(on) {
      list.hidden = !on
      toggle.setAttribute('aria-expanded', String(on))
      if (on) {
        document.addEventListener('pointerdown', away, true)
        ;(chosenRow ?? rows[0]).focus({ preventScroll: true })
        box.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' })
      } else document.removeEventListener('pointerdown', away, true)
    }
    function choose(it, row) {
      chosen = it.key
      chosenRow = row
      shown.replaceChildren(...it.shown())
      rows.forEach(r => r.setAttribute('aria-selected', String(r === row)))
      check.disabled = false
      open(false)
      check.focus({ preventScroll: true })
    }
    toggle.addEventListener('click', () => open(list.hidden))
    list.addEventListener('keydown', e => {
      const i = rows.indexOf(document.activeElement)
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault()
        rows[Math.min(rows.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)))].focus()
      } else if (e.key === 'Escape') {
        open(false)
        toggle.focus()
      }
    })
    check.addEventListener('click', () => {
      if (chosen !== null) onCheck(chosen, { sel: toggle, check, wrap })
    })
    wrap.append(h('div', 'pick-label', title), box, check)
    // 1–8 or a–h on a keyboard picks that option
    wrap.pickNth = i => {
      if (!toggle.disabled) rows[i]?.click()
    }
    return wrap
  }

  function pickQuestion(p, sheet) {
    // every distribution with its formula, grouped like the tree
    const items = PICK_ORDER.map((k, i) => {
      const L = LEAVES[k]
      return {
        key: k,
        group: i === 0 ? 'Counting · whole numbers (Ch 3)' : k === 'uniform' ? 'Measuring · any decimal (Ch 4)' : null,
        row: () => {
          const name = h('span', 'pick-name', L.name)
          name.append(h('small', '', L.sec))
          return [name, tex(L.tex, false)]
        },
        shown: () => [h('b', 'choice-name', L.name), tex(L.tex, false)],
      }
    })
    const box = pickBox({ placeholder: 'Choose a distribution…', label: 'Distributions', items, onCheck: (k, ui) => answerPick(k, p, sheet, ui) })
    box.correctIndex = PICK_ORDER.indexOf(p.leaf)
    sheet.append(box)
  }
  function answerPick(pick, p, sheet, { sel, check, wrap }) {
    if (round.locked || !LEAVES[pick]) return
    round.locked = true
    sel.disabled = true
    check.disabled = true
    const q = round.queue[round.at]
    if (pick === p.leaf) {
      wrap.classList.add('right')
      award()
      showPlug(p, sheet)
      return
    }
    miss(q)
    wrap.classList.add('wrong')
    const why = h('div', 'why')
    why.append(h('h3', '', 'How it works'))
    why.append(h('p', '', `You picked ${LEAVES[pick].name}. The answer is ${LEAVES[p.leaf].name}.`))
    if (p.hint?.text) why.append(h('p', '', p.hint.text))
    if (p.clue) sheet.querySelector('.story')?.replaceWith(storyEl({ text: p.text, clue: p.clue }, true))
    if (p.trap) why.append(h('p', 'trap', 'The trap: ' + p.trap))
    if (p.read) why.append(readBlock(p, Object.fromEntries(p.read.notes.map(([k], i) => [k, 'pv' + i]))).el)
    why.append(leafCard(p.leaf))
    why.append(walkButton(p.leaf))
    const { acts, cont } = gotIt(q)
    why.append(acts)
    sheet.append(why)
    cont.focus({ preventScroll: true })
    why.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
  }

  // ---------- written answers: paper mode and the boss ----------
  const typeable = p => !p.options && !p.buildIt
  // the right answer and how to get it
  function solution(p) {
    if (p.buildIt) {
      const box = h('div', 'reveal-box')
      box.append(h('h3', '', 'Answer'), mgfPlayer(p.mgf.build))
      return box
    }
    if (p.leaf) {
      const box = h('div', 'reveal-box')
      box.append(h('h3', '', 'Answer'), leafCard(p.leaf), h('h3', '', 'How the tree gets there'), h('p', '', p.hint.text), walkButton(p.leaf))
      if (p.vars) box.append(plugPanel(p))
      return box
    }
    const box = h('div', 'reveal-box')
    box.append(h('h3', '', 'Answer'))
    if (p.options) {
      const o = p.options['abcdefgh'.indexOf(p.answer)]
      box.append(typeof o === 'string' ? h('p', '', o) : tex(o.latex))
    } else box.append(tex(T2.answerDisplay(p)))
    if (p.hint?.latex || p.hint?.text) {
      box.append(h('h3', '', 'How it works'))
      if (p.hint.latex) box.append(tex(p.hint.latex))
      if (p.hint.text) box.append(h('p', '', p.hint.text))
    }
    if (p.mgf) box.append(mgfPlayer(p.mgf.build, { at: p.mgf.at }))
    if (p.params) box.append(paramCard(p.params))
    return box
  }
  // a typed answer (formulas preview as you type), or a note to answer on paper
  // when the question only makes sense with its options
  function answerBox(p, onEnter) {
    const wrap = h('div', 'written')
    if (!typeable(p)) {
      wrap.append(h('p', 'paper-note', 'Write your answer on paper (the real test has no choices), then check it.'))
      return { el: wrap, input: null, value: () => '' }
    }
    const id = 'answer-' + Math.random().toString(36).slice(2, 8)
    const label = h('label', '', 'Your final answer (work it on paper first)')
    label.htmlFor = id
    const input = h('input', 'answer-input')
    input.id = id
    input.autocomplete = 'off'
    input.setAttribute('autocapitalize', 'none')
    input.spellcheck = false
    input.placeholder = p.placeholder ?? 'answer'
    input.enterKeyHint = 'go'
    wrap.append(label, input)
    if (p.expr) {
      const letters = p.expr.vars.join(', ')
      const hintText = `a formula in ${letters}: use ^ for powers, e^(...), C(n,k)`
      const preview = h('div', 'preview')
      let timer
      input.addEventListener('input', () => {
        clearTimeout(timer)
        timer = setTimeout(() => {
          const raw = input.value.trim()
          const l = raw ? T2.toLatex(raw, p.expr.vars) : null
          preview.replaceChildren(l ? tex(l, false) : document.createTextNode(raw ? `that doesn't read as a formula in ${letters} yet` : hintText))
        }, 200)
      })
      preview.textContent = hintText
      wrap.append(preview)
    }
    if (!p.expr && typeof p.answer === 'string' && p.choices?.length) {
      wrap.append(h('p', 'paper-note', 'Answer with one of: ' + [p.answer, ...p.choices].sort().join(', ')))
    }
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault()
        onEnter?.()
      }
    })
    return { el: wrap, input, value: () => input.value.trim() }
  }

  function paperQuestion(p, sheet) {
    const q = round.queue[round.at]
    const acts = h('div', 'row-actions')
    const box = answerBox(p, () => check.click())
    const check = h('button', 'btn', 'Check')
    check.type = 'button'
    const show = h('button', 'btn ghost', typeable(p) ? 'Show answer' : 'Check my answer')
    show.type = 'button'
    const settle = (right, revealed) => {
      if (round.locked) return
      round.locked = true
      acts.remove()
      if (box.input) box.input.disabled = true
      if (right) {
        sheet.append(h('div', 'verdict ok', revealed ? 'Counted. Nice.' : 'Correct!'))
        award()
        setTimeout(advance, revealed ? 600 : 1100)
        return
      }
      miss(q)
      sheet.append(h('div', 'verdict bad', revealed ? 'No problem: that is what practice is for.' : 'Not quite.'))
      if (!revealed) sheet.append(solution(p))
      const { acts: next, cont } = gotIt(q)
      sheet.append(next)
      cont.focus({ preventScroll: true })
      next.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
    }
    check.addEventListener('click', () => {
      const raw = box.value()
      if (!raw) return box.input?.focus()
      settle(checkTyped(raw, p), false)
    })
    show.addEventListener('click', () => {
      // look at the answer, then be honest about it
      acts.replaceChildren()
      sheet.insertBefore(solution(p), acts)
      const yes = h('button', 'btn', 'I had it')
      yes.type = 'button'
      yes.addEventListener('click', () => settle(true, true))
      const no = h('button', 'btn ghost', "I didn't")
      no.type = 'button'
      no.addEventListener('click', () => settle(false, true))
      acts.append(yes, no)
    })
    if (typeable(p)) acts.append(check)
    acts.append(show)
    sheet.append(box.el, acts)
    view.append(sheet)
    window.scrollTo({ top: 0 })
    box.input?.focus({ preventScroll: true })
  }

  function advance() {
    if (!round || screen !== 'question') return
    round.locked = false
    round.at++
    if (round.learn && round.at >= round.queue.length) round.queue.push(learnQ(round.short))
    if (round.at >= round.queue.length) finish()
    else showQuestion()
  }

  function finish() {
    screen = 'results'
    const r = round
    const stars = r.misses === 0 ? 3 : r.misses <= 2 ? 2 : 1
    const prev = state.stars[r.short] || 0
    state.stars[r.short] = Math.max(prev, stars)
    state.plays[r.short] = (state.plays[r.short] || 0) + 1
    save()
    hud()

    view.replaceChildren()
    const sheet = h('section', 'sheet')
    sheet.append(h('div', 'eyebrow', r.paper ? 'Level cleared · paper mode' : 'Level cleared'))
    sheet.append(h('h2', '', r.short))
    const st = h('div', 'result-stars')
    for (let i = 0; i < 3; i++) {
      const s = h('span', i < stars ? '' : 'off', '★')
      s.style.animationDelay = i * 0.25 + 's'
      st.append(s)
    }
    sheet.append(st)
    const tally = h('div', 'tally')
    const cell = (label, value) => {
      const c = h('div')
      c.append(h('b', '', value), document.createTextNode(label))
      return c
    }
    tally.append(cell('best streak', String(r.best)), cell('first-try misses', String(r.misses)))
    sheet.append(tally)
    const msg = stars === 3 ? 'Clean sheet. Every answer right the first time.' : stars === 2 ? 'Solid. One clean run gets the third star.' : 'Cleared. Run it again: the questions change every time.'
    sheet.append(h('p', 'note', msg + (stars > prev && prev ? ' New best!' : '')))
    const acts = h('div', 'row-actions')
    const i = ORDER.indexOf(r.short)
    const nextShort = ORDER[(i + 1) % ORDER.length]
    const again = h('button', stars < 3 ? 'btn' : 'btn ghost', 'Run it again')
    again.type = 'button'
    again.addEventListener('click', () => startRound(r.short))
    const nxt = h('button', stars < 3 ? 'btn ghost' : 'btn', 'Next level')
    nxt.type = 'button'
    nxt.addEventListener('click', () => openCard(nextShort))
    const map = h('button', 'btn ghost', 'Map')
    map.type = 'button'
    map.addEventListener('click', renderMap)
    acts.append(again, nxt, map)
    sheet.append(acts)
    view.append(sheet)
    window.scrollTo({ top: 0 })
    setTimeout(() => {
      sfx.clear()
      burst(stars === 3 ? 160 : 90)
    }, 150)
    round = null
  }

  // ---------- the practice test: one written question per level, graded after hand-in ----------
  let boss = null
  let clockTimer = null
  const mmss = ms => {
    const s = Math.floor(ms / 1000)
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
  }
  function stopClock() {
    clearInterval(clockTimer)
    clockTimer = null
  }

  async function startBoss() {
    view.replaceChildren(h('p', 'loading', 'Writing the test…'))
    await mathBoot
    const pick = T2.createFreshPicker()
    const items = BOSS_ORDER.map(short => {
      if (isTree(short)) return { short, p: treeProblem(undefined, true), raw: '', paper: false, result: null }
      if (isMgf(short)) return { short, p: mgfBuildProblem(), raw: '', paper: false, result: null }
      if (isParam(short)) return { short, p: paramProblem(), raw: '', paper: false, result: null }
      const topics = topicsOf(short)
      // a question that can be answered without its options, when the level has one
      let p
      for (let k = 0; k < 12; k++) {
        p = pick(topics[Math.floor(Math.random() * topics.length)])
        if (typeable(p)) break
      }
      return { short, p, raw: '', paper: false, result: null }
    })
    boss = { items, at: 0, start: Date.now(), end: null }
    stopClock()
    clockTimer = setInterval(() => {
      const el = document.getElementById('boss-clock')
      if (el && boss && !boss.end) el.textContent = mmss(Date.now() - boss.start)
    }, 1000)
    showBoss()
  }

  const bossDone = it => Boolean(it.raw || it.paper)
  function showBoss(confirming = false) {
    screen = 'boss'
    const it = boss.items[boss.at]
    const p = it.p
    view.replaceChildren()
    const sheet = h('section', 'sheet')
    const top = h('div', 'qtop')
    const nav = h('nav', 'boss-nav')
    nav.setAttribute('aria-label', 'questions')
    boss.items.forEach((x, i) => {
      const b = h('button', (bossDone(x) ? 'done' : '') + (i === boss.at ? ' here' : ''), String(i + 1))
      b.type = 'button'
      b.setAttribute('aria-label', `question ${i + 1}: ${x.short}`)
      b.addEventListener('click', () => { boss.at = i; showBoss() })
      nav.append(b)
    })
    const clock = h('div', 'clock', mmss(Date.now() - boss.start))
    clock.id = 'boss-clock'
    top.append(nav, clock)
    sheet.append(top, h('div', 'eyebrow', `Practice test · ${boss.at + 1} of ${boss.items.length} · ${it.short}`))
    if (p.ask) sheet.append(h('p', 'ask', p.ask))
    if (p.text) sheet.append(h('p', 'story', p.text))
    sheet.append(tex(p.latex))
    const last = boss.at === boss.items.length - 1
    const box = answerBox(p, () => (last ? showBoss(true) : go(1)))
    if (box.input) {
      box.input.value = it.raw
      box.input.addEventListener('input', () => {
        it.raw = box.input.value.trim()
        nav.children[boss.at].classList.toggle('done', bossDone(it))
      })
    }
    sheet.append(box.el)
    const onPaper = h('button', 'tool toggle', 'Done on paper')
    onPaper.type = 'button'
    onPaper.setAttribute('aria-pressed', String(it.paper))
    onPaper.addEventListener('click', () => {
      it.paper = !it.paper
      onPaper.setAttribute('aria-pressed', String(it.paper))
      nav.children[boss.at].classList.toggle('done', bossDone(it))
    })
    const mark = h('div', 'row-actions')
    mark.append(onPaper)
    sheet.append(mark)

    const go = d => { boss.at += d; showBoss() }
    const acts = h('div', 'row-actions')
    if (boss.at > 0) {
      const back = h('button', 'btn ghost', 'Back')
      back.type = 'button'
      back.addEventListener('click', () => go(-1))
      acts.append(back)
    }
    if (!last) {
      const next = h('button', 'btn', 'Next')
      next.type = 'button'
      next.addEventListener('click', () => go(1))
      acts.append(next)
    }
    if (confirming) {
      const left = boss.items.filter(x => !bossDone(x)).length
      acts.append(h('span', 'paper-note', `${left ? `${left} not done yet. ` : ''}Hand it in?`))
      const yes = h('button', 'btn', 'Hand it in')
      yes.type = 'button'
      yes.addEventListener('click', handIn)
      const no = h('button', 'btn ghost', 'Keep working')
      no.type = 'button'
      no.addEventListener('click', () => showBoss())
      acts.append(yes, no)
    } else {
      const hand = h('button', last ? 'btn' : 'btn ghost', 'Hand in')
      hand.type = 'button'
      hand.addEventListener('click', () => showBoss(true))
      acts.append(hand)
    }
    sheet.append(acts)
    view.append(sheet)
    window.scrollTo({ top: 0 })
    box.input?.focus({ preventScroll: true })
  }

  function handIn() {
    boss.end = Date.now()
    stopClock()
    for (const it of boss.items) {
      if (it.raw && typeable(it.p)) it.result = checkTyped(it.raw, it.p) ? 'ok' : 'bad'
    }
    renderReview()
  }

  function renderReview() {
    screen = 'boss-review'
    view.replaceChildren()
    const sheet = h('section', 'sheet')
    sheet.append(h('div', 'eyebrow', `Practice test · handed in after ${mmss(boss.end - boss.start)}`))
    sheet.append(h('h2', '', 'Check your work'))
    sheet.append(h('p', 'paper-note', 'Typed answers are graded for you. For the rest, compare with your paper and be honest.'))
    const score = h('p', 'score-line')
    const finishBtn = h('button', 'btn', 'See my score')
    finishBtn.type = 'button'
    finishBtn.addEventListener('click', bossResults)
    const update = () => {
      const ok = boss.items.filter(x => x.result === 'ok').length
      const left = boss.items.filter(x => !x.result).length
      score.textContent = left ? `${ok} right so far · ${left} left to mark` : `${ok} / ${boss.items.length} right · all marked`
      finishBtn.disabled = left > 0
    }
    sheet.append(score)
    boss.items.forEach((it, i) => {
      const row = h('article', 'review-item')
      const head = h('h4', '', `${i + 1}. ${it.short}`)
      const badge = h('span', 'mark')
      const paint = () => {
        badge.className = 'mark ' + (it.result === 'ok' ? 'ok' : it.result === 'bad' ? 'bad' : 'todo')
        badge.textContent = it.result === 'ok' ? 'right' : it.result === 'bad' ? 'missed' : 'to mark'
      }
      paint()
      head.append(badge)
      row.append(head)
      if (it.p.ask) row.append(h('p', 'ask', it.p.ask))
      if (it.p.text) row.append(h('p', 'story', it.p.text))
      row.append(tex(it.p.latex))
      if (it.raw) row.append(h('p', 'wrote', 'You typed: ' + it.raw))
      row.append(solution(it.p))
      if (!it.result) {
        const acts = h('div', 'row-actions')
        const yes = h('button', 'btn', 'I had it')
        yes.type = 'button'
        const no = h('button', 'btn ghost', "I didn't")
        no.type = 'button'
        const decide = r => {
          it.result = r
          acts.remove()
          paint()
          update()
        }
        yes.addEventListener('click', () => decide('ok'))
        no.addEventListener('click', () => decide('bad'))
        acts.append(yes, no)
        row.append(acts)
      }
      sheet.append(row)
    })
    const end = h('div', 'row-actions')
    end.append(finishBtn)
    sheet.append(end)
    update()
    view.append(sheet)
    window.scrollTo({ top: 0 })
  }

  function bossResults() {
    screen = 'boss-results'
    const n = boss.items.length
    const ok = boss.items.filter(x => x.result === 'ok').length
    const r = ok / n
    state.boss = { best: Math.max(state.boss?.best ?? 0, ok), runs: (state.boss?.runs ?? 0) + 1, last: ok }
    for (const it of boss.items) state.practice[it.short] = it.result === 'ok'
    save()
    hud()
    view.replaceChildren()
    const sheet = h('section', 'sheet')
    sheet.append(h('div', 'eyebrow', 'Practice test'))
    sheet.append(h('h2', '', `${ok} / ${n} · ${grade(r)}`))
    const tally = h('div', 'tally')
    const cell = (label, value) => {
      const c = h('div')
      c.append(h('b', '', value), document.createTextNode(label))
      return c
    }
    tally.append(cell('time', mmss(boss.end - boss.start)), cell('best ever', `${state.boss.best}/${n}`))
    sheet.append(tally)
    const missed = boss.items.filter(x => x.result !== 'ok')
    sheet.append(
      h('p', 'note', r >= 0.9 ? 'That is test-ready. Run it once more Monday night to be sure.' : r >= 0.7 ? 'Close. Clear the levels below once each, then take it again.' : 'Not yet. Each level below is about 5 minutes: clear them, then come back.'),
    )
    if (missed.length) {
      const redo = h('div', 'redo')
      for (const it of missed) {
        const b = h('button', 'tool', it.short)
        b.type = 'button'
        b.addEventListener('click', () => openCard(it.short))
        redo.append(b)
      }
      sheet.append(h('h3', '', 'Redo these levels'), redo)
    }
    const acts = h('div', 'row-actions')
    const again = h('button', 'btn', 'Take it again')
    again.type = 'button'
    again.addEventListener('click', startBoss)
    const map = h('button', 'btn ghost', 'Map')
    map.type = 'button'
    map.addEventListener('click', renderMap)
    acts.append(again, map)
    sheet.append(acts)
    view.append(sheet)
    window.scrollTo({ top: 0 })
    setTimeout(() => {
      if (r >= 0.7) {
        sfx.clear()
        burst(r >= 0.9 ? 200 : 110)
      } else sfx.right(0)
    }, 150)
    boss = null
  }

      tryFam('hyper', { N, r: rr, n }, x => (choose(rr, x) * choose(N - rr, n - x)) / choose(N, n), Math.max(0, n - (N - rr)), Math.min(n, rr))
    }
    for (const k of vals) if (k > 0 && k <= 60) tryFam('poisson', { k }, x => (Math.exp(-k) * k ** x) / fact(x), 0, Infinity)
    // exactly one distribution may fit; a hypergeometric with r and n swapped has the
    // same chances, so the story's sample says which number is n
    if (canon.size !== 1) return null
    if (found.length === 2 && found.every(f => f.key === 'hyper')) {
      const sample = new Set([...text.matchAll(/(?:n = |draws? |committee of |sample of |tests |calls on |interviews |picks |chooses |nets )(\d+)|(\d+)-card hand/g)].map(m => +(m[1] ?? m[2])))
      const pick = found.filter(f => sample.has(f.params.n))
      found.splice(0, found.length, ...pick)
    }
    if (found.length !== 1) return null
    const f = found[0]
    // draw from the low end to where (nearly) all of the chance is, and past the region
    let top = f.hi
    if (top === Infinity) {
      let cum = 0
      top = f.lo
      while (cum < 0.995 && top - f.lo < 160) cum += f.pmf(top++)
      for (const q of r.parts) if (Number.isFinite(q.hi)) top = Math.max(top, q.hi + 2)
      for (const q of r.parts) if (Number.isFinite(q.lo)) top = Math.max(top, q.lo + 2)
    }
    const xs = []
    for (let x = f.lo; x <= top; x++) xs.push(x)
    const P = f.params
    const title = {
      binomial: () => `binomial · n = ${P.n}, p = ${fmt(P.p)}`,
      geometric: () => `geometric · p = ${fmt(P.p)}`,
      negbin: () => `negative binomial · r = ${P.r}, p = ${fmt(P.p)}`,
      hyper: () => `hypergeometric · N = ${P.N}, r = ${P.r}, n = ${P.n}`,
      poisson: () => `Poisson · k = ${fmt(P.k)}`,
    }[f.key]()
    const tail = r.parts.some(q => q.hi === Infinity) && f.hi === Infinity ? ' (the lit bars run on to the right)' : ''
    return { kind: 'bars', title, xs, ys: xs.map(f.pmf), hits: new Set(xs.filter(x => inRegion(r, x))), note: `shaded: ${regionText(r)} ${shown4(p.answer)}${tail}` }
  }

  // the rate and mean in the wait's own units ("W is the wait, in minutes")
  function expTitle(p, lam) {
    const unit = /wait, in (\w+?)s?\b/.exec(p.text ?? '')?.[1]
    return unit ? `exponential · λ = ${fmt(lam)} per ${unit} (mean β = ${fmt(1 / lam)} ${unit}s)` : `exponential · λ = ${fmt(lam)} (mean β = ${fmt(1 / lam)})`
  }
  function continuousGraph(p, r) {
    if (r.v !== 'X' && r.v !== 'W') return null
    const { vals } = questionNumbers(p)
    const found = []
    // uniform on [A, B]
    if (saysUniform(p)) for (const A of vals) for (const B of vals) if (B > A && found.length < 2) {
      const cdf = x => Math.min(1, Math.max(0, (x - A) / (B - A)))
      if (exactly(areaCont(r, cdf), p.answer)) found.push({ key: 'uniform', A, B, cdf })
    }
    // exponential, with the rate in the wait's units (per minute, hour, day, …)
    const rates = new Set()
    for (const c of vals) if (c > 0) for (const f of [1, 60, 1 / 60, 24, 1 / 24, 1440, 1 / 1440, 7, 1 / 7]) rates.add(c * f).add(f / c)
    if (saysRate(p)) for (const lam of rates) if (found.length < 2) {
      const cdf = x => (x <= 0 ? 0 : x === Infinity ? 1 : 1 - Math.exp(-lam * x))
      if (exactly(areaCont(r, cdf), p.answer)) found.push({ key: 'exponential', lam, cdf })
    }
    const kinds = new Set(found.map(f => f.key + (f.key === 'uniform' ? f.A + ',' + f.B : +f.lam.toPrecision(12))))
    if (kinds.size !== 1) return null
    const f = found[0]
    const shades = r.parts.map(q => [q.lo, q.hi])
    const note = `shaded: ${regionText(r)} ${shown4(p.answer)}`
    if (f.key === 'uniform') {
      const w = f.B - f.A
      return { kind: 'curve', title: `uniform · A = ${f.A}, B = ${f.B}`, lo: f.A - 0.2 * w, hi: f.B + 0.2 * w, pdf: x => (x >= f.A && x <= f.B ? 1 / w : 0), flat: [f.A, f.B], shades, ticks: [f.A, f.B], note }
    }
    const hi = Math.max(-Math.log(0.002) / f.lam, ...r.parts.flatMap(q => [q.lo, q.hi]).filter(Number.isFinite).map(x => x * 1.5))
    return { kind: 'curve', title: expTitle(p, f.lam), lo: 0, hi, pdf: x => (x < 0 ? 0 : f.lam * Math.exp(-f.lam * x)), shades, ticks: [0, ...r.parts.flatMap(q => [q.lo, q.hi]).filter(x => Number.isFinite(x) && x > 0)], note }
  }

  // the normal: standard (Z) or with μ and σ from the story; forwards or backwards
  function normalGraph(p, r) {
    const text = p.text ?? ''
    let mu = 0, sig = 1, std = true
    const mm = /μ = (-?\d*\.?\d+)/.exec(text)
    if (mm) {
      const s1 = /σ = (\d*\.?\d+)/.exec(text), s2 = /σ² = ([\d,]*\.?\d+)/.exec(text)
      if (!s1 && !s2) return null
      mu = +mm[1]
      sig = s1 ? +s1[1] : Math.sqrt(+s2[1].replace(/,/g, ''))
      std = false
    } else if (!(r?.v === 'Z' || /Z|z_/.test(p.latex ?? ''))) return null
    const cdf = x => Phi((x - mu) / sig)
    const V = std ? 'Z' : 'X'
    const ans = p.answer
    let shades = null, marks = [], note = null
    const latex = (p.latex ?? '').replace(/\s+/g, ' ')
    if (r && (r.v === V || (std && r.v === 'Z')) && typeof ans === 'number') {
      if (!close(areaCont(r, cdf), ans, 0.006)) return null
      shades = r.parts.map(q => [q.lo, q.hi])
      note = `shaded: ${regionText(r)} ${shown4(ans)}`
    } else if (typeof ans === 'number') {
      let k
      const sub = s => s.replace(/-z_0/g, String(-ans)).replace(/z_0/g, String(ans))
      if (std && (k = /^(P\(.*z_0.*\)) = (\d*\.?\d+)$/.exec(latex))) {
        const rr = regionOf(sub(k[1]))
        if (!rr || !close(areaCont(rr, cdf), +k[2], 0.006)) return null
        shades = rr.parts.map(q => [q.lo, q.hi])
        note = `shaded: ${regionText(rr)} = ${k[2]}, so z₀ = ${fmt(ans)}`
      } else if (std && (k = /^z_\{(\d*\.?\d+)\} = \\,\?$/.exec(latex))) {
        if (!close(1 - cdf(ans), +k[1], 0.006)) return null
        shades = [[ans, Infinity]]
        note = `shaded: the area ${k[1]} to the right of z = ${fmt(ans)}`
      } else if (!std && (k = /the (\d+(?:\.\d+)?)(?:st|nd|rd|th) percentile:\s*\}?\s*x/.exec(latex))) {
        if (!close(cdf(ans), +k[1] / 100, 0.01)) return null
        shades = [[-Infinity, ans]]
        note = `shaded: the lowest ${k[1]}%, left of x = ${fmt(ans)}`
      } else if (!std && (k = /^x = (-?\d*\.?\d+), \\quad \\text\{percentile\}/.exec(latex))) {
        const x = +k[1]
        // the percentile as a left area (0.9887) or as a percent (98.87)
        const pct = ans <= 1 ? ans * 100 : ans
        if (!close(100 * cdf(x), pct, 0.6)) return null
        shades = [[-Infinity, x]]
        note = `shaded: the area left of x = ${x}, about ${+pct.toFixed(2)}%`
      } else if (!std && (k = /^x = (-?\d*\.?\d+), \\quad z = /.exec(latex))) {
        const x = +k[1]
        if (!close((x - mu) / sig, ans, 0.006)) return null
        marks = [x]
        note = `x = ${x} sits ${fmt(Math.abs(ans))} standard deviations ${ans < 0 ? 'below' : 'above'} μ`
      } else if (!std && (k = /^P\(x_1 < X < x_2\) = (\d*\.?\d+)$/.exec(latex))) {
        // the answer is either cut-off; the other is the same distance on the other side of μ
        const lo = Math.min(ans, 2 * mu - ans), hi2 = Math.max(ans, 2 * mu - ans)
        if (!close(cdf(hi2) - cdf(lo), +k[1], 0.01)) return null
        shades = [[lo, hi2]]
        note = `shaded: the middle ${+(+k[1] * 100).toFixed(4)}%, from ${fmt(lo)} to ${fmt(hi2)}`
      } else if (!std && (k = /(top|bottom) (\d+(?:\.\d+)?)%/.exec(text))) {
        const share = +k[2] / 100
        const area = k[1] === 'top' ? 1 - cdf(ans) : cdf(ans)
        if (!close(area, share, 0.01)) return null
        shades = [k[1] === 'top' ? [ans, Infinity] : [-Infinity, ans]]
        note = `shaded: the ${k[1]} ${k[2]}%, cut at x = ${fmt(ans)}`
      } else return null
    } else return null
    const lo = mu - 3.6 * sig, hi = mu + 3.6 * sig
    return { kind: 'curve', title: std ? 'standard normal · Z, μ = 0, σ = 1' : `normal · μ = ${fmt(mu)}, σ = ${fmt(sig)}`, lo, hi,
      pdf: x => Math.exp(-((x - mu) ** 2) / (2 * sig * sig)) / (sig * Math.sqrt(2 * Math.PI)),
      shades: (shades ?? []).map(([a, b]) => [Math.max(a, lo), Math.min(b, hi)]), marks, ticks: [-2, -1, 0, 1, 2].map(k => +(mu + k * sig).toFixed(6)), note }
  }

  function chiGraph(p, r) {
    const g = +(/γ = (\d+)/.exec(p.text ?? '')?.[1] ?? [...(p.answerLatex ?? '').matchAll(/\\gamma = (\d+)/g)].at(-1)?.[1] ?? NaN)
    if (!(g >= 1) || !/\\chi/.test(p.latex ?? '')) return null
    const cdf = x => chiCdf(x, g)
    const latex = (p.latex ?? '').replace(/\s+/g, ' ')
    const ans = p.answer
    let shades, note, k
    if (r && r.v === 'C' && typeof ans === 'number' && !/= \d*\.?\d+$/.test(latex.replace(/= \\,\?$/, ''))) {
      if (!close(areaCont(r, cdf), ans, 0.012)) return null
      shades = r.parts.map(q => [q.lo, q.hi])
      note = `shaded: ${regionText(r)} ${shown4(ans)}`
    } else if ((k = /^P\(\\chi\^2 (>|<|\\le|\\ge) c\) = (\d*\.?\d+)$/.exec(latex)) && typeof ans === 'number') {
      const right = k[1] === '>' || k[1] === '\\ge'
      const area = right ? 1 - cdf(ans) : cdf(ans)
      if (!close(area, +k[2], 0.012)) return null
      shades = [right ? [ans, Infinity] : [0, ans]]
      note = `shaded: the ${right ? 'right' : 'left'} area ${k[2]}, cut at c = ${fmt(ans)}`
    } else if ((k = /^\\chi\^2_\{(\d*\.?\d+)\} = \\,\?$/.exec(latex)) && typeof ans === 'number') {
      if (!close(1 - cdf(ans), +k[1], 0.012)) return null
      shades = [[ans, Infinity]]
      note = `shaded: the right area ${k[1]}, past χ² = ${fmt(ans)}`
    } else return null
    const hi = Math.max(g + 6 * Math.sqrt(2 * g), ...shades.flat().filter(Number.isFinite).map(x => x * 1.3))
    return { kind: 'curve', title: `chi-squared · γ = ${g}`, lo: 0, hi, pdf: x => gammaPdf(x, g / 2, 2), shades: shades.map(([a, b]) => [Math.max(0, a), Math.min(hi, b)]), ticks: [0, ...shades.flat().filter(x => Number.isFinite(x) && x > 0)], note }
  }

  // binomial table questions: n and the column p are named in the hint
  function binomialTableGraph(p, r) {
    const n = +(/n = (19|20) table/.exec(p.hint?.text ?? '')?.[1] ?? NaN)
    const pp = +(/column p = (\d*\.?\d+)/.exec(p.hint?.text ?? '')?.[1] ?? NaN)
    if (!(n > 0) || !(pp > 0)) return null
    const rr = r ?? regionOf(p.answerLatex)
    if (!rr || rr.v !== 'X') return null
    const pmf = x => choose(n, x) * pp ** x * (1 - pp) ** (n - x)
    if (!close(areaDisc(rr, pmf, 0, n), p.answer, 0.0006)) return null
    const xs = Array.from({ length: n + 1 }, (_, i) => i)
    return { kind: 'bars', title: `binomial · n = ${n}, p = ${fmt(pp)}`, xs, ys: xs.map(pmf), hits: new Set(xs.filter(x => inRegion(rr, x))), note: `shaded: ${regionText(rr)} ${shown4(p.answer)}` }
  }

  // uniform and exponential questions about the mean, variance or σ
  function statsGraph(p) {
    const latex = (p.latex ?? '').replace(/\s+/g, ' ')
    const ans = p.answer
    if (typeof ans !== 'number') return null
    const stat = /^E\[X\] = /.test(latex) ? 'mean' : /^\\operatorname\{Var\}X = /.test(latex) ? 'var' : /^\\sigma = /.test(latex) ? 'sd' : /^E\[X\^2\] = /.test(latex) ? 'm2'
      : /^E\[W\] = /.test(latex) ? 'Wmean' : /^\\sigma_W = /.test(latex) ? 'Wsd' : /^\\operatorname\{Var\}W = /.test(latex) ? 'Wvar' : null
    if (!stat) return null
    const { vals } = questionNumbers(p)
    if (stat[0] === 'W') {
      if (!saysRate(p)) return null
      const lam = stat === 'Wvar' ? 1 / Math.sqrt(ans) : 1 / ans
      // the rate must be one the story gives, in some units
      const ok = vals.some(c => [1, 60, 1 / 60, 24, 1 / 24].some(f => exactly(c * f, lam) || exactly(f / c, lam)))
      if (!ok) return null
      return { kind: 'curve', title: expTitle(p, lam), lo: 0, hi: -Math.log(0.01) / lam, pdf: x => lam * Math.exp(-lam * x), marks: [1 / lam], ticks: [0, 1 / lam], note: `the mean β = 1/λ = ${fmt(1 / lam)} is marked; σ is also β` }
    }
    if (!saysUniform(p)) return null
    const found = []
    for (const A of vals) for (const B of vals) if (B > A) {
      const v = { mean: (A + B) / 2, var: (B - A) ** 2 / 12, sd: (B - A) / Math.sqrt(12), m2: (B ** 3 - A ** 3) / (3 * (B - A)) }[stat]
      if (exactly(v, ans)) found.push([A, B])
    }
    if (found.length !== 1) return null
    const [A, B] = found[0], w = B - A
    return { kind: 'curve', title: `uniform · A = ${A}, B = ${B}`, lo: A - 0.2 * w, hi: B + 0.2 * w, pdf: x => (x >= A && x <= B ? 1 / w : 0), flat: [A, B], marks: [(A + B) / 2], ticks: [A, (A + B) / 2, B], note: `the mean (A + B)/2 = ${fmt((A + B) / 2)} is marked` }
  }

  // a question that writes out its own pdf, cdf or table is not one of the named distributions
  const ownsPdf = p => /\\begin\{cases\}|\\begin\{array\}|\\int|[fF]\(x\) =/.test(p.latex ?? '') || !p.text
  const saysUniform = p => /equally likely|uniform/i.test(p.text ?? '')
  const saysRate = p => /per (second|minute|hour|day|week|month|year)|\bevery\b|average rate/i.test(p.text ?? '')
  function inferGraph(p, level) {
    if (p.options || p.leaf) return null
    const r = regionOf(p.latex)
    try {
      if (level === 'Binomial table') return binomialTableGraph(p, r)
      if (level === 'Chi-squared table') return chiGraph(p, r)
      if (level === 'Normal table' || level === 'Normal word problems') return normalGraph(p, r)
      if (/\\chi/.test(p.latex ?? '')) return chiGraph(p, r)
      if (ownsPdf(p)) return null
      if (r && typeof p.answer === 'number') {
        if (r.v === 'Z' || /μ = /.test(p.text ?? '')) return normalGraph(p, r)
        if (saysUniform(p) || r.v === 'W') return continuousGraph(p, r)
        return discreteGraph(p, r)
      }
      return statsGraph(p)
    } catch {
      return null
    }
  }

  const wait = ms => new Promise(r => setTimeout(r, ms))
  // send a copy of a chip's number from the chip to a spot in the formula
  function fly(fromEl, toEl, text, cls) {
    const a = fromEl.getBoundingClientRect()
    const b = toEl.getBoundingClientRect()
    const f = h('div', 'flyer ' + cls, text)
    document.body.append(f)
    const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2
    const x1 = b.left + b.width / 2, y1 = b.top + b.height / 2
    const anim = f.animate(
      [
        { transform: `translate(${x0}px, ${y0}px) translate(-50%, -50%) scale(1.15)` },
        { transform: `translate(${(x0 + x1) / 2}px, ${Math.min(y0, y1) - 40}px) translate(-50%, -50%) scale(1.25)`, offset: 0.45 },
        { transform: `translate(${x1}px, ${y1}px) translate(-50%, -50%) scale(0.8)`, opacity: 0.4 },
      ],
      { duration: 560, easing: 'cubic-bezier(.45,0,.3,1)', fill: 'forwards' },
    )
    // a busy or backgrounded tab can stall an animation: never wait on it for long
    return Promise.race([anim.finished.catch(() => {}), wait(800)]).then(() => f.remove())
  }
  // the story with one phrase lit up in a number's colour
  function storyMark(text, phrase, cls) {
    const p = h('p', 'story')
    const at = phrase ? text.indexOf(phrase) : -1
    if (at < 0) p.textContent = text
    else p.append(document.createTextNode(text.slice(0, at)), h('mark', 'pvmark ' + cls, phrase), document.createTextNode(text.slice(at + phrase.length)))
    return p
  }
  // the panel: chips for the story's numbers, the formula lines, and a replay.
  // auto: play straight away (a right answer); otherwise it starts filled in
  function plugPanel(p, { sheet = null, auto = false, next = null } = {}) {
    const vars = p.vars
    // a number the story only implies gets its own line of work, just before it is used
    const val = Object.fromEntries(Object.entries(vars).map(([k, v]) => [k, v.val]))
    const T = Object.fromEntries(Object.entries(vars).map(([k, v]) => [k, v.tex]))
    const TXT = Object.fromEntries(Object.entries(vars).map(([k, v]) => [k, v.txt]))
    const lines = []
    for (const line of PLUG[p.leaf]) {
      if (line.when && !line.when(val)) continue
      for (const k of line.order) if (vars[k]?.work && !lines.some(l => l.key === k)) lines.push({ ...vars[k].work, key: k })
      lines.push(line)
      // the pieces on the side, then the rows that finish the formula with them
      if (line.pieces) lines.push(...line.pieces(val, T).filter(Boolean))
      if (line.finish) lines.push({ order: [], ...line.finish(val, T) })
      if (line.look) lines.push({ order: [], lookAt: line.look(val) })
    }
    const keys = [...new Set(lines.flatMap(l => l.order))]
    const color = Object.fromEntries(keys.map((k, i) => [k, 'pv' + (i % 5)]))
    const el = h('div', 'plug')
    const L = LEAVES[p.leaf]
    el.append(h('h3', '', `${L.name} · plug it in`))
    if (p.trap) el.append(h('p', 'plug-sub trap', 'The trap: ' + p.trap))
    el.append(h('p', 'plug-sub', 'Every number in the story has a spot in the formula. Numbers the story only hints at get worked out first, and so does every piece inside it.'))
    const chips = h('div', 'plug-chips')
    const box = h('div')
    el.append(chips, box)
    const acts = h('div', 'row-actions')
    const replay = h('button', 'btn ghost', 'Replay')
    replay.type = 'button'
    acts.append(replay)
    if (next) acts.append(next)
    el.append(acts)

    const stepsOf = line => (line.steps ? line.steps(val, T) : [])
    // the formula, then n rows of work under it, lined up on the = sign
    const lineTex = (line, done, n) => {
      const s = (k, mode = 0) => {
        let body = SYM[k]
        if (done.has(k)) {
          const t = vars[k].tex
          body = mode === 2 || (mode === 1 && !/^\d+$/.test(t)) ? `\\left(${t}\\right)` : `{${t}}`
        }
        return color[k] ? `\\class{${color[k]}}{${body}}` : body
      }
      const all = stepsOf(line)
      const cls = j => (j === all.length - 1 && !line.plain ? 'pvres' : 'pvstep')
      // the answer is boxed: the last row of a line that is not work on the side or a step on the way
      const mid = typeof line.mid === 'function' ? line.mid(val) : line.mid
      const answer = line.answer || (!line.key && !line.label && !line.plain && !mid && !line.pieces && !line.finish && !line.lookAt)
      const boxed = st => {
        const m = /^(=|\\approx)\s*([\s\S]*)$/.exec(st)
        return m ? `${m[1]} \\boxed{${m[2]}}` : `\\boxed{${st}}`
      }
      // a row with its own left side (calculator rows) keeps it outside the colour
      const row = (st, j) => {
        if (answer && j === all.length - 1 && !st.includes('&')) st = boxed(st)
        const at = st.indexOf('&')
        return at < 0 ? `&\\class{${cls(j)}}{{}${st}}` : `${st.slice(0, at)}&\\class{${cls(j)}}{{}${st.slice(at + 1)}}`
      }
      let rows
      if (line.lhs) {
        // finishing rows: one left side, the first row there from the start
        rows = all.slice(0, Math.max(1, n)).map((st, j) => (j ? '' : line.lhs + ' ') + row(st, j))
      } else {
        rows = [line.tex(s, val).replace(/ (=|\\approx) /, ' &$1 ')]
        all.slice(0, n).forEach((st, j) => rows.push(row(st, j)))
      }
      if (n >= all.length && done.size === line.order.length && line.tail) rows[rows.length - 1] += ' ' + line.tail(val)
      return `\\begin{aligned}${rows.join(' \\\\[2pt] ')}\\end{aligned}`
    }
    const chipFor = k => {
      let c = chips.querySelector(`[data-k="${k}"]`)
      if (c) return c
      const v = vars[k]
      c = h('span', 'plug-chip ' + color[k], `${CHIP_SYM[k] ?? k} = ${v.txt}`)
      c.dataset.k = k
      const why = v.from ? `“${v.from}”${v.note ? ' · ' + v.note : ''}` : v.note
      if (why) c.append(h('small', '', why))
      chips.append(c)
      return c
    }
    const story = () => sheet?.querySelector('.story')
    const lightStory = (phrase, cls) => story()?.replaceWith(storyMark(p.text, phrase, cls))

    function showFinal() {
      box.replaceChildren()
      if (p.read) box.append(readBlock(p, color).el)
      for (const line of lines) {
        if (line.lookAt) {
          const tl = tableLook(line.lookAt)
          if (tl) {
            box.append(tl.el)
            tl.final()
          }
          continue
        }
        line.order.forEach(chipFor)
        if (line.key) chipFor(line.key)
        if (line.label) box.append(h('div', 'piece-label', line.label))
        const d = h('div', 'plug-line' + (line.key || line.label ? ' work' : ''))
        d.append(tex(lineTex(line, new Set(line.order), Infinity)))
        box.append(d)
      }
      const gr = distGraph(p.leaf, val, TXT)
      if (gr) box.append(gr.el)
      if (sheet && p.clue) story()?.replaceWith(storyEl({ text: p.text, clue: p.clue }, true))
    }
    let run = 0
    async function play() {
      const me = ++run
      const alive = () => me === run && el.isConnected
      chips.replaceChildren()
      box.replaceChildren()
      // a question that gives a pdf or an MGF: read its numbers first
      if (p.read) {
        const rb = readBlock(p, color)
        box.append(rb.el)
        await rb.play(alive)
        if (!alive()) return
      }
      for (const line of lines) {
        if (line.lookAt) {
          const tl = tableLook(line.lookAt)
          if (!tl) continue
          box.append(tl.el)
          await tl.play(alive)
          if (!alive()) return
          continue
        }
        const done = new Set()
        // finishing rows show their first row straight away
        const first = line.lhs ? 1 : 0
        let n = first
        if (line.label) box.append(h('div', 'piece-label', line.label))
        const d = h('div', 'plug-line enter' + (line.key || line.label ? ' work' : ''))
        const draw = () => d.replaceChildren(tex(lineTex(line, done, n)))
        // a line of work starts at the words it comes from
        if (line.key && vars[line.key].from) lightStory(vars[line.key].from, color[line.key])
        draw()
        box.append(d)
        await wait(450)
        for (const k of line.order) {
          if (!alive()) return
          const v = vars[k]
          if (v.from) lightStory(v.from, color[k])
          const chip = chipFor(k)
          chip.animate([{ transform: 'scale(1.15)' }, { transform: 'none' }], { duration: 300 })
          await wait(420)
          if (!alive()) return
          const spots = [...d.querySelectorAll(`svg g.${color[k]}`)]
          await Promise.all(spots.map((g, i) => wait(i * 90).then(() => alive() && fly(chip, g, v.txt, color[k]))))
          if (!alive()) return
          done.add(k)
          draw()
          d.querySelectorAll(`svg g.${color[k]}`).forEach(g => g.classList.add('glow'))
          tone(semis(523.25, 4 + done.size * 2), 0, 0.09, 'sine', 0.08)
          await wait(260)
        }
        // the work, one row at a time; the last row is the answer
        const steps = stepsOf(line)
        for (let j = first; j <= steps.length; j++) {
          if (j === steps.length && !line.tail) break
          await wait(j > first ? 650 : 350)
          if (!alive()) return
          n = j + 1
          draw()
          const rows = d.querySelectorAll('svg g.pvstep, svg g.pvres')
          rows[rows.length - 1]?.classList.add('glow')
          if (j < steps.length) tone(semis(523.25, 9 + j * 2), 0, 0.1, 'sine', 0.07)
        }
        if (steps.length) {
          d.classList.remove('enter')
          void d.offsetWidth
          d.classList.add('bump')
          if (!line.key && !line.label) sfx.right(2)
        }
        // a worked-out number becomes a chip, ready to plug in
        if (line.key) chipFor(line.key).animate([{ transform: 'scale(1.25)' }, { transform: 'none' }], { duration: 350 })
        await wait(550)
      }
      // last, the picture: the distribution with these numbers, and the part asked about
      const gr = alive() && distGraph(p.leaf, val, TXT)
      if (gr) {
        box.append(gr.el)
        gr.el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
        await gr.play(alive)
      }
      if (alive() && sheet && p.clue) story()?.replaceWith(storyEl({ text: p.text, clue: p.clue }, true))
    }
    replay.addEventListener('click', () => {
      if (reduced()) showFinal()
      else play()
    })
    if (auto && !reduced()) setTimeout(play, 0)
    else showFinal()
    return el
  }

        vars: { mu: V(mu, null, 'the number times t is μ'), sig: worked(V(sig, null, `σ²/2 = ${fmt(half)}`), { order: [], tex: S => `${S('sig')} = \\sqrt{2(${fmt(half)})}`, steps: () => [`= \\sqrt{${sig * sig}}`, `= ${sig}`] }), x: V(mu + sig * pickOne([-1.5, -1, 1, 1.5, 2]), null, 'say X is this value') } } },
      () => { const mu = pickOne([16.1, 16.2]), x = +(mu + 0.2 * pickOne([-2, -1, 1, 1.5, 2])).toFixed(2); return { text: `The weights of “1-pound” bags of sugar are bell-shaped around a mean of ${mu} oz, with a standard deviation of 0.2 oz. X is a random bag's weight.`, clue: 'bell-shaped',
        trap: '“Bell-shaped around a mean, with a standard deviation” is the normal.',
        vars: { mu: V(mu, `mean of ${mu} oz`), sig: V(0.2, 'standard deviation of 0.2 oz'), x: V(x, null, 'say X is this weight') } } },
      () => { const mu = pickOne([1000, 1050, 1100]); return { text: `SAT scores follow a normal curve with mean ${mu} and variance 40,000. X is a random student's score.`, clue: 'a normal curve',
        trap: 'The variance is given, not σ: take the square root first, σ = √40,000 = 200.',
        vars: { mu: V(mu, `mean ${mu}`), sig: worked(V(200, 'variance 40,000', 'σ = √variance'), { order: [], tex: S => `${S('sig')} = \\sqrt{40{,}000}`, steps: () => ['= 200'] }), x: V(mu + pickOne([-300, -150, 100, 250]), null, 'say X is this score') } } },
    ],
  }

  // the story with its deciding phrase highlighted (or plain, before the end)
  function storyEl(sc, lit) {
    const p = h('p', 'story')
    const at = lit ? sc.text.indexOf(sc.clue) : -1
    if (at < 0) {
      p.textContent = sc.text
      return p
    }
    p.append(document.createTextNode(sc.text.slice(0, at)), h('mark', 'clue', sc.clue), document.createTextNode(sc.text.slice(at + sc.clue.length)))
    return p
  }
  function leafCard(key) {
    const L = LEAVES[key]
    const c = h('div', 'leafcard')
    const t = h('h3', '', L.name)
    t.append(h('small', '', L.sec))
    const row = (label, text) => {
      const r = h('p')
      r.append(h('span', '', label), document.createTextNode(text))
      return r
    }
    const pdf = h('p')
    pdf.append(h('span', '', L.name === 'Chi-squared' ? 'Is' : 'pdf'), tex(L.tex, false))
    c.append(t, pdf, row('Use case', L.use), row('X is', L.x), row('Key', L.key))
    return c
  }
  // ---------- the tree, animated: which distribution, and why ----------
  // A family-tree chart on its side. Boxes are the questions and the distributions;
  // the answers are written on the lines between them, so each path reads as a
  // sentence: "a count → successes in n independent tries → binomial". Playing a
  // path lights each line and box in turn, fades the other branches, says why, and
  // opens the distribution. The reasons are the tree's own (TREE), unchanged.
  const CHART = {
    q: 'Is X a count or a measurement?',
    kids: [
      { a: 'A count', more: 'whole numbers 0, 1, 2, … (Ch 3)', why: TREE.branches[0].why, q: 'What is X counting?', kids: [
        { a: 'Events in a window, at a rate', leaf: 'poisson' },
        { a: 'Picks from a group, no putting back', leaf: 'hyper' },
        { a: 'Successes in n independent tries', leaf: 'binomial' },
        { a: 'Tries until the 1st success', leaf: 'geometric' },
        { a: 'Tries until the r-th success', leaf: 'negbin' },
      ] },
      { a: 'A measurement', more: 'any decimal in a range (Ch 4)', why: TREE.branches[1].why, q: 'What is X measuring?', kids: [
        { a: 'A value from A to B, all equally likely', leaf: 'uniform' },
        { a: 'The wait for the 1st event', leaf: 'exponential' },
        { a: 'The wait for the α-th event', leaf: 'gamma' },
        { a: 'A χ² value (γ degrees of freedom)', leaf: 'chi' },
        { a: 'A bell-shaped amount (μ and σ)', leaf: 'normal' },
      ] },
    ],
  }
  function treeWalk({ leaf: only = null } = {}) {
    const ROW = 62, PAD = 6, ROOTW = 120, MIDW = 128, LEAFW = 132, GAP1 = 130, GAP2 = 212
    const X0 = PAD, X1 = X0 + ROOTW + GAP1, X2 = X1 + MIDW + GAP2
    const W = X2 + LEAFW + PAD
    // nodes: the root question, the two "what is it" questions, the ten distributions
    const nodes = []
    const root = { q: CHART.q, x: X0, w: ROOTW, kids: [] }
    nodes.push(root)
    let row = 0
    for (const m of CHART.kids) {
      const mid = { parent: root, q: m.q, a: m.a, more: m.more, why: m.why, x: X1, w: MIDW, kids: [] }
      root.kids.push(mid)
      nodes.push(mid)
      for (const k of m.kids) {
        // the reason for each distribution is the tree's own sentence for it
        const why = pathTo(k.leaf).at(-1).b.why
        const more = pathTo(k.leaf).at(-1).b.more
        const leaf = { parent: mid, leaf: k.leaf, a: k.a, more, why, x: X2, w: LEAFW, cy: PAD + 26 + row++ * ROW + ROW / 2, kids: [] }
        mid.kids.push(leaf)
        nodes.push(leaf)
      }
      mid.cy = (mid.kids[0].cy + mid.kids[mid.kids.length - 1].cy) / 2
    }
    root.cy = (root.kids[0].cy + root.kids[1].cy) / 2
    const H = PAD * 2 + 26 + row * ROW
    const svg = svgEl('svg', { class: 'lineage', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Decision tree: which distribution' })
    svg.style.maxWidth = W + 'px'
    const lines = svgEl('g'), labels = svgEl('g')
    svg.append(lines, labels)
    const wrapText = (s, max) => {
      const out = []
      let line = ''
      for (const w of s.split(' ')) {
        if ((line + ' ' + w).trim().length > max && line) {
          out.push(line)
          line = w
        } else line = (line + ' ' + w).trim()
      }
      if (line) out.push(line)
      return out
    }
    // column headings, so the three columns read as question → answer → distribution
    const head = (x, t) => labels.append(svgEl('text', { x, y: PAD + 12, class: 'lt-head' }, t))
    head(X0, 'Ask')
    head(X0 + ROOTW + 14, 'Answer')
    head(X1, 'Then ask')
    head(X1 + MIDW + 14, 'Answer')
    head(X2, 'Distribution')
    for (const n of nodes) {
      const g = svgEl('g', { class: 'lt-node' + (n.leaf ? ' leaf' : '') + (n === root ? ' root' : '') })
      const rows = n.leaf
        ? [['name', LEAVES[n.leaf].name.toUpperCase()], ['sec', LEAVES[n.leaf].sec]]
        : wrapText(n.q, 15).map(t => ['q', t])
      const lh = { q: 17, name: 19, sec: 14 }
      const hgt = rows.reduce((s, [k]) => s + lh[k], 0) + 14
      n.h = hgt
      n.y = n.cy - hgt / 2
      g.append(svgEl('rect', { x: n.x, y: n.y, width: n.w, height: hgt, rx: 9 }))
      let ty = n.y + 7
      for (const [k, t] of rows) {
        ty += lh[k]
        g.append(svgEl('text', { x: n.x + n.w / 2, y: ty - 3, class: 'lt-' + k, 'text-anchor': 'middle' }, t))
      }
      if (n.leaf) {
        g.setAttribute('role', 'button')
        g.setAttribute('tabindex', '0')
        g.setAttribute('aria-label', `Show the path to ${LEAVES[n.leaf].name}`)
        g.addEventListener('click', () => play([n.leaf]))
        g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play([n.leaf]) } })
      }
      n.g = g
      svg.append(g)
    }
    // the lines, each with its answer written along the last stretch into the box
    for (const n of nodes) if (n.parent) {
      const p = n.parent, x1 = p.x + p.w, turn = x1 + 12
      const d = `M${x1},${p.cy} H${turn} V${n.cy} H${n.x}`
      lines.append(n.line = svgEl('path', { d, class: 'lt-line' }))
      lines.append(n.glow = svgEl('path', { d, class: 'lt-glow', pathLength: 100 }))
      const words = wrapText(n.a, n.leaf ? 28 : 14)
      const label = svgEl('text', { x: turn + 8, y: n.cy - 6 - (words.length - 1) * 14, class: 'lt-label' + (n.leaf ? '' : ' big') })
      words.forEach((w, i) => label.append(svgEl('tspan', { x: turn + 8, dy: i ? 14 : 0 }, w)))
      labels.append(label)
      n.label = label
    }
    const dot = svgEl('circle', { r: 6, class: 'lt-dot' })
    dot.style.display = 'none'
    svg.append(dot)

    const wrap = h('div', 'twalk')
    const bar = h('div', 'twalk-bar')
    const playAll = h('button', 'btn', only ? '▶ Play it again' : '▶ Play every path')
    playAll.type = 'button'
    const stop = h('button', 'btn ghost', 'Stop')
    stop.type = 'button'
    stop.hidden = true
    bar.append(playAll, stop, h('span', 'twalk-hint', only ? '' : 'or tap a distribution to see only its path'))
    const scroller = h('div', 'lineage-scroll')
    scroller.append(svg)
    // the caption sits above the chart, so the words stay in view while a path plays
    const caption = h('div', 'lt-caption')
    caption.hidden = true
    wrap.append(bar, caption, scroller)

    const follow = n => n.g.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
    function reset() {
      svg.classList.remove('walking')
      for (const n of nodes) {
        n.g.classList.remove('lit', 'nope', 'here')
        n.glow?.classList.remove('on')
        n.label?.classList.remove('lit', 'nope')
      }
      dot.style.display = 'none'
      caption.hidden = true
      caption.replaceChildren()
    }
    // the dot runs along the line to the next box
    const run = (n, ms) => new Promise(done => {
      const len = n.glow.getTotalLength()
      const t0 = performance.now()
      dot.style.display = ''
      const step = now => {
        const k = Math.min(1, (now - t0) / ms)
        const pt = n.glow.getPointAtLength(len * k)
        dot.setAttribute('cx', pt.x)
        dot.setAttribute('cy', pt.y)
        if (k < 1) requestAnimationFrame(step)
        else done()
      }
      requestAnimationFrame(step)
      setTimeout(done, ms + 200)
    })
    let runId = 0
    async function play(leaves) {
      const me = ++runId
      const alive = () => me === runId && wrap.isConnected
      playAll.hidden = true
      stop.hidden = false
      for (const leaf of leaves) {
        reset()
        svg.classList.add('walking')
        const end = nodes.find(x => x.leaf === leaf)
        const path = [root, end.parent, end]
        root.g.classList.add('lit', 'here')
        follow(root)
        caption.hidden = false
        caption.replaceChildren(h('p', 'lt-ask', root.q))
        tone(semis(523.25, 4), 0, 0.08, 'sine', 0.06)
        await wait(reduced() ? 0 : 900)
        for (const n of path.slice(1)) {
          if (!alive()) return
          for (const s of n.parent.kids) if (s !== n) {
            s.g.classList.add('nope')
            s.label.classList.add('nope')
          }
          n.glow.classList.add('on')
          n.label.classList.add('lit')
          follow(n)
          if (!reduced()) await run(n, 750)
          if (!alive()) return
          for (const x of nodes) x.g.classList.remove('here')
          n.g.classList.add('lit', 'here')
          const said = h('p', 'lt-said')
          said.append(h('b', '', n.a), document.createTextNode(n.more ? ' · ' + n.more : ''))
          caption.replaceChildren(h('p', 'lt-ask', n.parent.q), said, h('p', 'lt-why', n.why))
          tone(semis(523.25, 9), 0, 0.08, 'sine', 0.06)
          await wait(reduced() ? 0 : n.leaf ? 1200 : 2400)
        }
        if (!alive()) return
        dot.style.display = 'none'
        caption.append(leafCard(leaf))
        sfx.right(2)
        await wait(reduced() ? 0 : 4800)
        if (!alive()) return
      }
      playAll.hidden = false
      stop.hidden = true
    }
    playAll.addEventListener('click', () => play(only ? [only] : PICK_ORDER))
    stop.addEventListener('click', () => {
      runId++
      reset()
      playAll.hidden = false
      stop.hidden = true
    })
    if (only) setTimeout(() => play([only]), 0)
    return wrap
  }

  // ---------- reading a pdf or an MGF: which distribution, and its numbers ----------
  // Each shape: its general form with the parameters coloured, an example in the same
  // colours, how to read each number, and what it is (special cases included).
  const shp = (k, body) => `\\class{pv${k}}{${body}}`
  const SHAPES = [
    { kind: 'MGF', leaf: 'normal', general: `m(t) = e^{${shp(0, '\\mu')}t + ${shp(1, '\\sigma^2/2')}\\,t^2}`, example: `m(t) = e^{${shp(0, '3')}t + ${shp(1, '8')}t^2}`,
      notes: [[0, 'the number times t is μ: μ = 3'], [1, 'the number times t² is σ²/2: σ² = 2(8) = 16, so σ = 4']], verdict: 'normal, μ = 3, σ = 4' },
    { kind: 'MGF', leaf: 'gamma', general: `m(t) = (1 - ${shp(0, '\\beta')}t)^{-${shp(1, '\\alpha')}}`, example: `m(t) = (1 - ${shp(0, '3')}t)^{-${shp(1, '4')}}`,
      notes: [[0, 'the number times t is β: β = 3'], [1, 'the power, without its minus, is α: α = 4']], verdict: 'gamma, α = 4, β = 3. If β = 2 it is chi-squared (γ = 2α); if α = 1 it is exponential' },
    { kind: 'MGF', leaf: 'chi', general: `m(t) = (1 - 2t)^{-${shp(0, '\\gamma/2')}}`, example: `m(t) = (1 - 2t)^{-${shp(0, '5')}}`,
      notes: [[0, 'β is 2, so it is chi-squared; the power is γ/2 = 5, so γ = 10']], verdict: 'chi-squared, γ = 10' },
    { kind: 'MGF', leaf: 'exponential', general: `m(t) = \\frac{1}{1 - ${shp(0, '\\beta')}t}`, example: `m(t) = \\frac{1}{1 - ${shp(0, '4')}t}`,
      notes: [[0, 'the power is −1 (α = 1), and the number times t is β = 4, so λ = 1/4']], verdict: 'exponential, β = 4, λ = 1/4' },
    { kind: 'MGF', leaf: 'geometric', general: `m(t) = \\frac{${shp(0, 'p')}e^t}{1 - ${shp(1, 'q')}e^t}`, example: `m(t) = \\frac{${shp(0, '0.3')}e^t}{1 - ${shp(1, '0.7')}e^t}`,
      notes: [[0, 'the number on top, times eᵗ, is p = 0.3'], [1, 'the number subtracted below is q = 0.7 (and p + q = 1)']], verdict: 'geometric, p = 0.3' },
    { kind: 'pdf', leaf: 'uniform', general: `f(x) = \\frac{1}{${shp(1, 'B')} - ${shp(0, 'A')}},\\ ${shp(0, 'A')} \\le x \\le ${shp(1, 'B')}`, example: `f(x) = \\frac{1}{8},\\ ${shp(0, '2')} \\le x \\le ${shp(1, '10')}`,
      notes: [[0, 'a constant, from A = 2'], [1, 'to B = 10; the height is 1/(10 − 2) = 1/8']], verdict: 'uniform, A = 2, B = 10' },
    { kind: 'pdf', leaf: 'exponential', general: `f(x) = ${shp(0, '\\lambda')}e^{-${shp(0, '\\lambda')}x},\\ x > 0`, example: `f(x) = ${shp(0, '3')}e^{-${shp(0, '3')}x},\\ x > 0`,
      notes: [[0, 'the same number in front and times x in the exponent: λ = 3. Written with β it is (1/β)e^(−x/β), β = 1/3']], verdict: 'exponential, λ = 3 (a gamma with α = 1)' },
    { kind: 'pdf', leaf: 'gamma', general: `f(x) = \\frac{x^{${shp(0, '\\alpha')}-1}e^{-x/${shp(1, '\\beta')}}}{\\Gamma(\\alpha)\\beta^{\\alpha}}`, example: `f(x) = \\frac{1}{16}\\,x^{${shp(0, '1')}}e^{-x/${shp(1, '4')}},\\ x > 0`,
      notes: [[0, 'the power of x is α − 1 = 1, so α = 2'], [1, 'x is divided by β = 4 in the exponent (check: Γ(2)·4² = 16)']], verdict: 'gamma, α = 2, β = 4. With β = 2 it would be chi-squared' },
    { kind: 'pdf', leaf: 'normal', general: `f(x) = \\frac{1}{\\sqrt{2\\pi}\\,${shp(1, '\\sigma')}}e^{-(x - ${shp(0, '\\mu')})^2/(2${shp(1, '\\sigma')}^2)}`, example: `f(x) = \\frac{1}{\\sqrt{2\\pi}\\,${shp(1, '5')}}e^{-(x - ${shp(0, '70')})^2/50}`,
      notes: [[0, 'x minus μ is squared in the exponent: μ = 70'], [1, 'σ = 5 in front; below, 2σ² = 2(25) = 50']], verdict: 'normal, μ = 70, σ = 5' },
  ]
  function shapeGuide(kind) {
    const wrap = h('section', 'shapes')
    wrap.append(h('h3', 'shapes-title', kind === 'MGF' ? 'Given an MGF? Read its shape' : 'Given a pdf instead of a story? Read its shape'),
      h('p', 'paper-note', 'Match the formula to a shape below. The colours show where each number sits in the shape, and what it is.'))
    const play = h('button', 'btn ghost', '▶ Play the shapes')
    play.type = 'button'
    const list = h('div', 'shape-list')
    const cards = SHAPES.filter(sh => sh.kind === kind).map(sh => {
      const card = h('div', 'shape-card')
      const top = h('div', 'shape-top')
      top.append(h('b', '', LEAVES[sh.leaf].name), h('span', '', sh.kind))
      const row = (label, latex) => {
        const r = h('div', 'shape-row')
        r.append(h('span', '', label), tex(latex))
        return r
      }
      const parts = [...sh.notes.map(([k, t]) => h('p', `read-note pv${k}`, t)), h('p', 'read-shape', '→ ' + sh.verdict)]
      card.append(top, row('Shape', sh.general), row('Example', sh.example), ...parts)
      const from = { normal: 'normal', gamma: 'gamma', chi: 'chi', exponential: 'expB', geometric: 'geo' }[sh.leaf]
      if (sh.kind === 'MGF' && from) {
        const b = h('button', 'tool', 'Where it comes from')
        b.type = 'button'
        b.addEventListener('click', () => {
          card.classList.add('open')
          b.replaceWith(mgfPlayer(BUILDS[from](), { auto: true }))
        })
        card.append(b)
      }
      list.append(card)
      return { card, parts }
    })
    let run = 0
    play.addEventListener('click', async () => {
      const me = ++run
      const alive = () => me === run && wrap.isConnected
      for (const c of cards) for (const x of c.parts) x.hidden = true
      for (const c of cards) {
        if (!alive()) return
        for (const x of cards) x.card.classList.remove('lit')
        c.card.classList.add('lit')
        c.card.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
        await wait(reduced() ? 0 : 800)
        for (const x of c.parts) {
          if (!alive()) return
          x.hidden = false
          x.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: 300 })
          tone(semis(523.25, 7), 0, 0.08, 'sine', 0.06)
          await wait(reduced() ? 0 : 1500)
        }
        await wait(reduced() ? 0 : 700)
      }
      for (const x of cards) x.card.classList.remove('lit')
    })
    wrap.append(play, list)
    return wrap
  }
  // the formula a question gives, its numbers coloured and read off one by one
  function readBlock(p, color) {
    const r = p.read
    const cw = (k, body) => `\\class{${color[k] ?? 'pv0'}}{${body}}`
    const el = h('div', 'read-block')
    const parts = [...r.notes.map(([k, text]) => h('p', 'read-note ' + (color[k] ?? 'pv0'), text)), h('p', 'read-shape', '→ ' + r.shape)]
    el.append(h('div', 'piece-label', `Read the ${r.kind}`), tex(r.tex(cw)), ...parts)
    return {
      el,
      async play(alive) {
        for (const x of parts) x.hidden = true
        await wait(reduced() ? 0 : 600)
        for (const x of parts) {
          if (!alive()) return
          x.hidden = false
          x.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: 300 })
          tone(semis(523.25, 7), 0, 0.08, 'sine', 0.06)
          await wait(reduced() ? 0 : 1500)
        }
      },
    }
  }

  // ---------- World 0, level 3: where an MGF comes from ----------
  // Every MGF is one recipe, m_X(t) = E[e^(tX)]: e^(tx) times the pdf, added up
  // (Σ for a count, ∫ for a measurement), then simplified with a few moves. The
  // lines follow the class notes: the geometric's p/q script, f(x) = e^(−x), the
  // exponential with β or λ, the uniform, a pdf table. \HL{…} marks what a line changed.
  const R = String.raw
  const hlTex = s => s.replace(/\\HL\{/g, '\\class{mg-hl}{')
  const plainTex = s => s.replace(/\\HL\{/g, '{')
  // the moves, coloured by kind: set up, rewrite, the sum or integral rule, tidy, check
  const MOVES = {
    setup: { name: 'Set up', mv: 'mv-s', rule: R`m_X(t) = E[e^{tX}] = \sum_x e^{tx} f(x) \ \text{ or } \int e^{tx} f(x)\,dx` },
    from: { name: 'Start from', mv: 'mv-s' },
    combine: { name: 'Combine exponents', mv: 'mv-a', rule: R`e^{a}e^{b} = e^{a+b}` },
    square: { name: 'Complete the square', mv: 'mv-a' },
    diff: { name: 'Differentiate', mv: 'mv-a' },
    pull: { name: 'Pull out', mv: 'mv-b', rule: R`\begin{gathered} \textstyle\sum c\,g(x) = c\sum g(x) \\ \textstyle\int c\,g(x)\,dx = c\int g(x)\,dx \end{gathered}` },
    sub: { name: 'Swap in', mv: 'mv-b' },
    series: { name: 'Series rule', mv: 'mv-c', rule: R`\sum_{k=1}^{\infty} ar^{k-1} = \frac{a}{1-r}, \quad |r| < 1` },
    key: { name: 'Key integral', mv: 'mv-c', rule: R`\int_0^{\infty} e^{-cx}\,dx = \frac{1}{c}, \quad c > 0` },
    etx: { name: 'Integrate eᵗˣ', mv: 'mv-c', rule: R`\int_A^B e^{tx}\,dx = \frac{e^{Bt} - e^{At}}{t}, \quad t \ne 0` },
    gamma: { name: 'Gamma integral', mv: 'mv-c', rule: R`\int_0^{\infty} x^{\alpha-1}e^{-x/\beta}\,dx = \Gamma(\alpha)\beta^{\alpha}, \quad \alpha, \beta > 0` },
    one: { name: 'A pdf integrates to 1', mv: 'mv-c', rule: R`\int f(x)\,dx = 1` },
    zero: { name: 'Put in t = 0', mv: 'mv-c' },
    tidy: { name: 'Tidy up', mv: 'mv-d' },
    var: { name: 'Variance', mv: 'mv-d', rule: R`\operatorname{Var}X = E[X^2] - (E[X])^2` },
    exist: { name: 'Where it exists', mv: 'mv-e' },
    check: { name: 'Check', mv: 'mv-e', rule: R`m_X(0) = 1` },
  }
  const RECIPE = R`m_X(t) = E\big[e^{tX}\big] = \begin{cases} \displaystyle\sum_x e^{tx}\,f(x) & X \text{ discrete} \\[10pt] \displaystyle\int e^{tx}\,f(x)\,dx & X \text{ continuous} \end{cases}`

  const TABLES = [
    { xs: [0, 1, 2], fs: ['0.2', '0.5', '0.3'] },
    { xs: [1, 2, 3], fs: ['0.1', '0.6', '0.3'] },
    { xs: [0, 1, 2, 3], fs: ['0.1', '0.2', '0.3', '0.4'] },
    { xs: [-1, 0, 1], fs: ['0.3', '0.4', '0.3'] },
    { xs: [1, 2, 3, 4], fs: ['0.4', '0.3', '0.2', '0.1'] },
    { xs: [0, 1, 2], fs: ['0.5', '0.3', '0.2'] },
    { xs: [-1, 0, 1, 2], fs: ['0.1', '0.2', '0.3', '0.4'] },
  ]
  const PQS = [['0.1', '0.9'], ['0.2', '0.8'], ['0.25', '0.75'], ['0.3', '0.7'], ['0.4', '0.6'], ['0.6', '0.4'], ['0.7', '0.3'], ['0.75', '0.25'], ['0.8', '0.2'], ['0.9', '0.1']]
  // f(x) = a formula over its total, on a few values (the notes' kind)
  const FINITES = [
    { tex: 'x', w: x => x, xs: [1, 2, 3] },
    { tex: 'x', w: x => x, xs: [1, 2, 3, 4] },
    { tex: 'x + 1', w: x => x + 1, xs: [0, 1, 2] },
    { tex: '4 - x', w: x => 4 - x, xs: [0, 1, 2, 3] },
    { tex: '2x + 1', w: x => 2 * x + 1, xs: [0, 1, 2] },
    { tex: 'x^2', w: x => x * x, xs: [1, 2, 3] },
    { tex: 'x + 2', w: x => x + 2, xs: [-1, 0, 1, 2] },
  ]
  const gcdN = (a, b) => (b ? gcdN(b, a % b) : Math.abs(a))
  const UNIS = [{ a: 0, b: 2 }, { a: 0, b: 4 }, { a: 1, b: 3 }, { a: 2, b: 4 }, { a: 1, b: 5 }, { a: 0, b: 5 }]
  const fmtN = v => String(+v.toFixed(6))
  // e^(kt) in tex: 1, e^t, e^{-t}, e^{2t}
  const eKt = k => (k === 0 ? '1' : k === 1 ? 'e^{t}' : k === -1 ? 'e^{-t}' : `e^{${fmtN(k)}t}`)
  // Σ c·e^(kt) in tex, in order of k, like powers combined and zero terms dropped
  function sumE(pairs) {
    const byK = new Map()
    for (const [c, k] of pairs) byK.set(k, (byK.get(k) ?? 0) + c)
    let out = ''
    for (const [k, c0] of [...byK].sort((a, b) => a[0] - b[0])) {
      const c = +c0.toFixed(6)
      if (!c) continue
      const size = Math.abs(c)
      const body = k === 0 ? fmtN(size) : (size === 1 ? '' : fmtN(size)) + eKt(k)
      out += c < 0 ? (out ? ` - ${body}` : `-${body}`) : out ? ` + ${body}` : body
    }
    return out || '0'
  }

  // Each build: its pdf, the lines after "m_X(t) =" (with the move each one makes,
  // why, and the slips a question offers instead), and where the MGF exists.
  const BUILDS = {
    table(n = TABLES[0]) {
      const { xs, fs } = n
      const f = fs.map(Number)
      const ex = xs.reduce((s, x, i) => s + x * f[i], 0)
      return {
        name: 'A pdf table',
        pdf: R`\begin{array}{c|${'c'.repeat(xs.length)}} x & ${xs.join(' & ')} \\ \hline f(x) & ${fs.join(' & ')} \end{array}`,
        lead0: R`m_X(t) &= \sum_x e^{tx} f(x) = `,
        lines: [
          { move: 'setup', tex: xs.map((x, i) => R`\HL{e^{${x}t}}(${fs[i]})`).join(' + '), why: 'One term per column: e^(xt) times f(x)',
            slips: [xs.map(x => `e^{${x}t}`).join(' + '), xs.map((x, i) => `${x}(${fs[i]})`).join(' + '), xs.map((x, i) => `e^{${fs[i]}t}(${x})`).join(' + '), xs.map((x, i) => `e^{t}(${fs[i]})`).join(' + ')] },
          { move: 'tidy', tex: sumE(xs.map((x, i) => [f[i], x])), why: [[0, 'e^(0t) = 1'], [1, 'e^(1t) = e^t'], [-1, 'e^(−1t) = e^(−t)']].filter(([x]) => xs.includes(x)).map(([, w]) => w).join(' and '),
