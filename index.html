    if (!items.length) return null
    const rows = items.map(([l, x]) => `${l} &${rel(exact(x, 5))} ${num(x, 5)}`)
    return { order: [], label, plain: true, tex: () => rows[0].replace('&', ''), steps: () => rows.slice(1) }

    geometric: [{ order: ['p', 'q', 'x'], tex: s => `f(${s('x')}) = ${s('q', 1)}^{${s('x')}-1}${s('p', 2)}`,

      finish: (v, T) => {

        return { lhs: `f(${v.x})`, steps: () => [`${rel(exact(Q, 5) && (pFrac || exact(v.p, 5)))} ${num(Q, 5)} \\cdot ${factor(v.p, T.p)}`, `${rel(exact(f))} ${num(f)}`] }

    negbin: [{ order: ['r', 'p', 'q', 'x'], tex: s => `f(${s('x')}) = \\binom{${s('x')}-1}{${s('r')}-1}${s('p', 1)}^{${s('r')}}${s('q', 1)}^{${s('x')}-${s('r')}}`,
      steps: (v, T) => [`= \\binom{${v.x - 1}}{${v.r - 1}}${base(T.p)}^{${v.r}}${base(T.q)}^{${v.x - v.r}}`],
      pieces: (v, T) => [chooseWork(v.x - 1, v.r - 1), powPiece([[T.p, v.p, v.r], [T.q, v.q, v.x - v.r]])],
      finish: v => {

        return { lhs: `f(${v.x})`, steps: () => [`${rel(exact(P, 5) && exact(Q, 5))} ${num(C)} \\cdot ${num(P, 5)} \\cdot ${num(Q, 5)}`, `${rel(exact(f))} ${num(f)}`] }
      } }],
    hyper: [{ order: ['N', 'r', 'n', 'x'], tex: s => `f(${s('x')}) = \\frac{\\binom{${s('r')}}{${s('x')}}\\binom{${s('N')}-${s('r')}}{${s('n')}-${s('x')}}}{\\binom{${s('N')}}{${s('n')}}}`,
      steps: v => [`= \\frac{\\binom{${v.r}}{${v.x}}\\binom{${v.N - v.r}}{${v.n - v.x}}}{\\binom{${v.N}}{${v.n}}}`],
      pieces: v => [chooseWork(v.r, v.x), chooseWork(v.N - v.r, v.n - v.x), chooseWork(v.N, v.n)],
      finish: v => {
        const C1 = choose(v.r, v.x), C2 = choose(v.N - v.r, v.n - v.x), C3 = choose(v.N, v.n), f = (C1 * C2) / C3
        return { lhs: `f(${v.x})`, steps: () => [`= \\frac{${num(C1)} \\cdot ${num(C2)}}{${num(C3)}}`, `${rel(exact(C1 * C2) && exact(C3))} \\frac{${num(C1 * C2)}}{${num(C3)}}`, `${rel(exact(f))} ${num(f)}`] }

    poisson: [
      { mid: true, order: ['lam', 's'], tex: s => `${s('k')} = ${s('lam')}${s('s', 2)}`,
        steps: (v, T) => (/\{60\}/.test(T.s) ? [`= \\frac{${Math.round(v.lam * v.s * 60)}}{60}`, `= ${fmt(v.k)}`] : [`= ${fmt(v.k)}`]) },
      { order: ['k', 'x'], tex: s => `f(${s('x')}) = \\frac{e^{-${s('k')}}${s('k', 1)}^{${s('x')}}}{${s('x')}!}`,
        pieces: (v, T) => [calcPiece([[`e^{-${T.k}}`, Math.exp(-v.k)], ...(v.x >= 2 ? [[`${base(T.k)}^{${v.x}}`, v.k ** v.x]] : [])]), factWork(v.x)],
        finish: v => {

          return { lhs: `f(${v.x})`, steps: () => [`${rel(exact(E, 5) && exact(K, 5))} \\frac{${num(E, 5)} \\cdot ${num(K, 5)}}{${num(F)}}`, `${rel(exact(f))} ${num(f)}`] }

    ],
    uniform: [{ order: ['A', 'B'], tex: s => `f(x) = \\frac{1}{${s('B')} - ${s('A')}}`,
      steps: v => [`= \\frac{1}{${fmt(v.B - v.A)}}`, `${rel(exact(1 / (v.B - v.A)))} ${num(1 / (v.B - v.A))}`], tail: v => `\\quad \\text{for } ${v.A} \\le x \\le ${v.B}` }],
    exponential: [
      { order: ['lam'], tex: s => `f(x) = ${s('lam')}e^{-${s('lam')}x}`, tail: () => '\\quad \\text{for } x > 0' },
      { order: ['lam', 't'], tex: s => `P(X > ${s('t')}) = e^{-${s('lam')}${s('t', 2)}}`,

    ],
    gamma: [{ order: ['al', 'be'], tex: s => `f(x) = \\frac{x^{${s('al')}-1}e^{-x/${s('be', 1)}}}{\\Gamma(${s('al')})\\,${s('be', 1)}^{${s('al')}}}`,
      pieces: (v, T) => {
        const a = v.al, rate = Math.round(1 / v.be), frac1 = /frac/.test(T.be)
        const gam = { order: [], label: `How to get Γ(${a})`, tex: () => `\\Gamma(${a}) = (${a} - 1)!`,

    chi: [
      { mid: true, order: ['ga'], tex: s => `\\alpha = \\frac{${s('ga')}}{2}`, steps: v => [`= ${fmt(v.ga / 2)}`] },
      { order: [], tex: () => '\\beta = 2' },
      // when the story asks for a value from the table: a right area r is column 1 − r
      { when: v => 'ra' in v, mid: true, order: ['ra'], tex: s => `\\text{column} = 1 - ${s('ra')}`, steps: v => [`= ${fmt(1 - v.ra)}`] },
      { when: v => 'ra' in v, order: ['ga'], tex: (s, v) => `c = \\text{row } ${s('ga')},\\ \\text{column } ${fmt(1 - v.ra)}`, steps: v => [`= ${chiEntry(v.ga, 1 - v.ra)}`],

      { mid: true, order: ['x', 'mu', 'sig'], tex: s => `z = \\frac{${s('x')} - ${s('mu')}}{${s('sig')}}`,

  }
  // the normal table's row and column for a z with 2 decimals (row −1.6, column 0.08 is −1.68)
  const zCell = z => {
    const c = Math.round(Math.abs(z) * 100)
    return { row: (z < 0 ? '-' : '') + (Math.floor(c / 10) / 10).toFixed(1), col: ((c % 10) / 100).toFixed(2) }
  }
  const cellOf = (name, row, col) => {
    tables ??= unit.printedTables()
    const t = tables[name]
    const r = t.rows.find(x => x.label === row)
    const j = t.cols.indexOf(col)
    return r && j >= 0 ? r.values[j] : null
  }
  // the z values (×100) whose entries are closest to an area (two when it is halfway)
  function closestZ(A) {
    tables ??= unit.printedTables()
    let best = Infinity, at = []
    for (const r of tables.normal.rows) r.values.forEach((v, j) => {
      const d = Math.abs(+v - A)
      const z = Math.round((r.label.startsWith('-') ? -1 : 1) * (Math.abs(+r.label) * 100 + j))
      if (d < best - 1e-12) { best = d; at = [z] }
      else if (Math.abs(d - best) <= 1e-12 && !at.includes(z)) at.push(z)
    })
    return at
  }
  const normEntry = z => {
    const { row, col } = zCell(z)
    return cellOf('normal', row, col)
  }
  // a window of one printed table: the row lights up, then the column, and they meet
  // at the entry; reverse (an area to find) lights the entry first, then its edges
  function tableLook({ name, row, col, target = null, halfway = null }) {
    tables ??= unit.printedTables()
    const t = tables[name]
    const ri = t.rows.findIndex(r => r.label === row)
    const ci = t.cols.indexOf(col)
    if (ri < 0 || ci < 0) return null
    const entry = t.rows[ri].values[ci]
    const wrap = h('div', 'tlook')
    const scroller = h('div', 'tlook-scroll')
    const table = h('table', 'tlook-table')
    const head = h('tr')
    head.append(h('th', 'corner', t.corner))
    const colHeads = t.cols.map(c => {
      const th = h('th', '', c)
      head.append(th)
      return th
    })
    table.append(head)
    const lo = Math.max(0, ri - 2), hi = Math.min(t.rows.length - 1, ri + 2)
    const gap = () => {
      const tr = h('tr', 'gap')
      tr.append(h('td', '', '⋮'))
      table.append(tr)
    }
    if (lo > 0) gap()
    let rowHead = null, rowCells = [], colCells = [], hit = null
    for (let i = lo; i <= hi; i++) {
      const tr = h('tr')
      const th = h('th', '', t.rows[i].label)
      tr.append(th)
      t.rows[i].values.forEach((v, j) => {
        const td = h('td', '', v)
        tr.append(td)
        if (i === ri) rowCells.push(td)
        if (j === ci) colCells.push(td)
        if (i === ri && j === ci) hit = td
      })
      if (i === ri) rowHead = th
      table.append(tr)
    }
    if (hi < t.rows.length - 1) gap()
    scroller.append(table)
    let cap
    if (name === 'normal') {
      const z = (row.startsWith('-') ? '-' : '') + (Math.abs(+row) + +col).toFixed(2)
      cap = halfway
        ? `${target} is exactly halfway between ${normEntry(halfway[0])} (z = ${halfway[0].toFixed(2)}) and ${normEntry(halfway[1])} (z = ${halfway[1].toFixed(2)}), so use the z halfway between them: ${((halfway[0] + halfway[1]) / 2).toFixed(3)}. This window shows ${entry} (z = ${z}).`
        : target != null
        ? `Look in the body for the entry closest to ${target}: ${entry}. Its row ${row} and column ${col} make z = ${z}.`
        : `Row ${row} (z cut off after one decimal, not rounded) and column ${col} (its second decimal) make z = ${z}. They meet at ${entry}, the area to the LEFT: P(Z < ${z}) = ${entry}.`
    } else if (name === 'chi2') {
      cap = target != null
        ? `In row γ = ${row}, find ${entry}. Its column, ${col}, is the area to its LEFT.`
        : `Row γ = ${row}, column ${col} (the area to the LEFT) meet at ${entry}.`
    } else {
      cap = `In the n = ${name === 'binomial19' ? 19 : 20} table, row x = ${row} and column p = ${col} meet at ${entry}: F(${row}) = P(X ≤ ${row}) = ${entry}.`
    }
    const caption = h('p', 'tlook-cap', cap)
    wrap.append(h('div', 'piece-label', 'Reading the table · ' + t.title), scroller, caption)
    const centre = () => {
      if (hit) scroller.scrollLeft = Math.max(0, hit.offsetLeft - scroller.clientWidth / 2 + hit.offsetWidth / 2)
    }
    function final() {
      rowHead?.classList.add('on-row')
      rowCells.forEach(c => c.classList.add('on-row'))
      colHeads[ci].classList.add('on-col')
      colCells.forEach(c => c.classList.add('on-col'))
      hit?.classList.add('hit')
      caption.hidden = false
      requestAnimationFrame(centre)
    }
    async function play(alive) {
      caption.hidden = true
      requestAnimationFrame(centre)
      await wait(400)
      const sweep = async (cells, cls, gapMs) => {
        for (const c of cells) {
          if (!alive()) return
          c.classList.add(cls)
          await wait(gapMs)
        }
      }
      if (target != null) {
        // an area to find: scan the row of the answer, stop on the closest entry
        await sweep(rowCells.slice(0, ci + 1), 'scan', 70)
        rowCells.forEach(c => c.classList.remove('scan'))
        hit?.classList.add('hit')
        tone(semis(523.25, 12), 0, 0.12, 'sine', 0.08)
        await wait(450)
        rowHead?.classList.add('on-row')
        await wait(300)
        colHeads[ci].classList.add('on-col')
      } else {
        rowHead?.classList.add('on-row')
        await sweep(rowCells, 'on-row', 45)
        await wait(250)
        colHeads[ci].classList.add('on-col')
        await sweep(colCells, 'on-col', 70)
        await wait(200)
        hit?.classList.add('hit')
        tone(semis(523.25, 12), 0, 0.12, 'sine', 0.08)
      }
      if (!alive()) return
      caption.hidden = false
      caption.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300 })
      await wait(700)
    }
    return { el: wrap, play, final }
  }
  // the class's chi-squared table: the value in row γ under a LEFT-area column
  const chiEntry = (g, col) => {
    tables ??= unit.printedTables()
    const t = tables.chi2
    return t.rows[g - 1].values[t.cols.indexOf(fmt(col))]
  }

  // ---------- the graph: the distribution with the story's numbers ----------
  const lgamma = z => {
    if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - lgamma(1 - z)
    const c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7]
    z -= 1
    let x = c[0]
    for (let i = 1; i < 9; i++) x += c[i] / (z + i)
    const t = z + 7.5
    return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x)
  }
  const gammaPdf = (x, a, b) => (x <= 0 ? 0 : Math.exp((a - 1) * Math.log(x) - x / b - lgamma(a) - a * Math.log(b)))
  // what to draw for each distribution: bars (counting) or a curve (measuring),
  // which bar or area the story asked about, and a title with the parameters
  function graphOf(leaf, v, txt = {}) {
    const say = k => txt[k] ?? fmt(v[k])
    const range = (lo, hi) => Array.from({ length: hi - lo + 1 }, (_, i) => lo + i)
    const upTo = (lo, pmf, cap) => {
      let x = lo, cum = 0
      while (cum < 0.99 && x - lo < cap) cum += pmf(x++)
      return x
    }
    const bars = (title, xs, pmf, at) => ({ kind: 'bars', title, xs, ys: xs.map(pmf), at, atLabel: `f(${at}) ≈ ${+pmf(at).toPrecision(3)}` })
    switch (leaf) {
      case 'binomial': {
        const pmf = x => choose(v.n, x) * v.p ** x * v.q ** (v.n - x)
        return bars(`binomial · n = ${v.n}, p = ${say('p')}`, range(0, v.n), pmf, v.x)
      }
      case 'geometric': {
        const pmf = x => v.q ** (x - 1) * v.p
        return bars(`geometric · p = ${say('p')}`, range(1, Math.max(v.x + 2, upTo(1, pmf, 120))), pmf, v.x)
      }
      case 'negbin': {
        const pmf = x => choose(x - 1, v.r - 1) * v.p ** v.r * v.q ** (x - v.r)
        return bars(`negative binomial · r = ${v.r}, p = ${say('p')}`, range(v.r, Math.max(v.x + 2, upTo(v.r, pmf, 140))), pmf, v.x)
      }

    if (f.key === 'uniform') {
      const w = f.B - f.A
      return { kind: 'curve', title: `uniform · A = ${f.A}, B = ${f.B}`, lo: f.A - 0.2 * w, hi: f.B + 0.2 * w, pdf: x => (x >= f.A && x <= f.B ? 1 / w : 0), flat: [f.A, f.B], shades, ticks: [f.A, f.B], note }
    }
    const hi = Math.max(-Math.log(0.002) / f.lam, ...r.parts.flatMap(q => [q.lo, q.hi]).filter(Number.isFinite).map(x => x * 1.5))
    return { kind: 'curve', title: expTitle(p, f.lam), lo: 0, hi, pdf: x => (x < 0 ? 0 : f.lam * Math.exp(-f.lam * x)), shades, ticks: [0, ...r.parts.flatMap(q => [q.lo, q.hi]).filter(x => Number.isFinite(x) && x > 0)], note }
  }

  // the normal: standard (Z) or with μ and σ from the story; forwards or backwards
  function normalGraph(p, r) {
    const text = p.text ?? ''
    let mu = 0, sig = 1, std = true
    const mm = /μ = (-?\d*\.?\d+)/.exec(text)
    if (mm) {
      const s1 = /σ = (\d*\.?\d+)/.exec(text), s2 = /σ² = ([\d,]*\.?\d+)/.exec(text)
      if (!s1 && !s2) return null
      mu = +mm[1]
      sig = s1 ? +s1[1] : Math.sqrt(+s2[1].replace(/,/g, ''))
      std = false
    } else if (!(r?.v === 'Z' || /Z|z_/.test(p.latex ?? ''))) return null
    const cdf = x => Phi((x - mu) / sig)
    const V = std ? 'Z' : 'X'
    const ans = p.answer
    let shades = null, marks = [], note = null
    const latex = (p.latex ?? '').replace(/\s+/g, ' ')
    if (r && (r.v === V || (std && r.v === 'Z')) && typeof ans === 'number') {
      if (!close(areaCont(r, cdf), ans, 0.006)) return null
      shades = r.parts.map(q => [q.lo, q.hi])
      note = `shaded: ${regionText(r)} ${shown4(ans)}`
    } else if (typeof ans === 'number') {
      let k
      const sub = s => s.replace(/-z_0/g, String(-ans)).replace(/z_0/g, String(ans))
      if (std && (k = /^(P\(.*z_0.*\)) = (\d*\.?\d+)$/.exec(latex))) {
        const rr = regionOf(sub(k[1]))
        if (!rr || !close(areaCont(rr, cdf), +k[2], 0.006)) return null
        shades = rr.parts.map(q => [q.lo, q.hi])
        note = `shaded: ${regionText(rr)} = ${k[2]}, so z₀ = ${fmt(ans)}`
      } else if (std && (k = /^z_\{(\d*\.?\d+)\} = \\,\?$/.exec(latex))) {
        if (!close(1 - cdf(ans), +k[1], 0.006)) return null
        shades = [[ans, Infinity]]
        note = `shaded: the area ${k[1]} to the right of z = ${fmt(ans)}`
      } else if (!std && (k = /the (\d+(?:\.\d+)?)(?:st|nd|rd|th) percentile:\s*\}?\s*x/.exec(latex))) {
        if (!close(cdf(ans), +k[1] / 100, 0.01)) return null
        shades = [[-Infinity, ans]]
        note = `shaded: the lowest ${k[1]}%, left of x = ${fmt(ans)}`
      } else if (!std && (k = /^x = (-?\d*\.?\d+), \\quad \\text\{percentile\}/.exec(latex))) {
        const x = +k[1]
        // the percentile as a left area (0.9887) or as a percent (98.87)
        const pct = ans <= 1 ? ans * 100 : ans
        if (!close(100 * cdf(x), pct, 0.6)) return null
        shades = [[-Infinity, x]]
        note = `shaded: the area left of x = ${x}, about ${+pct.toFixed(2)}%`
      } else if (!std && (k = /^x = (-?\d*\.?\d+), \\quad z = /.exec(latex))) {
        const x = +k[1]
        if (!close((x - mu) / sig, ans, 0.006)) return null
        marks = [x]
        note = `x = ${x} sits ${fmt(Math.abs(ans))} standard deviations ${ans < 0 ? 'below' : 'above'} μ`
      } else if (!std && (k = /^P\(x_1 < X < x_2\) = (\d*\.?\d+)$/.exec(latex))) {
        // the answer is either cut-off; the other is the same distance on the other side of μ
        const lo = Math.min(ans, 2 * mu - ans), hi2 = Math.max(ans, 2 * mu - ans)
        if (!close(cdf(hi2) - cdf(lo), +k[1], 0.01)) return null
        shades = [[lo, hi2]]
        note = `shaded: the middle ${+(+k[1] * 100).toFixed(4)}%, from ${fmt(lo)} to ${fmt(hi2)}`
      } else if (!std && (k = /(top|bottom) (\d+(?:\.\d+)?)%/.exec(text))) {
        const share = +k[2] / 100
        const area = k[1] === 'top' ? 1 - cdf(ans) : cdf(ans)
        if (!close(area, share, 0.01)) return null
        shades = [k[1] === 'top' ? [ans, Infinity] : [-Infinity, ans]]
        note = `shaded: the ${k[1]} ${k[2]}%, cut at x = ${fmt(ans)}`
      } else return null
    } else return null
    const lo = mu - 3.6 * sig, hi = mu + 3.6 * sig
    return { kind: 'curve', title: std ? 'standard normal · Z, μ = 0, σ = 1' : `normal · μ = ${fmt(mu)}, σ = ${fmt(sig)}`, lo, hi,
      pdf: x => Math.exp(-((x - mu) ** 2) / (2 * sig * sig)) / (sig * Math.sqrt(2 * Math.PI)),
      shades: (shades ?? []).map(([a, b]) => [Math.max(a, lo), Math.min(b, hi)]), marks, ticks: [-2, -1, 0, 1, 2].map(k => +(mu + k * sig).toFixed(6)), note }
  }

  function chiGraph(p, r) {
    const g = +(/γ = (\d+)/.exec(p.text ?? '')?.[1] ?? [...(p.answerLatex ?? '').matchAll(/\\gamma = (\d+)/g)].at(-1)?.[1] ?? NaN)
    if (!(g >= 1) || !/\\chi/.test(p.latex ?? '')) return null
    const cdf = x => chiCdf(x, g)
    const latex = (p.latex ?? '').replace(/\s+/g, ' ')
    const ans = p.answer
    let shades, note, k
    if (r && r.v === 'C' && typeof ans === 'number' && !/= \d*\.?\d+$/.test(latex.replace(/= \\,\?$/, ''))) {
      if (!close(areaCont(r, cdf), ans, 0.012)) return null
      shades = r.parts.map(q => [q.lo, q.hi])
      note = `shaded: ${regionText(r)} ${shown4(ans)}`
    } else if ((k = /^P\(\\chi\^2 (>|<|\\le|\\ge) c\) = (\d*\.?\d+)$/.exec(latex)) && typeof ans === 'number') {
      const right = k[1] === '>' || k[1] === '\\ge'
      const area = right ? 1 - cdf(ans) : cdf(ans)
      if (!close(area, +k[2], 0.012)) return null
      shades = [right ? [ans, Infinity] : [0, ans]]
      note = `shaded: the ${right ? 'right' : 'left'} area ${k[2]}, cut at c = ${fmt(ans)}`
    } else if ((k = /^\\chi\^2_\{(\d*\.?\d+)\} = \\,\?$/.exec(latex)) && typeof ans === 'number') {
      if (!close(1 - cdf(ans), +k[1], 0.012)) return null
      shades = [[ans, Infinity]]
      note = `shaded: the right area ${k[1]}, past χ² = ${fmt(ans)}`
    } else return null
    const hi = Math.max(g + 6 * Math.sqrt(2 * g), ...shades.flat().filter(Number.isFinite).map(x => x * 1.3))
    return { kind: 'curve', title: `chi-squared · γ = ${g}`, lo: 0, hi, pdf: x => gammaPdf(x, g / 2, 2), shades: shades.map(([a, b]) => [Math.max(0, a), Math.min(hi, b)]), ticks: [0, ...shades.flat().filter(x => Number.isFinite(x) && x > 0)], note }
  }

  // binomial table questions: n and the column p are named in the hint
  function binomialTableGraph(p, r) {
    const n = +(/n = (19|20) table/.exec(p.hint?.text ?? '')?.[1] ?? NaN)
    const pp = +(/column p = (\d*\.?\d+)/.exec(p.hint?.text ?? '')?.[1] ?? NaN)
    if (!(n > 0) || !(pp > 0)) return null
    const rr = r ?? regionOf(p.answerLatex)
    if (!rr || rr.v !== 'X') return null
    const pmf = x => choose(n, x) * pp ** x * (1 - pp) ** (n - x)
    if (!close(areaDisc(rr, pmf, 0, n), p.answer, 0.0006)) return null
    const xs = Array.from({ length: n + 1 }, (_, i) => i)
    return { kind: 'bars', title: `binomial · n = ${n}, p = ${fmt(pp)}`, xs, ys: xs.map(pmf), hits: new Set(xs.filter(x => inRegion(rr, x))), note: `shaded: ${regionText(rr)} ${shown4(p.answer)}` }
  }

  // uniform and exponential questions about the mean, variance or σ
  function statsGraph(p) {
    const latex = (p.latex ?? '').replace(/\s+/g, ' ')
    const ans = p.answer
    if (typeof ans !== 'number') return null
    const stat = /^E\[X\] = /.test(latex) ? 'mean' : /^\\operatorname\{Var\}X = /.test(latex) ? 'var' : /^\\sigma = /.test(latex) ? 'sd' : /^E\[X\^2\] = /.test(latex) ? 'm2'
      : /^E\[W\] = /.test(latex) ? 'Wmean' : /^\\sigma_W = /.test(latex) ? 'Wsd' : /^\\operatorname\{Var\}W = /.test(latex) ? 'Wvar' : null
    if (!stat) return null
    const { vals } = questionNumbers(p)
    if (stat[0] === 'W') {
      if (!saysRate(p)) return null
      const lam = stat === 'Wvar' ? 1 / Math.sqrt(ans) : 1 / ans
      // the rate must be one the story gives, in some units
      const ok = vals.some(c => [1, 60, 1 / 60, 24, 1 / 24].some(f => exactly(c * f, lam) || exactly(f / c, lam)))
      if (!ok) return null
      return { kind: 'curve', title: expTitle(p, lam), lo: 0, hi: -Math.log(0.01) / lam, pdf: x => lam * Math.exp(-lam * x), marks: [1 / lam], ticks: [0, 1 / lam], note: `the mean β = 1/λ = ${fmt(1 / lam)} is marked; σ is also β` }
    }
    if (!saysUniform(p)) return null
    const found = []
    for (const A of vals) for (const B of vals) if (B > A) {
      const v = { mean: (A + B) / 2, var: (B - A) ** 2 / 12, sd: (B - A) / Math.sqrt(12), m2: (B ** 3 - A ** 3) / (3 * (B - A)) }[stat]
      if (exactly(v, ans)) found.push([A, B])
    }
    if (found.length !== 1) return null
    const [A, B] = found[0], w = B - A
    return { kind: 'curve', title: `uniform · A = ${A}, B = ${B}`, lo: A - 0.2 * w, hi: B + 0.2 * w, pdf: x => (x >= A && x <= B ? 1 / w : 0), flat: [A, B], marks: [(A + B) / 2], ticks: [A, (A + B) / 2, B], note: `the mean (A + B)/2 = ${fmt((A + B) / 2)} is marked` }
  }

  // a question that writes out its own pdf, cdf or table is not one of the named distributions
  const ownsPdf = p => /\\begin\{cases\}|\\begin\{array\}|\\int|[fF]\(x\) =/.test(p.latex ?? '') || !p.text
  const saysUniform = p => /equally likely|uniform/i.test(p.text ?? '')
  const saysRate = p => /per (second|minute|hour|day|week|month|year)|\bevery\b|average rate/i.test(p.text ?? '')
  function inferGraph(p, level) {
    if (p.options || p.leaf) return null
    const r = regionOf(p.latex)
    try {
      if (level === 'Binomial table') return binomialTableGraph(p, r)
      if (level === 'Chi-squared table') return chiGraph(p, r)
      if (level === 'Normal table' || level === 'Normal word problems') return normalGraph(p, r)
      if (/\\chi/.test(p.latex ?? '')) return chiGraph(p, r)
      if (ownsPdf(p)) return null
      if (r && typeof p.answer === 'number') {
        if (r.v === 'Z' || /μ = /.test(p.text ?? '')) return normalGraph(p, r)
        if (saysUniform(p) || r.v === 'W') return continuousGraph(p, r)
        return discreteGraph(p, r)
      }
      return statsGraph(p)
    } catch {
      return null
    }
  }

  const wait = ms => new Promise(r => setTimeout(r, ms))
  // send a copy of a chip's number from the chip to a spot in the formula
  function fly(fromEl, toEl, text, cls) {
    const a = fromEl.getBoundingClientRect()
    const b = toEl.getBoundingClientRect()
    const f = h('div', 'flyer ' + cls, text)
    document.body.append(f)
    const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2
    const x1 = b.left + b.width / 2, y1 = b.top + b.height / 2
    const anim = f.animate(
      [
        { transform: `translate(${x0}px, ${y0}px) translate(-50%, -50%) scale(1.15)` },
        { transform: `translate(${(x0 + x1) / 2}px, ${Math.min(y0, y1) - 40}px) translate(-50%, -50%) scale(1.25)`, offset: 0.45 },
        { transform: `translate(${x1}px, ${y1}px) translate(-50%, -50%) scale(0.8)`, opacity: 0.4 },
      ],
      { duration: 560, easing: 'cubic-bezier(.45,0,.3,1)', fill: 'forwards' },
    )
    // a busy or backgrounded tab can stall an animation: never wait on it for long
    return Promise.race([anim.finished.catch(() => {}), wait(800)]).then(() => f.remove())
  }
  // the story with one phrase lit up in a number's colour
  function storyMark(text, phrase, cls) {
    const p = h('p', 'story')
    const at = phrase ? text.indexOf(phrase) : -1
    if (at < 0) p.textContent = text
    else p.append(document.createTextNode(text.slice(0, at)), h('mark', 'pvmark ' + cls, phrase), document.createTextNode(text.slice(at + phrase.length)))
    return p
  }
  // the panel: chips for the story's numbers, the formula lines, and a replay.
  // auto: play straight away (a right answer); otherwise it starts filled in
  function plugPanel(p, { sheet = null, auto = false, next = null } = {}) {
    const vars = p.vars
    // a number the story only implies gets its own line of work, just before it is used
    const val = Object.fromEntries(Object.entries(vars).map(([k, v]) => [k, v.val]))
    const T = Object.fromEntries(Object.entries(vars).map(([k, v]) => [k, v.tex]))
    const TXT = Object.fromEntries(Object.entries(vars).map(([k, v]) => [k, v.txt]))
    const lines = []
    for (const line of PLUG[p.leaf]) {
      if (line.when && !line.when(val)) continue
      for (const k of line.order) if (vars[k]?.work && !lines.some(l => l.key === k)) lines.push({ ...vars[k].work, key: k })
      lines.push(line)
      // the pieces on the side, then the rows that finish the formula with them
      if (line.pieces) lines.push(...line.pieces(val, T).filter(Boolean))
      if (line.finish) lines.push({ order: [], ...line.finish(val, T) })
      if (line.look) lines.push({ order: [], lookAt: line.look(val) })
    }
    const keys = [...new Set(lines.flatMap(l => l.order))]
    const color = Object.fromEntries(keys.map((k, i) => [k, 'pv' + (i % 5)]))
    const el = h('div', 'plug')
    const L = LEAVES[p.leaf]
    el.append(h('h3', '', `${L.name} · plug it in`))
    if (p.trap) el.append(h('p', 'plug-sub trap', 'The trap: ' + p.trap))
    el.append(h('p', 'plug-sub', 'Every number in the story has a spot in the formula. Numbers the story only hints at get worked out first, and so does every piece inside it.'))
    const chips = h('div', 'plug-chips')
    const box = h('div')
    el.append(chips, box)
    const acts = h('div', 'row-actions')
    const replay = h('button', 'btn ghost', 'Replay')
    replay.type = 'button'
    acts.append(replay)
    if (next) acts.append(next)
    el.append(acts)

    const stepsOf = line => (line.steps ? line.steps(val, T) : [])
    // the formula, then n rows of work under it, lined up on the = sign
    const lineTex = (line, done, n) => {
      const s = (k, mode = 0) => {
        let body = SYM[k]
        if (done.has(k)) {
          const t = vars[k].tex
          body = mode === 2 || (mode === 1 && !/^\d+$/.test(t)) ? `\\left(${t}\\right)` : `{${t}}`
        }
        return color[k] ? `\\class{${color[k]}}{${body}}` : body
      }
      const all = stepsOf(line)
      const cls = j => (j === all.length - 1 && !line.plain ? 'pvres' : 'pvstep')
      // the answer is boxed: the last row of a line that is not work on the side or a step on the way
      const mid = typeof line.mid === 'function' ? line.mid(val) : line.mid
      const answer = line.answer || (!line.key && !line.label && !line.plain && !mid && !line.pieces && !line.finish && !line.lookAt)
      const boxed = st => {
        const m = /^(=|\\approx)\s*([\s\S]*)$/.exec(st)
        return m ? `${m[1]} \\boxed{${m[2]}}` : `\\boxed{${st}}`
      }
      // a row with its own left side (calculator rows) keeps it outside the colour
      const row = (st, j) => {
        if (answer && j === all.length - 1 && !st.includes('&')) st = boxed(st)
        const at = st.indexOf('&')
        return at < 0 ? `&\\class{${cls(j)}}{{}${st}}` : `${st.slice(0, at)}&\\class{${cls(j)}}{{}${st.slice(at + 1)}}`
      }
      let rows
      if (line.lhs) {
        // finishing rows: one left side, the first row there from the start
        rows = all.slice(0, Math.max(1, n)).map((st, j) => (j ? '' : line.lhs + ' ') + row(st, j))
      } else {
        rows = [line.tex(s, val).replace(/ (=|\\approx) /, ' &$1 ')]
        all.slice(0, n).forEach((st, j) => rows.push(row(st, j)))
      }
      if (n >= all.length && done.size === line.order.length && line.tail) rows[rows.length - 1] += ' ' + line.tail(val)
      return `\\begin{aligned}${rows.join(' \\\\[2pt] ')}\\end{aligned}`
    }
    const chipFor = k => {
      let c = chips.querySelector(`[data-k="${k}"]`)
      if (c) return c
      const v = vars[k]
      c = h('span', 'plug-chip ' + color[k], `${CHIP_SYM[k] ?? k} = ${v.txt}`)
      c.dataset.k = k
      const why = v.from ? `“${v.from}”${v.note ? ' · ' + v.note : ''}` : v.note
      if (why) c.append(h('small', '', why))
      chips.append(c)
      return c
    }
    const story = () => sheet?.querySelector('.story')
    const lightStory = (phrase, cls) => story()?.replaceWith(storyMark(p.text, phrase, cls))

    function showFinal() {
      box.replaceChildren()
      for (const line of lines) {
        if (line.lookAt) {
          const tl = tableLook(line.lookAt)
          if (tl) {
            box.append(tl.el)
            tl.final()
          }
          continue
        }
        line.order.forEach(chipFor)
        if (line.key) chipFor(line.key)
        if (line.label) box.append(h('div', 'piece-label', line.label))
        const d = h('div', 'plug-line' + (line.key || line.label ? ' work' : ''))
        d.append(tex(lineTex(line, new Set(line.order), Infinity)))
        box.append(d)
      }
      const gr = distGraph(p.leaf, val, TXT)
      if (gr) box.append(gr.el)
      if (sheet && p.clue) story()?.replaceWith(storyEl({ text: p.text, clue: p.clue }, true))
    }
    let run = 0
    async function play() {
      const me = ++run
      const alive = () => me === run && el.isConnected
      chips.replaceChildren()
      box.replaceChildren()
      for (const line of lines) {
        if (line.lookAt) {
          const tl = tableLook(line.lookAt)
          if (!tl) continue
          box.append(tl.el)
          await tl.play(alive)
          if (!alive()) return
          continue
        }
        const done = new Set()
        // finishing rows show their first row straight away
        const first = line.lhs ? 1 : 0
        let n = first
        if (line.label) box.append(h('div', 'piece-label', line.label))
        const d = h('div', 'plug-line enter' + (line.key || line.label ? ' work' : ''))
        const draw = () => d.replaceChildren(tex(lineTex(line, done, n)))
        // a line of work starts at the words it comes from
        if (line.key && vars[line.key].from) lightStory(vars[line.key].from, color[line.key])
        draw()
        box.append(d)
        await wait(450)
        for (const k of line.order) {
          if (!alive()) return
          const v = vars[k]
          if (v.from) lightStory(v.from, color[k])
          const chip = chipFor(k)
          chip.animate([{ transform: 'scale(1.15)' }, { transform: 'none' }], { duration: 300 })
          await wait(420)
          if (!alive()) return
          const spots = [...d.querySelectorAll(`svg g.${color[k]}`)]
          await Promise.all(spots.map((g, i) => wait(i * 90).then(() => alive() && fly(chip, g, v.txt, color[k]))))
          if (!alive()) return
          done.add(k)
          draw()
          d.querySelectorAll(`svg g.${color[k]}`).forEach(g => g.classList.add('glow'))
          tone(semis(523.25, 4 + done.size * 2), 0, 0.09, 'sine', 0.08)
          await wait(260)
        }
        // the work, one row at a time; the last row is the answer
        const steps = stepsOf(line)
        for (let j = first; j <= steps.length; j++) {
          if (j === steps.length && !line.tail) break
          await wait(j > first ? 650 : 350)
          if (!alive()) return
          n = j + 1
          draw()
          const rows = d.querySelectorAll('svg g.pvstep, svg g.pvres')
          rows[rows.length - 1]?.classList.add('glow')
          if (j < steps.length) tone(semis(523.25, 9 + j * 2), 0, 0.1, 'sine', 0.07)
        }
        if (steps.length) {
          d.classList.remove('enter')
          void d.offsetWidth
          d.classList.add('bump')
          if (!line.key && !line.label) sfx.right(2)
        }
        // a worked-out number becomes a chip, ready to plug in
        if (line.key) chipFor(line.key).animate([{ transform: 'scale(1.25)' }, { transform: 'none' }], { duration: 350 })
        await wait(550)
      }
      // last, the picture: the distribution with these numbers, and the part asked about
      const gr = alive() && distGraph(p.leaf, val, TXT)
      if (gr) {
        box.append(gr.el)
        gr.el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
        await gr.play(alive)
      }
      if (alive() && sheet && p.clue) story()?.replaceWith(storyEl({ text: p.text, clue: p.clue }, true))
    }
    replay.addEventListener('click', () => {
      if (reduced()) showFinal()
      else play()
    })
    if (auto && !reduced()) setTimeout(play, 0)
    else showFinal()
    return el
  }

  // test mode: longer stories with a trap in each (the trap says what it is)
  const HARD = {
    binomial: [
      () => { const pct = pickOne([10, 15, 20, 25]), n = ri(10, 16); return { text: `On average, ${pct}% of an airline's flights arrive late, and flights are late independently of each other. Of the next ${n} flights, X is the number that arrive late.`, clue: `Of the next ${n} flights`,
        trap: '“On average” sounds like Poisson, but there is a fixed number of flights, each late with the same chance: binomial.',
        vars: { n: V(n, `next ${n} flights`), p: worked(V(pct / 100, `${pct}%`), { order: [], tex: S => `${S('p')} = ${pct}\\% = \\frac{${pct}}{100}`, steps: () => [`= ${fmt(pct / 100)}`] }), q: q1(pct / 100), x: sayX(near((n * pct) / 100, 0, n)) } } },

  // the story with its deciding phrase highlighted (or plain, before the end)
  function storyEl(sc, lit) {
    const p = h('p', 'story')
    const at = lit ? sc.text.indexOf(sc.clue) : -1
    if (at < 0) {
      p.textContent = sc.text
      return p
    }
    p.append(document.createTextNode(sc.text.slice(0, at)), h('mark', 'clue', sc.clue), document.createTextNode(sc.text.slice(at + sc.clue.length)))
    return p
  }
  function leafCard(key) {
    const L = LEAVES[key]
    const c = h('div', 'leafcard')
    const t = h('h3', '', L.name)
    t.append(h('small', '', L.sec))
    const row = (label, text) => {
      const r = h('p')
      r.append(h('span', '', label), document.createTextNode(text))
      return r
    }
    const pdf = h('p')
    pdf.append(h('span', '', L.name === 'Chi-squared' ? 'Is' : 'pdf'), tex(L.tex, false))
    c.append(t, pdf, row('Use case', L.use), row('X is', L.x), row('Key', L.key))
    return c
  }
  // ---------- the tree, animated: which distribution, and why ----------
  // A family-tree chart: the first question on top, each answer a box below its
  // question, the ten distributions at the ends. Playing a path draws the line down
  // to each answer, fades the other answers, says why, and opens the distribution.
  function treeWalk({ leaf: only = null } = {}) {
    const COL = 124, BOXW = 114, ROW = 112, TOP = 8
    // the nodes: the root question, then one per answer (its next question, or its distribution)
    const nodes = []
    const add = (parent, b, depth) => {
      const n = { parent, depth, answer: b?.a ?? null, more: b?.more ?? '', why: b?.why ?? '', q: b ? b.node?.q ?? null : TREE.q, leaf: b?.leaf ?? null, kids: [] }
      nodes.push(n)
      if (parent) parent.kids.push(n)
      for (const c of (b ? b.node?.branches : TREE.branches) ?? []) add(n, c, depth + 1)
      return n
    }
    const root = add(null, null, 0)
    // leaves left to right; each parent centred over its children
    let col = 0
    const place = n => {
      if (!n.kids.length) n.x = col++ * COL + COL / 2
      else {
        n.kids.forEach(place)
        n.x = (n.kids[0].x + n.kids[n.kids.length - 1].x) / 2
      }
      n.y = TOP + n.depth * ROW
    }
    place(root)
    const W = col * COL, H = TOP + (Math.max(...nodes.map(n => n.depth)) + 1) * ROW
    const svg = svgEl('svg', { class: 'lineage', width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Decision tree: which distribution' })
    const lines = svgEl('g')
    svg.append(lines)
    // word-wrap for the boxes (SVG text does not wrap)
    const wrapText = (s, max) => {
      const out = []
      let line = ''
      for (const w of s.split(' ')) {
        if ((line + ' ' + w).trim().length > max && line) {
          out.push(line)
          line = w
        } else line = (line + ' ' + w).trim()
      }
      if (line) out.push(line)
      return out
    }
    for (const n of nodes) {
      const g = svgEl('g', { class: 'lt-node' + (n.leaf ? ' leaf' : '') + (n === root ? ' root' : '') })
      const rows = []
      if (n.answer) rows.push(...wrapText(n.answer, 17).map(t => ['ans', t]))
      if (n.leaf) rows.push(...wrapText(LEAVES[n.leaf].name.toUpperCase(), 13).map(t => ['name', t]), ['sec', LEAVES[n.leaf].sec])
      else if (n.q) rows.push(...wrapText(n.q, 17).map(t => ['q', t]))
      const lh = { ans: 13, q: 15, name: 17, sec: 13 }
      const hgt = rows.reduce((s, [k]) => s + lh[k], 0) + 14
      n.h = hgt
      g.append(svgEl('rect', { x: n.x - BOXW / 2, y: n.y, width: BOXW, height: hgt, rx: 9 }))
      let ty = n.y + 7
      for (const [k, t] of rows) {
        ty += lh[k]
        g.append(svgEl('text', { x: n.x, y: ty - 3, class: 'lt-' + k, 'text-anchor': 'middle' }, t))
      }
      if (n.leaf) {
        g.setAttribute('role', 'button')
        g.setAttribute('tabindex', '0')
        g.setAttribute('aria-label', `Show the path to ${LEAVES[n.leaf].name}`)
        g.addEventListener('click', () => play([n.leaf]))
        g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play([n.leaf]) } })
      }
      n.g = g
      svg.append(g)
    }
    // family-tree lines: down from the parent, across, down to the child
    for (const n of nodes) if (n.parent) {
      const p = n.parent, y1 = p.y + p.h, mid = y1 + (n.y - y1) / 2
      const d = `M${p.x},${y1} V${mid} H${n.x} V${n.y}`
      lines.append(n.line = svgEl('path', { d, class: 'lt-line' }))
      lines.append(n.glow = svgEl('path', { d, class: 'lt-glow', pathLength: 100 }))
    }
    const dot = svgEl('circle', { r: 6, class: 'lt-dot' })
    dot.style.display = 'none'
    svg.append(dot)

    const wrap = h('div', 'twalk')
    const bar = h('div', 'twalk-bar')
    const playAll = h('button', 'btn', only ? '▶ Play it again' : '▶ Play every path')
    playAll.type = 'button'
    const stop = h('button', 'btn ghost', 'Stop')
    stop.type = 'button'
    stop.hidden = true
    bar.append(playAll, stop, h('span', 'twalk-hint', only ? '' : 'or tap a distribution to see only its path'))
    const scroller = h('div', 'lineage-scroll')
    scroller.append(svg)
    const caption = h('div', 'lt-caption')
    caption.hidden = true
    wrap.append(bar, scroller, caption)

    const follow = n => {
      const want = n.x - scroller.clientWidth / 2
      scroller.scrollTo({ left: Math.max(0, want), behavior: reduced() ? 'auto' : 'smooth' })
    }
    function reset() {
      svg.classList.remove('walking')
      for (const n of nodes) {
        n.g.classList.remove('lit', 'nope', 'here')
        n.glow?.classList.remove('on')
      }
      dot.style.display = 'none'
      caption.hidden = true
      caption.replaceChildren()
    }
    // the dot runs down the line to the child
    const run = (n, ms) => new Promise(done => {
      const len = n.glow.getTotalLength()
      const t0 = performance.now()
      dot.style.display = ''
      const step = now => {
        const k = Math.min(1, (now - t0) / ms)
        const pt = n.glow.getPointAtLength(len * k)
        dot.setAttribute('cx', pt.x)
        dot.setAttribute('cy', pt.y)
        if (k < 1) requestAnimationFrame(step)
        else done()
      }
      requestAnimationFrame(step)
      setTimeout(done, ms + 200)
    })
    let runId = 0
    async function play(leaves) {
      const me = ++runId
      const alive = () => me === runId && wrap.isConnected
      playAll.hidden = true
      stop.hidden = false
      for (const leaf of leaves) {
        reset()
        svg.classList.add('walking')
        const path = []
        for (let n = nodes.find(x => x.leaf === leaf); n; n = n.parent) path.unshift(n)
        root.g.classList.add('lit', 'here')
        follow(root)
        caption.hidden = false
        caption.replaceChildren(h('p', 'lt-ask', root.q))
        tone(semis(523.25, 4), 0, 0.08, 'sine', 0.06)
        await wait(reduced() ? 0 : 900)
        for (const n of path.slice(1)) {
          if (!alive()) return
          for (const s of n.parent.kids) if (s !== n) s.g.classList.add('nope')
          n.glow.classList.add('on')
          follow(n)
          if (!reduced()) await run(n, 700)
          if (!alive()) return
          for (const x of nodes) x.g.classList.remove('here')
          n.g.classList.add('lit', 'here')
          const said = h('p', 'lt-said')
          said.append(h('b', '', n.answer), document.createTextNode(' · ' + n.more))
          caption.replaceChildren(h('p', 'lt-ask', n.parent.q), said, h('p', 'lt-why', n.why))
          tone(semis(523.25, 9), 0, 0.08, 'sine', 0.06)
          await wait(reduced() ? 0 : n.leaf ? 900 : 2100)
        }
        if (!alive()) return
        dot.style.display = 'none'
        caption.append(leafCard(leaf))
        caption.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
        sfx.right(2)
        await wait(reduced() ? 0 : 4500)
        if (!alive()) return
      }
      playAll.hidden = false
      stop.hidden = true
    }
    playAll.addEventListener('click', () => play(only ? [only] : PICK_ORDER))
    stop.addEventListener('click', () => {
      runId++
      reset()
      playAll.hidden = false
      stop.hidden = true
    })
    if (only) setTimeout(() => play([only]), 0)
    return wrap
  }

  // the distributions a story is most often mistaken for
  const CONFUSED = {
    binomial: ['hyper', 'negbin', 'poisson', 'geometric', 'normal'],
    geometric: ['negbin', 'binomial', 'exponential', 'poisson', 'hyper'],
    negbin: ['geometric', 'binomial', 'gamma', 'hyper', 'poisson'],
    hyper: ['binomial', 'poisson', 'negbin', 'geometric', 'uniform'],
    poisson: ['binomial', 'exponential', 'geometric', 'hyper', 'gamma'],
    uniform: ['normal', 'exponential', 'binomial', 'chi', 'gamma'],
    exponential: ['gamma', 'poisson', 'geometric', 'uniform', 'chi'],
    gamma: ['exponential', 'negbin', 'chi', 'poisson', 'normal'],
    // not gamma: every chi-squared IS a gamma (β = 2)
    chi: ['normal', 'exponential', 'uniform', 'poisson', 'binomial'],
    normal: ['uniform', 'chi', 'binomial', 'exponential', 'gamma'],
  }
  // a story, four distribution names, and the tree path as the explanation
  function treeProblem(leaf = pickOne(Object.keys(LEAVES)), hard = false) {
    const sc = pickOne((hard ? HARD : STORIES)[leaf])()
    const path = pathTo(leaf)
    // a story can rule out a decoy that would also be right for it; top up from the rest
    const avoid = sc.avoid ?? []
    const decoys = CONFUSED[leaf].filter(k => !avoid.includes(k))
    for (const k of shuffleArr(Object.keys(LEAVES))) if (decoys.length < 5 && k !== leaf && !avoid.includes(k) && !decoys.includes(k)) decoys.push(k)
    const names = shuffleArr([leaf, ...decoys])
    return {
      ask: 'Which distribution does X have?',
      text: sc.text,
      latex: sc.latex ? `${sc.latex} \\qquad X \\sim \\,?` : 'X \\sim \\,?',
      trap: sc.trap,
      options: names.map(k => ({ name: LEAVES[k].name, latex: LEAVES[k].tex })),
      answer: 'abcdef'[names.indexOf(leaf)],
      placeholder: 'a to f',
      hint: { text: `${path.map(x => x.b.a).join(' → ')}. ${path[path.length - 1].b.why}` },
      clue: sc.clue,
      leaf,
      vars: sc.vars,
    }
  }

  // ---------- show the work: World 1's worked answers, step by step ----------
  // The class app's worked answer (answerLatex) is split into rows and steps, and
  // every number in it that comes from the question flies in from a chip.
  const matchBrace = (src, open) => {
    let d = 0
    for (let i = open; i < src.length; i++) {
      if (src[i] === '\\') { i++; continue }
      if (src[i] === '{') d++
      else if (src[i] === '}' && --d === 0) return i
    }
    return src.length - 1
  }
  // the numbers in a piece of text or LaTeX, signed; words in \text{…} are skipped
  // unless keepText (a number there can be read, but not coloured)
  function numberTokens(src, latex, keepText = false) {
    const out = []
    let i = 0
    while (i < src.length) {
      if (latex && src[i] === '\\') {
        const m = /^\\([a-zA-Z]+)/.exec(src.slice(i))
        if (!m) { i += 2; continue }
        if (/^(text|textbf|textit|mathrm|operatorname)$/.test(m[1]) && src[i + m[0].length] === '{') {
          const open = i + m[0].length
          const close = matchBrace(src, open)
          // words: skipped, or read as plain text (their minus signs follow text rules)
          if (keepText) for (const t of numberTokens(src.slice(open + 1, close), false)) out.push({ ...t, start: t.start + open + 1, end: t.end + open + 1 })
          i = close + 1
        } else i += m[0].length
        continue
      }
      const m = /^\d+(?:\{,\}\d{3})*(?:\.\d+)?/.exec(src.slice(i))
      if (m && !/[\d.]/.test(src[i - 1] ?? '')) {
        let val = parseFloat(m[0].replace(/\{,\}/g, ''))
        let start = i
        let j = i - 1
        while (j >= 0 && src[j] === ' ') j--
        if (j >= 0 && (src[j] === '-' || src[j] === '−')) {
          const before = src.slice(0, j).trimEnd()
          // a minus after a number or a bracket is a subtraction; anywhere else it is a sign
          const afterWords = latex && /\}$/.test(before) && /\\(text|textbf|textit|mathrm|operatorname)\{[^{}]*\}$/.test(before)
          const binary = latex
            ? /[\d)}\]a-zA-Z]$/.test(before) && !afterWords && !/\\(le|ge|leq|geq|approx|to|Rightarrow|cdot|times|quad|qquad|pm|lt|gt)$/.test(before)
            : /[\d)]$/.test(before)
          if (!binary) {
            val = -val
            start = j
          }
        }
        out.push({ start, end: i + m[0].length, val, tok: src.slice(start, i + m[0].length) })
        i += m[0].length
        continue
      }
      i++
    }
    return out
  }
  // 0, 1 and 2 turn up everywhere (1 − p, 2σ²…): never claim those came from the question
  const linkable = v => !(Number.isInteger(v) && Math.abs(v) <= 2)
  // split LaTeX at its top level (outside braces and \left…\right) where sepAt(i) says so
  function splitTop(src, sepAt) {
    const parts = []
    let d = 0, from = 0
    for (let i = 0; i < src.length; i++) {
      const c = src[i]
      if (c === '\\') {
        const m = /^\\([a-zA-Z]+|.)/.exec(src.slice(i))
        if (m[1] === 'left') d++
        else if (m[1] === 'right') d--
        else if (d === 0 && i > from) {
          const n = sepAt(src, i)
          if (n) {
            parts.push(src.slice(from, i))
            from = i
            i += n - 1
            continue
          }
        }
        i += m[0].length - 1
        continue
      }
      if (c === '{' || c === '(') d++
      else if (c === '}' || c === ')') d--
      else if (d === 0 && i > from) {
        const n = sepAt(src, i)
        if (n) {
          parts.push(src.slice(from, i))
          from = i
          i += n - 1
        }
      }
    }
    parts.push(src.slice(from))
    return parts
  }
  const trimSpace = t => t.replace(/^(?:\s|\\[;,!: ]|\\quad|\\qquad)+|(?:\s|\\[;,!: ]|\\quad|\\qquad)+$/g, '')
  // rows: a new row at a colon, a ⇒, a \quad; the colon itself is dropped
  function workRows(latex) {
    const rows = splitTop(latex, (src, i) => {
      if (src[i] === ':') return 1
      const m = /^(?:\;)?\\Rightarrow(?:\;)?|^\\quad/.exec(src.slice(i))
      return m ? m[0].length : 0
    })
    return rows
      .map(r => trimSpace(r.replace(/^:/, '').replace(/^\\quad/, '')))
      .filter(Boolean)
      .map(r => splitTop(r, (src, i) => (src[i] === '=' ? 1 : (/^\\approx(?![a-zA-Z])|^\\to(?![a-zA-Z])/.exec(src.slice(i)) ?? [''])[0].length)))
  }
  // a few words of the question around the number at q (its own spot, not a search)
  function around(text, q) {
    const tok = text.slice(q.start, q.end)
    const leftClause = text.slice(0, q.start).split(/[.;?!]\s|, | and | with /).pop()
    const rightClause = text.slice(q.end).split(/[.;?!,]| and | with /)[0]
    let left = (leftClause.match(/(?:\S+\s+){0,3}$/) ?? [''])[0]
    let right = (rightClause.match(/^\S*(?:\s+\S+){0,4}/) ?? [''])[0]
    // never stop on a little word ("… of them are")
    while (/\s(?:the|a|an|of|to|in|on|at|is|are|was|were|who|that|them|and|or|with|by|for|from|did)$/i.test(right)) right = right.replace(/\s+\S+$/, '')
    // a bare number ("an IQ score of 93?"): reach back past the clause break
    if (!left.trim() && !right.trim()) left = (text.slice(0, q.start).match(/(?:\S+\s+){0,4}$/) ?? [''])[0]
    return (left + tok + right).trim()
  }

  // the table cells a worked answer reads, found by checking the class's own table
  // against the numbers in the work (so a cell is only shown if it really is the one)
  function findLookups(p, level) {
    const work = p.options ? null : p.answerLatex
    if (!work) return []
    tables ??= unit.printedTables()
    const toks = src => numberTokens(src ?? '', true, true)
    const workToks = toks(work).map(t => t.tok.replace('−', '-'))
    const inWork = str => workToks.includes(str) || workToks.includes('-' + str)
    const out = []
    const add = spec => {
      if (out.length < 2 && !out.some(o => o.name === spec.name && o.row === spec.row && o.col === spec.col)) out.push(spec)
    }
    if (level === 'Normal table' || level === 'Normal word problems') {
      // read backwards: "the closest entry to A is E" / "A is the entry at z"
      const back = [...work.matchAll(/closest entry to \}\s*(-?[\d.]+)\s*\\text\{ is \}\s*(-?[\d.]+)/g)].map(m => ({ target: m[1], entry: m[2] }))
      for (const m of work.matchAll(/(-?[\d.]+)\s*\\text\{ is the entry at \}/g)) back.push({ target: m[1], entry: (+m[1]).toFixed(4) })
      // "left area A: z = …": the entry closest to A
      const areas = [...work.matchAll(/left area \}\s*(\d*\.?\d+)/g)].map(m => m[1])
      // a z: two decimals, or anything written as "z = …"; never a row or column label
      const isZ = (src, t) => !/\\text\{(?:row|column) \}\s*$/.test(src.slice(0, t.start)) &&
        (/^-?\d\.\d\d$/.test(t.tok.replace('−', '-')) || /z(?:_\{?[\w.]*\}?)? = $/.test(src.slice(0, t.start)))
      const zs = [...toks(work).filter(t => isZ(work, t)), ...toks(p.latex ?? '').filter(t => isZ(p.latex ?? '', t))].filter(t => Math.abs(t.val) < 4)
      for (const t of zs) {
        const cell = zCell(t.val)
        const entry = cellOf('normal', cell.row, cell.col)
        if (!entry) continue
        const b = back.find(x => x.entry === entry)
        const area = areas.find(A => closestZ(+A).includes(Math.round(t.val * 100)))
        if (b) add({ name: 'normal', ...cell, target: b.target })
        else if (area != null) {
          const two = closestZ(+area)
          add({ name: 'normal', ...cell, target: area, halfway: two.length === 2 ? two.map(z => z / 100).sort((a, b) => a - b) : null })
        }
        else if (inWork(entry)) add({ name: 'normal', ...cell })
      }
    } else if (level === 'Binomial table') {
      const n = /n = (19|20) table/.exec(p.hint?.text ?? '')?.[1]
      const col = /column p = (\d*\.?\d+)/.exec(p.hint?.text ?? '')?.[1]
      if (n && col) {
        const name = n === '19' ? 'binomial19' : 'binomial'
        for (const m of work.matchAll(/F\((\d+)\)/g)) {
          const entry = cellOf(name, m[1], col)
          if (entry && inWork(entry)) add({ name, row: m[1], col })
        }
      }
    } else if (level === 'Chi-squared table') {
      const g = /γ = (\d+)/.exec(p.text ?? '')?.[1] ?? [...work.matchAll(/\\gamma = (\d+)/g)].at(-1)?.[1]
      const t = tables.chi2
      const r = g && t.rows[+g - 1]
      if (r) {
        const qToks = toks(p.latex).map(x => x.tok)
        r.values.forEach((v, j) => {
          if (inWork(v) || qToks.includes(v)) add({ name: 'chi2', row: g, col: t.cols[j], target: qToks.includes(v) ? v : null })
        })
      }
    }
    return out
  }

  // Which numbers in the work came from the question. A number is linked only when its
  // exact spelling ("0.5000" is not "0.5") appears once in the question and once in the
  // work, outside results ("= 0.75") and the answer, and outside \max(…) (whose inputs
  // are worked out). Anything less certain stays unlinked: a link must never mislead.
  function linkWork(p, rows, level) {
    const lastRow = rows.length - 1
    // the answer: the last step of the last row (the whole work, when it is just the answer)
    const isAnswer = (r, j) => r === lastRow && j === rows[r].length - 1 && (rows[r].length > 1 || rows.length === 1)
    // World 1's questions are stories and tables, where each given number has one role.
    // Elsewhere a formula question's numbers turn up again in computed results by
    // chance, so only story questions link, and never through an exponent (worked out).
    const world1 = typeof level !== 'string' || WORLD1_LEVELS.has(level)
    if (!world1 && !p.text) return { used: [], links: [], isAnswer }
    const spell = t => t.tok.replace('−', '-')
    const colourable = new Set(numberTokens(p.latex ?? '', true).map(t => t.start))
    const q = [
      ...numberTokens(p.text ?? '', false).map(t => ({ ...t, inText: true })),
      ...numberTokens(p.latex ?? '', true, true).map(t => ({ ...t, inText: false, colourable: colourable.has(t.start) })),
    ].filter(t => linkable(t.val))
    const cands = []
    rows.forEach((row, r) => row.forEach((c, j) => {
      if (isAnswer(r, j) || /^\s*(=|\\approx)\s*-?[\d.]+(\\ldots)?\s*[,:]?\s*$/.test(c)) return
      // the step after a \max(…) holds its results, not the question's numbers
      if (j > 0 && /\\max\(/.test(row[j - 1])) return
      // "= 150, …": the 150 is a result, whatever follows it
      const lead = /^\s*(=|\\approx)\s*-?[\d.]+\s*[,:]/.exec(c)?.[0].length ?? 0
      const skip = []
      for (const m of c.matchAll(/\\max\(/g)) {
        let d = 0, k = m.index + 4
        for (; k < c.length; k++) {
          if (c[k] === '(') d++
          else if (c[k] === ')' && --d === 0) break
        }
        skip.push([m.index, k])
      }
      for (const t of numberTokens(c, true)) {
        if (!linkable(t.val) || t.start < lead || skip.some(([a, b]) => t.start >= a && t.start <= b)) continue
        if (!world1 && /\^\{?\s*$/.test(c.slice(0, t.start))) continue
        // a column label is an area or a digit of z, not a number from the question
        // (a row label can be: the χ² table's row is the story's γ)
        if (/\\text\{column \}\s*$/.test(c.slice(0, t.start))) continue
        cands.push({ r, j, ...t })
      }
    }))
    const used = [], links = []
    for (const t of cands) {
      const sp = spell(t)
      const inQ = q.filter(x => spell(x) === sp)
      // once in the story and once more in the formula is the same number said twice
      const inStory = inQ.filter(x => x.inText)
      const once = inQ.length === 1 || (level === 'Normal word problems' && inQ.length === 2 && inStory.length === 1)
      if (!once || cands.filter(x => spell(x) === sp).length !== 1) continue
      const src = inStory[0] ?? inQ[0]
      if (used.length >= 5) continue
      const u = { src, tok: sp, val: t.val, cls: 'pv' + used.length, where: src.inText ? around(p.text, src) : null }
      used.push(u)
      links.push({ r: t.r, j: t.j, start: t.start, end: t.end, u })
    }
    return { used, links, isAnswer }
  }

  function workPanel(p, { sheet = null, auto = false, next = null, level = null } = {}) {
    // lettered options have no numbers to work, just the reason
    const work = p.options ? null : p.answerLatex ?? null
    const el = h('div', 'plug')
    el.append(h('h3', '', work ? 'Show the work' : 'Why'))
    const rule = h('div', 'plug-line work-rule')
    if (p.hint?.latex) rule.append(tex(p.hint.latex))
    const chips = h('div', 'plug-chips')
    const box = h('div', 'work-rows')
    const why = p.hint?.text ? h('p', 'plug-sub work-why', p.hint.text) : null
    el.append(rule, chips, box)
    const looks = findLookups(p, level)
    const lookBox = h('div')
    el.append(lookBox)
    // the distribution, when the question pins one down
    const graphSpec = inferGraph(p, level)
    const graphBox = h('div')
    el.append(graphBox)
    if (why) el.append(why)
    const acts = h('div', 'row-actions')
    const replay = h('button', 'btn ghost', 'Replay')
    replay.type = 'button'
    acts.append(replay)
    if (next) acts.append(next)
    el.append(acts)

    // the question's numbers, and which of them the work uses (a colour each)
    const rows = work ? workRows(work) : []
    const { used, links, isAnswer } = linkWork(p, rows, level)
    // colour only the linked spots, by position
    const wrapChunk = (r, j, c) => {
      let out = c
      for (const l of links.filter(l => l.r === r && l.j === j).sort((a, b) => b.start - a.start)) out = out.slice(0, l.start) + `{\\class{${l.u.cls}}{${out.slice(l.start, l.end)}}}` + out.slice(l.end)
      return out
    }
    // the answer is boxed, as in World 0
    const boxed = c => {
      const m = /^\s*(=|\\approx)\s*([\s\S]*)$/.exec(c)
      return m ? `${m[1]} \\boxed{${m[2]}}` : `\\boxed{${c}}`
    }
    const rowTex = (r, n) =>
      rows[r].slice(0, n).map((c, j) => (isAnswer(r, j) ? `\\class{pvres}{{}${boxed(c)}}` : wrapChunk(r, j, c))).join('')
    // the question itself, with the numbers lit up in their colours
    const story = () => sheet?.querySelector('.story')
    const qMath = () => sheet?.querySelector('.q-math')
    function lightQuestion() {
      if (!sheet || !used.length) return
      if (p.text && story()) {
        const para = h('p', 'story')
        let at = 0
        for (const u of used.filter(u => u.src.inText).sort((a, b) => a.src.start - b.src.start)) {
          para.append(document.createTextNode(p.text.slice(at, u.src.start)), h('mark', 'pvmark ' + u.cls, p.text.slice(u.src.start, u.src.end)))
          at = u.src.end
        }
        para.append(document.createTextNode(p.text.slice(at)))
        story().replaceWith(para)
      }
      const inMath = used.filter(u => !u.src.inText && u.src.colourable)
      if (p.latex && qMath() && inMath.length) {
        let l = p.latex
        for (const u of inMath.sort((a, b) => b.src.start - a.src.start)) l = l.slice(0, u.src.start) + `{\\class{${u.cls}}{${l.slice(u.src.start, u.src.end)}}}` + l.slice(u.src.end)
        const m = tex(l)
        m.classList.add('q-math')
        qMath().replaceWith(m)
      }
    }
    const chipFor = u => {
      let c = chips.querySelector(`[data-v="${u.val}"]`)
      if (c) return c
      c = h('span', 'plug-chip ' + u.cls, u.tok)
      c.dataset.v = String(u.val)
      c.append(h('small', '', u.where ? `“${u.where}”` : 'in the question'))
      chips.append(c)
      return c
    }

    function showFinal() {
      if (why) why.hidden = false
      used.forEach(chipFor)
      box.replaceChildren(...rows.map((r, i) => {
        const d = h('div', 'plug-line')
        d.append(tex(rowTex(i, r.length)))
        return d
      }))
      lookBox.replaceChildren()
      for (const spec of looks) {
        const tl = tableLook(spec)
        if (tl) {
          lookBox.append(tl.el)
          tl.final()
        }
      }
      graphBox.replaceChildren()
      const gr = drawGraph(graphSpec)
      if (gr) graphBox.append(gr.el)
      lightQuestion()
    }
    let run = 0
    async function play() {
      const me = ++run
      const alive = () => me === run && el.isConnected
      chips.replaceChildren()
      box.replaceChildren()
      lookBox.replaceChildren()
      graphBox.replaceChildren()
      // the reason comes last, under the finished work
      if (why && rows.length) why.hidden = true
      rule.classList.remove('enter')
      void rule.offsetWidth
      rule.classList.add('enter')
      lightQuestion()
      await wait(500)
      for (const u of used) {
        if (!alive()) return
        chipFor(u)
        tone(semis(523.25, 2), 0, 0.06, 'sine', 0.05)
        await wait(300)
      }
      for (let r = 0; r < rows.length; r++) {
        const d = h('div', 'plug-line enter')
        box.append(d)
        const seen = {}
        for (let n = 1; n <= rows[r].length; n++) {
          if (!alive()) return
          d.replaceChildren(tex(rowTex(r, n)))
          // the numbers new in this step start hidden, then fly in from their chips
          const landing = []
          for (const u of used) {
            const spots = [...d.querySelectorAll(`svg g.${u.cls}`)]
            spots.slice(seen[u.cls] ?? 0).forEach(g => {
              g.style.opacity = '0'
              landing.push({ g, u })
            })
            seen[u.cls] = spots.length
          }
          await Promise.all(landing.map(({ g, u }, i) => wait(i * 90).then(() => alive() && fly(chipFor(u), g, u.tok, u.cls)).then(() => {
            g.style.opacity = ''
            g.classList.add('glow')
          })))
          if (!alive()) return
          const last = r === lastRow && n === rows[r].length
          if (last) {
            d.querySelector('svg g.pvres')?.classList.add('glow')
            d.classList.remove('enter')
            void d.offsetWidth
            d.classList.add('bump')
            sfx.right(2)
          } else tone(semis(523.25, 5 + n * 2), 0, 0.08, 'sine', 0.07)
          await wait(landing.length ? 250 : 600)
        }
      }
      // how the table gives the numbers the work used
      for (const spec of looks) {
        if (!alive()) return
        const tl = tableLook(spec)
        if (!tl) continue
        lookBox.append(tl.el)
        tl.el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
        await tl.play(alive)
      }
      const gr = alive() && drawGraph(graphSpec)
      if (gr) {
        graphBox.append(gr.el)
        gr.el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
        await gr.play(alive)
      }
      if (why && alive()) {
        why.hidden = false
        why.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400 })
      }
    }
    replay.addEventListener('click', () => {
      if (reduced()) showFinal()
      else play()
    })
    if (auto && !reduced()) setTimeout(play, 0)
    else showFinal()
    return el
  }

  // ---------- tables and formula sheet ----------
  const overlay = document.getElementById('overlay')
  const TAB_NAMES = { binomial19: 'Binomial n = 19', binomial: 'Binomial n = 20', normal: 'Normal z', chi2: 'Chi-squared' }
  let tables = null
  function closeOverlay() {
    overlay.hidden = true
    overlay.replaceChildren()
    document.body.style.overflow = ''
  }
  function openTables(which = unit.tables[0]) {
    tables ??= unit.printedTables()
    overlay.replaceChildren()
    const inner = h('div', 'overlay-inner')
    const head = h('div', 'overlay-head')
    for (const name of unit.tables) {
      const b = h('button', 'tool', TAB_NAMES[name] ?? name)
      b.type = 'button'
      b.setAttribute('aria-pressed', String(name === which))
      b.addEventListener('click', () => openTables(name))
      head.append(b)
    }
    const close = h('button', 'tool', 'Close')
    close.type = 'button'
    close.addEventListener('click', closeOverlay)
    head.append(close)
    inner.append(head)
    const t = tables[which]
    inner.append(h('h3', '', t.title), h('p', 'note', t.note))
    const wrap = h('div', 'table-wrap')
    const table = h('table', 'ptable')
    const thead = h('thead')
    const hr = h('tr')
    hr.append(h('th', '', t.corner))
    t.cols.forEach(c => hr.append(h('th', '', c)))
    thead.append(hr)
    const tbody = h('tbody')
    t.rows.forEach(row => {
      const tr = h('tr')
      tr.append(h('th', '', row.label))
      row.values.forEach(v => tr.append(h('td', '', v)))
      tbody.append(tr)
    })
    table.append(thead, tbody)
    // tap a cell to light up its row and column, like a finger on the paper
    table.addEventListener('click', e => {
      const td = e.target.closest('td')
      if (!td) return
      const ri = td.parentElement.rowIndex
      const ci = td.cellIndex
      table.querySelectorAll('.line, .here').forEach(x => x.classList.remove('line', 'here'))
      for (const tr of table.rows) {
        if (tr.rowIndex === ri) for (const c of tr.cells) c.classList.add('line')
        else if (tr.cells[ci]) tr.cells[ci].classList.add('line')
      }
      td.classList.remove('line')
      td.classList.add('here')
    })
    wrap.append(table)
    inner.append(wrap)
    overlay.append(inner)
    overlay.hidden = false
    document.body.style.overflow = 'hidden'
  }
  async function openSheet() {
    await mathBoot
    overlay.replaceChildren()
    const inner = h('div', 'overlay-inner')
    const head = h('div', 'overlay-head')
    head.append(h('strong', '', 'Formula sheet'))
    const close = h('button', 'tool', 'Close')
    close.type = 'button'
    close.addEventListener('click', closeOverlay)
    head.append(close)
    inner.append(head)
    const group = (title, lines) => {
      inner.append(h('h3', '', title))
      const grid = h('div', 'sheet-grid')
      for (const f of lines) {
        const card = h('div', 'formula')
        card.append(h('p', '', f.label), tex(f.latex))
        grid.append(card)
      }
      inner.append(grid)
    }
    group('Printed on the sheet: you get these', unit.sheet.given)
    group('Might be on the sheet, might not: learn to build these yourself', unit.sheet.maybe)
    group('Never on the sheet: memorize these', unit.sheet.know)
    overlay.append(inner)
    overlay.hidden = false
    document.body.style.overflow = 'hidden'
  }

  // ---------- wiring ----------
  document.getElementById('home').addEventListener('click', () => {
    closeOverlay()
    renderMap()
  })
  document.getElementById('open-tables').addEventListener('click', () => openTables())
  document.getElementById('open-sheet').addEventListener('click', openSheet)
  document.getElementById('sound').addEventListener('click', () => {
    state.muted = !state.muted
    save()
    hud()
    if (!state.muted) sfx.right(0)
  })
  document.addEventListener('keydown', e => {
    if (!overlay.hidden) {
      if (e.key === 'Escape') closeOverlay()
      return
    }
    if (screen !== 'question' || e.metaKey || e.ctrlKey || e.altKey) return
    const k = e.key.toLowerCase()
    const idx = '12345678'.indexOf(k) >= 0 ? '12345678'.indexOf(k) : 'abcdefgh'.indexOf(k)
    const btns = [...view.querySelectorAll('.choice')]
    if (idx >= 0 && btns[idx] && !btns[idx].disabled) btns[idx].click()
  })

  // a new screen (question, card, results) starts with a clean page
  new MutationObserver(() => {
    clearInk()
    renderBuddy()
  }).observe(document.getElementById('view'), { childList: true })
  // #dev in the address: the panels, for testing them on their own
  if (location.hash === '#dev') window.__arcade = { workPanel, plugPanel, treeProblem, buildChoices6, tex, h, distGraph, graphOf, inferGraph, drawGraph, problemFor, REVIEW }
  if (petTick()) setTimeout(() => toast('Devolved…'), 600)
  // a long-open tab gets hungry too
  setInterval(() => {
    petTick()
    if (screen === 'map') renderMap()
  }, 10 * 60 * 1000)
  hud()
  renderMap()
  connect()
})()
</script>
