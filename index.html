<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body { margin: 0; } [hidden] { display: none !important; } img { max-width: 100%; }</style>
<title>Math 3800 Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  --paper: #edf4ea;
  --sheet: #f8fbf6;
  --ink: #17241c;
  --muted: #5a6a5f;
  --rule: #2e7d4f;
  --rule-soft: #cfe3d3;
  --graphite: #343b36;
  --on-graphite: #f8fbf6;
  --gold: #c98407;
  --gold-soft: #fbe7bc;
  --red: #c8392f;
  --red-soft: #f7dad6;
  --green: #1d8a4b;
  --green-soft: #d3eedb;
  --shadow: 0 1px 0 rgba(23, 36, 28, 0.06), 0 8px 24px -12px rgba(23, 36, 28, 0.25);
  --display: 'Big Shoulders Display', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0f1612;
    --sheet: #17211b;
    --ink: #e4eee6;
    --muted: #93a598;
    --rule: #63c28a;
    --rule-soft: #26392c;
    --graphite: #dce5de;
    --on-graphite: #17211b;
    --gold: #f0b43a;
    --gold-soft: #3b2f12;
    --red: #ff7d71;
    --red-soft: #3d1f1b;
    --green: #5fd394;
    --green-soft: #173523;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 28px -14px rgba(0, 0, 0, 0.7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0f1612;
  --sheet: #17211b;
  --ink: #e4eee6;
  --muted: #93a598;
  --rule: #63c28a;
  --rule-soft: #26392c;
  --graphite: #dce5de;
  --on-graphite: #17211b;
  --gold: #f0b43a;
  --gold-soft: #3b2f12;
  --red: #ff7d71;
  --red-soft: #3d1f1b;
  --green: #5fd394;
  --green-soft: #173523;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 28px -14px rgba(0, 0, 0, 0.7);
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  /* faint scantron rule lines */
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule-soft) 31px 32px);
}
button { font: inherit; color: inherit; }
/* nothing here is meant to be selected: the S Pen side button drags would highlight text */
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--rule); outline-offset: 2px; }

.app { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 64px; }

/* ---------- heads-up bar ---------- */
.hud {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  padding: 10px 0;
  background: var(--paper);
  border-bottom: 2px solid var(--rule);
}
.wordmark {
  font-family: var(--display);
  font-weight: 800;
  font-size: 1.35rem;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--rule);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  margin-right: auto;
}
.stat { display: flex; align-items: baseline; gap: 6px; font-family: var(--mono); font-size: 0.85rem; color: var(--muted); }
.stat b { font-family: var(--display); font-size: 1.35rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.lvl { display: grid; gap: 3px; min-width: 112px; }
.lvl-bar { height: 6px; border-radius: 3px; background: var(--rule-soft); overflow: hidden; }
.lvl-bar i { display: block; height: 100%; background: var(--gold); transition: width 0.5s ease; }
.tools { display: flex; gap: 6px; }
.tool {
  border: 1.5px solid var(--rule);
  background: var(--sheet);
  color: var(--rule);
  border-radius: 999px;
  padding: 4px 11px;
  font-family: var(--mono);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
}
.tool[aria-pressed="true"] { background: var(--rule); color: var(--sheet); }

/* ---------- map ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; margin: 22px 0 8px; }
.hero h1 {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(2rem, 7vw, 3.1rem);
  line-height: 0.95;
  text-transform: uppercase;
  margin: 0 0 8px;
  text-wrap: balance;
}
.hero p { margin: 0; color: var(--muted); max-width: 46ch; }
.bell { width: 190px; max-width: 42vw; }
.bell svg { width: 100%; height: auto; display: block; }
.bell figcaption { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); text-align: center; margin-top: 2px; }
.bell figcaption b { color: var(--ink); font-family: var(--display); font-size: 1.6rem; display: block; line-height: 1; }
.cta {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; margin: 14px 0 6px; padding: 14px 18px;
  border: 0; border-radius: 14px; cursor: pointer; text-align: left;
  background: var(--rule); color: var(--sheet);
  box-shadow: var(--shadow);
}
.cta small { display: block; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
.cta strong { font-family: var(--display); font-size: 1.5rem; font-weight: 800; text-transform: uppercase; line-height: 1.05; }
.cta .go { font-family: var(--display); font-size: 2rem; }

.world { margin-top: 26px; }
.world-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; border-bottom: 1.5px solid var(--rule); padding-bottom: 4px; margin-bottom: 10px; }
.world-head h2 { font-family: var(--display); font-weight: 800; font-size: 1.5rem; text-transform: uppercase; margin: 0; color: var(--rule); letter-spacing: 0.02em; }
.world-head span { font-size: 0.9rem; color: var(--muted); }
.world-head em { font-style: normal; margin-left: auto; font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.level {
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 10px;
  padding: 10px 12px; text-align: left; cursor: pointer;
  background: var(--sheet); border: 1.5px solid var(--rule-soft); border-radius: 12px;
}
.level:hover { border-color: var(--rule); }
.level .oval {
  grid-row: span 2;
  width: 30px; height: 40px; border-radius: 50%;
  border: 2px solid var(--rule);
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 0.8rem; font-weight: 600; color: var(--rule);
}
.level.cleared .oval { background: var(--graphite); border-color: var(--graphite); color: var(--on-graphite); }
.level .name { font-weight: 700; line-height: 1.25; }
.level .stars { font-family: var(--mono); font-size: 0.85rem; color: var(--gold); letter-spacing: 0.15em; }
.level .stars .off { color: var(--rule-soft); }
.level.next { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
.level.next .oval { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.boss {
  display: grid; gap: 4px; width: 100%; margin-top: 26px; padding: 16px 18px; text-align: left; cursor: pointer;
  background: var(--sheet); border: 2px dashed var(--gold); border-radius: 14px; color: var(--muted);
}
.boss:hover { border-style: solid; }
.boss .boss-title { font-family: var(--display); font-weight: 800; font-size: 1.6rem; text-transform: uppercase; color: var(--gold); line-height: 1; }
.boss b { color: var(--ink); }

/* ---------- written answers: paper mode and the boss ---------- */
.written { display: grid; gap: 6px; margin-top: 14px; }
.written label { font-family: var(--mono); font-size: 0.74rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--rule); }
.answer-input {
  width: 100%; padding: 11px 13px; font: inherit; font-size: 1.1rem;
  color: var(--ink); background: var(--paper);
  border: 1.5px solid var(--rule-soft); border-radius: 10px;
}
.answer-input:focus { outline: 3px solid var(--rule); outline-offset: 1px; border-color: var(--rule); }
.preview { min-height: 1.6em; color: var(--muted); font-size: 0.95rem; overflow-x: auto; }
.paper-note { margin: 0; color: var(--muted); font-size: 0.95rem; }
.verdict { margin-top: 12px; padding: 9px 13px; border-radius: 10px; font-weight: 700; }
.verdict.ok { background: var(--green-soft); color: var(--green); }
.verdict.bad { background: var(--red-soft); color: var(--red); }
.reveal-box { margin-top: 12px; padding: 12px 14px; border-left: 4px solid var(--rule); background: var(--paper); border-radius: 0 10px 10px 0; }
.reveal-box h3 { margin: 6px 0 2px; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rule); }
.reveal-box h3:first-child { margin-top: 0; }
.reveal-box p { margin: 4px 0; }
.mode { display: block; font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.06em; opacity: 0.85; }
.boss-nav { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
.boss-nav button {
  width: 30px; height: 36px; padding: 0; border-radius: 50%; cursor: pointer;
  border: 2px solid var(--rule-soft); background: var(--sheet); color: var(--muted);
  font-family: var(--mono); font-size: 0.7rem; font-weight: 600;
}
.boss-nav button.done { background: var(--graphite); border-color: var(--graphite); color: var(--on-graphite); }
.boss-nav button.here { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
.clock { font-family: var(--display); font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); }
.toggle[aria-pressed="true"] { background: var(--graphite); border-color: var(--graphite); color: var(--on-graphite); }
.review-item { padding: 16px 0; border-top: 1.5px dashed var(--rule-soft); }
.review-item h4 { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--rule); }
.review-item h4 .mark { margin-left: auto; padding: 2px 9px; border-radius: 999px; font-size: 0.72rem; }
.mark.ok { background: var(--green-soft); color: var(--green); }
.mark.bad { background: var(--red-soft); color: var(--red); }
.mark.todo { background: var(--gold-soft); color: var(--gold); }
.wrote { font-family: var(--mono); font-size: 0.9rem; margin: 6px 0; }
.score-line { position: sticky; top: 64px; z-index: 2; margin: 0 0 8px; padding: 8px 12px; border-radius: 10px; background: var(--gold-soft); color: var(--ink); font-weight: 700; }
.redo { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* ---------- the tree: outline, story clues, distribution cards ---------- */
.outline ul { list-style: none; margin: 0 0 0 8px; padding: 0; }
.outline ul li { position: relative; padding: 4px 0 4px 22px; }
.outline ul li::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1.5px solid var(--rule-soft); }
.outline ul li:last-child::before { bottom: auto; height: 16px; }
.outline ul li::after { content: ''; position: absolute; left: 0; top: 16px; width: 14px; border-top: 1.5px solid var(--rule-soft); }
.oq { display: inline-block; margin: 3px 0; padding: 2px 10px; border: 1.5px solid var(--rule); border-radius: 8px; font-weight: 700; color: var(--rule); }
.oa { display: block; font-size: 0.95rem; color: var(--muted); }
.oa b { color: var(--ink); }
.oleaf { display: inline-block; margin-top: 3px; padding: 4px 10px; background: var(--paper); border-left: 3px solid var(--gold); font-size: 0.92rem; }
.oleaf b { font-family: var(--display); font-size: 1.15rem; text-transform: uppercase; letter-spacing: 0.02em; }
.clue { background: var(--gold-soft); color: var(--ink); border-bottom: 2px solid var(--gold); padding: 0 2px; }
.leafcard { margin-top: 12px; padding: 12px 14px; border-left: 4px solid var(--gold); background: var(--paper); border-radius: 0 10px 10px 0; }
.leafcard h3 { margin: 0 0 4px; font-family: var(--display); font-size: 1.7rem; text-transform: uppercase; line-height: 1; }
.leafcard h3 small { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); margin-left: 8px; }
.leafcard p { margin: 3px 0; }
.why .leafcard h3, .reveal-box .leafcard h3 { margin: 0 0 4px; font-family: var(--display); font-size: 1.7rem; letter-spacing: 0; text-transform: uppercase; color: var(--ink); line-height: 1; }
.leafcard p span { display: inline-block; min-width: 76px; color: var(--muted); font-family: var(--mono); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; }

/* ---------- the sheet (card, question, results) ---------- */
.sheet {
  position: relative;
  margin-top: 18px;
  background: var(--sheet);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 20px 20px 22px 38px;
  overflow: hidden;
}
/* scantron timing marks down the left edge */
.sheet::before {
  content: '';
  position: absolute; left: 12px; top: 18px; bottom: 18px; width: 10px;
  background: repeating-linear-gradient(to bottom, var(--graphite) 0 6px, transparent 6px 22px);
  opacity: 0.85;
}
.eyebrow { font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rule); font-weight: 600; }
.sheet h2 { font-family: var(--display); font-weight: 800; font-size: clamp(1.7rem, 5.5vw, 2.3rem); text-transform: uppercase; line-height: 1; margin: 6px 0 14px; text-wrap: balance; }
.points { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.points li { padding-left: 26px; position: relative; max-width: 62ch; }
.points li::before { content: ''; position: absolute; left: 0; top: 0.3em; width: 12px; height: 16px; border-radius: 50%; border: 2px solid var(--rule); }
.row-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.btn {
  border: 0; border-radius: 12px; padding: 12px 20px; cursor: pointer;
  background: var(--rule); color: var(--sheet);
  font-family: var(--display); font-weight: 800; font-size: 1.25rem; text-transform: uppercase; letter-spacing: 0.03em;
}
.btn.ghost { background: transparent; color: var(--rule); border: 2px solid var(--rule); }

.qtop { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.progress { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; min-width: 0; }
.progress i { width: 14px; height: 18px; border-radius: 50%; border: 2px solid var(--rule-soft); }
.progress i.ok { background: var(--graphite); border-color: var(--graphite); }
.progress i.bad { background: var(--red); border-color: var(--red); }
.progress i.now { border-color: var(--rule); }
.combo { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.combo span { padding: 2px 7px; border-radius: 999px; border: 1.5px solid var(--rule-soft); }
.combo span.on { background: var(--gold); border-color: var(--gold); color: var(--sheet); }
.combo strong { color: var(--ink); font-family: var(--display); font-size: 1.15rem; margin-right: 4px; }

.ask { margin: 14px 0 4px; font-weight: 700; }
.story { margin: 4px 0; max-width: 64ch; }
.math-d { overflow-x: auto; overflow-y: hidden; padding: 6px 0; text-align: center; }
.math-d mjx-container { margin: 0 !important; }
.math-d mjx-container svg { max-width: none; }
.choices { display: grid; gap: 8px; margin-top: 12px; }
.pick { display: grid; gap: 10px; margin-top: 14px; max-width: 640px; justify-items: start; }
.pick-label { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pick-box { position: relative; width: 100%; }
.pick-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 58px; padding: 10px 14px; border: 2px solid var(--rule); border-radius: 10px; background: var(--sheet); color: var(--ink); font: inherit; font-size: 1.05rem; text-align: left; cursor: pointer; }
.pick-toggle:disabled { cursor: default; }
.pick-shown { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; overflow-x: auto; overflow-y: hidden; }
.pick-caret { color: var(--rule); font-size: 1.2rem; }
/* opens in place (the card would clip a floating list) */
.pick-list { margin-top: 6px; padding: 6px; border: 2px solid var(--rule); border-radius: 10px; background: var(--sheet); box-shadow: var(--shadow); }
.pick-group { padding: 10px 10px 4px; font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pick-opt { display: grid; grid-template-columns: minmax(140px, 32%) 1fr; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.pick-opt .math-i { overflow-x: auto; overflow-y: hidden; }
.pick-opt:hover, .pick-opt:focus-visible { background: var(--rule-soft); outline: none; }
.pick-opt[aria-selected="true"] { background: var(--green-soft); box-shadow: inset 0 0 0 2px var(--green); }
.pick-name { font-weight: 700; }
.pick-name small { display: block; font-family: var(--mono); font-size: 0.72rem; font-weight: 500; color: var(--muted); }
@media (max-width: 520px) { .pick-opt { grid-template-columns: 1fr; gap: 2px; } }
.pick.right .pick-toggle { border-color: var(--green); background: var(--green-soft); }
.pick.wrong .pick-toggle { border-color: var(--red); background: var(--red-soft); }
@media (min-width: 720px) { .choices.six { grid-template-columns: 1fr 1fr; } }
.choice {
  position: relative;
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px;
  width: 100%; padding: 10px 12px; text-align: left; cursor: pointer;
  background: var(--sheet); border: 1.5px solid var(--rule-soft); border-radius: 12px;
  min-height: 56px;
}
.choice:hover:not(:disabled) { border-color: var(--rule); }
.choice:disabled { cursor: default; }
.choice .oval {
  width: 28px; height: 38px; border-radius: 50%;
  border: 2px solid var(--rule); color: var(--rule);
  display: grid; place-items: center;
  font-family: var(--mono); font-weight: 600; font-size: 0.85rem;
  transition: background 0.15s, color 0.15s;
}
.choice .val { overflow-x: auto; overflow-y: hidden; font-size: 1.05rem; padding-block: 2px; }
.choice .val .choice-name { display: block; margin-bottom: 2px; }
.twalk { margin-top: 10px; }
.twalk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 6px 0 10px; }
.twalk-hint { color: var(--muted); font-size: 0.9rem; }
.lineage-scroll { overflow-x: auto; overflow-y: hidden; padding: 4px 0 10px; border: 1px solid var(--rule-soft); border-radius: 12px; background: var(--paper); }
.lineage { display: block; margin: 0 auto; font-family: var(--body); }
.lineage .lt-line { fill: none; stroke: var(--rule-soft); stroke-width: 2; }
.lineage .lt-glow { fill: none; stroke: var(--gold); stroke-width: 3.5; stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0; }
.lineage .lt-glow.on { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset 0.7s ease-out; }
.lineage .lt-dot { fill: var(--gold); filter: drop-shadow(0 0 4px var(--gold)); }
.lineage .lt-node rect { fill: var(--sheet); stroke: var(--rule-soft); stroke-width: 1.5; transition: fill 0.35s, stroke 0.35s; }
.lineage .lt-node.root rect { stroke: var(--rule); stroke-width: 2; }
.lineage .lt-node.leaf rect { stroke: var(--gold); }
.lineage .lt-node.leaf { cursor: pointer; }
.lineage .lt-node.leaf:hover rect, .lineage .lt-node.leaf:focus-visible rect { fill: var(--gold-soft); }
.lineage .lt-node { transition: opacity 0.35s; outline: none; }
.lineage .lt-ans { fill: var(--muted); font-size: 11px; }
.lineage .lt-q { fill: var(--ink); font-size: 12.5px; font-weight: 700; }
.lineage .lt-name { fill: var(--ink); font-family: var(--display); font-size: 15px; font-weight: 800; }
.lineage .lt-sec { fill: var(--muted); font-family: var(--mono); font-size: 10.5px; }
.lineage.walking .lt-node { opacity: 0.35; }
.lineage.walking .lt-node.lit { opacity: 1; }
.lineage .lt-node.nope { opacity: 0.12 !important; }
.lineage .lt-node.lit rect { fill: var(--green-soft); stroke: var(--green); stroke-width: 2.5; }
.lineage .lt-node.leaf.lit rect { fill: var(--gold); stroke: var(--gold); }
.lineage .lt-node.leaf.lit text { fill: #17241c; }
.lineage .lt-node.here rect { stroke: var(--gold); stroke-width: 3; }
.lt-caption { margin-top: 10px; padding: 10px 14px; border-left: 4px solid var(--gold); background: var(--paper); border-radius: 0 10px 10px 0; animation: line-in 0.3s ease-out; }

<script>
;(() => {
  const T2 = window.Test2
  const unit = T2.unit
  const lineByShort = Object.fromEntries(unit.guide.map(g => [g.short, g]))
  const ROUND = 6
  // a level of its own (not a study-guide line): name the distribution, every chapter
  const TREE_LEVEL = 'Which distribution? (all chapters)'
  // the same question with test-style stories: longer, with traps
  const TREE_LEVEL2 = 'Which distribution? Test mode'
  const isTree = short => short === TREE_LEVEL || short === TREE_LEVEL2
  const REVIEW_NAMES = { 'World 1 review': 1, 'World 2 review': 1, 'World 3 review': 1, 'World 4 review': 1, Everything: 1 }
  // every kind of question a level has (its templates, across its topics)
  const levelKinds = short => (isTree(short) || short in REVIEW_NAMES ? [] : T2.guideTopics(unit, lineByShort[short]).flatMap(t => t.templates.map(tp => ({ t, tp }))))
  // a round shows every kind at least once, and never fewer than ROUND questions;
  // naming the distribution is quick, so its rounds run twice as long
  const roundSize = short => (short === 'Everything' ? REVIEW.Everything.length : short in REVIEW_NAMES ? 12 : isTree(short) ? ROUND * 2 : Math.max(ROUND, levelKinds(short).length))

  // ---------- the path: the review list, easiest points first ----------
  const WORLDS = [
    {
      num: 0,
      name: 'The tree',
      blurb: 'Which distribution is it? Every chapter, 3.4 to 4.4.',
      levels: [TREE_LEVEL, TREE_LEVEL2],
    },
    {
      num: 1,
      name: 'Free points',
      blurb: 'Read a table, name the story. No algebra.',
      levels: ['Which distribution?', 'Parameters and possible values', 'Normal table', 'Normal word problems', 'Binomial table', 'Chi-squared table'],
    },
    {
      num: 2,
      name: 'Plug it in',
      blurb: 'Know the formula, put the numbers in.',
      levels: ['Discrete probabilities', 'Uniform pdf', 'First event (exponential)', 'Continuous probabilities', 'Mean and variance from an MGF'],
    },
    {
      num: 3,
      name: 'The scripts',
      blurb: 'Derivations that come out the same every time.',
      levels: ['Geometric pdf', 'Geometric cdf', 'Geometric MGF', 'Derive the negative binomial pdf', 'Derive the discrete pdfs', 'Verify a pdf, or find the constant'],
    },
    {
      num: 4,
      name: 'Calculus',
      blurb: 'Integrals and derivatives, one move at a time.',
      levels: ['pdf ↔ cdf', 'Mean and variance from a pdf', 'Find an MGF from a pdf', 'Integration by parts, gamma integrals'],
    },
  ].map(w => ({ ...w, levels: w.levels.filter(s => isTree(s) || lineByShort[s]) }))
  // a review at the end of Worlds 1–4 mixes that world's levels; World 5 mixes them all
  const REVIEW = {}
  for (const w of WORLDS) if (w.num >= 1 && w.num <= 4) {
    const name = `World ${w.num} review`
    REVIEW[name] = [...w.levels]
    w.levels.push(name)
  }
  WORLDS.push({ num: 5, name: 'Everything', blurb: 'Every world mixed: one question from every level, World 0 included.', levels: ['Everything'] })
  REVIEW.Everything = WORLDS.filter(w => w.num <= 4).flatMap(w => w.levels.filter(s => !REVIEW[s]))
  const isReview = short => short in REVIEW
  const WORLD1_LEVELS = new Set(WORLDS.find(w => w.num === 1).levels)
  const ORDER = WORLDS.flatMap(w => w.levels)
  const BOSS_ORDER = ORDER.filter(s => !isReview(s))

  // ---------- power-up cards: the whole idea in plain words ----------
  const CARDS = {
    'Which distribution?': [
      'No math needed here: every story gives itself away with a clue phrase.',
      '"until the FIRST …" → geometric. "Callers until the first sale."',
      '"until the 2nd, 3rd, 5th …" → negative binomial. "Wells drilled until the 3rd strike."',
      '"out of the next 12", "flips a coin 20 times" (a fixed number of tries) → binomial.',
      '"without replacement", "a 5-card hand", "from a group of 56" → hypergeometric.',
      '"an average of 4 per hour", "per page", "in a 30-minute window" → Poisson.',
    ],
    'Parameters and possible values': [
      'Binomial: n = number of tries, p = chance of success. X can be 0, 1, …, n.',
      'Negative binomial: r = successes you need, p = chance of success. X can be r, r + 1, r + 2, … (no top).',
      'Hypergeometric: N = group size, r = successes in the group, n = how many you grab. X runs from max(0, n − (N − r)) up to min(n, r).',
      'Poisson: k = rate × amount. 4 per hour over 30 minutes: k = 4 × 0.5 = 2. X can be 0, 1, 2, … (no top).',
    ],
    'Normal table': [
      'The table gives the area to the LEFT of z: P(Z < z).',
      'Row = z cut off after one decimal (1.2, not rounded), column = the second decimal (0.05). Together: z = 1.25.',
      'Area on the right: 1 − the table value. Between two z values: bigger value − smaller value.',
      'Backwards: find the area inside the table, then read its z off the row and column.',
    ],
    'Normal word problems': [
      'Turn x into z: z = (x − μ)/σ. Round z to 2 decimals.',
      'Look z up: that is the area to the left, which is also the percentile.',
      'IQ (μ = 100, σ = 15): a 139 gives z = 2.6, the table says 0.9953, so the 99.53rd percentile.',
      'Backwards: area → z from the table → x = μ + zσ. The middle 95% is μ ± 1.96σ.',
    ],
    'Binomial table': [
      'Pick the table for your n (19 or 20), the column for p, the row for x. The entry is P(X ≤ x).',
      'Fewer than 8 means at most 7: read row 7. At least 8: 1 − row 7. More than 8: 1 − row 8.',
      'Exactly 8: row 8 − row 7.',
    ],
    'Chi-squared table': [
      'Rows: degrees of freedom γ. Columns: the area to the LEFT of the value.',
      'χ² with r in the subscript has area r on the RIGHT, so read the column for 1 − r. χ²₀.₀₅ lives in the 0.95 column.',
      'Given a value in a row, its column heading tells you the left area. The right area is 1 minus that.',
    ],
    'Discrete probabilities': [
      'Name the distribution and its numbers first, then put x into its formula.',
      'At most 2 = P(0) + P(1) + P(2). At least 1 = 1 − P(0).',
      'Binomial: C(n, x)·pˣ·qⁿ⁻ˣ with q = 1 − p. Poisson: e⁻ᵏkˣ/x! (on the formula sheet).',
    ],
    'Uniform pdf': [
      'Uniform on [A, B] means flat: every value is equally likely.',
      'The rectangle from A to B must have area 1, so its height is 1/(B − A). That height is the pdf.',
      'A probability is a length over the full length: P(c < X < d) = (d − c)/(B − A).',
    ],
    'First event (exponential)': [
      'Events arrive at rate λ (like 3 per hour). The wait W for the first one has pdf f(x) = λe^(−λx).',
      'P(W ≤ t) = 1 − e^(−λt). P(W > t) = e^(−λt).',

  // ---------- progress ----------
  const LOCAL_KEY = 'math3800-arcade.v1'
  const fresh = () => ({ v: 1, xp: 0, stars: {}, plays: {}, lastDay: null, days: 0, muted: false, answered: 0, correct: 0, boss: null, pet: null, updated: 0 })
  let state = fresh()
  try {
    const s = JSON.parse(localStorage.getItem(LOCAL_KEY))
    if (s && s.v === 1) state = { ...fresh(), ...s }
  } catch {}

  let remote = null // the viewer's own progress document, when the page can sync
  let writing = Promise.resolve()
  function save() {
    state.updated = Date.now()
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)) } catch {}
    if (remote) {
      const body = JSON.parse(JSON.stringify(state))
      writing = writing.then(() => remote.set(body)).catch(() => {})
    }
  }
  async function connect() {
    try {
      if (!window.claude?.use) return
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')])
      if (!db || !user) return
      const id = await user.id()
      if (!id) return
      const ref = db.doc('data/users/' + id + '/arcade')
      const snap = await ref.get()
      remote = ref
      const theirs = snap.exists ? snap.data() : null
      if (theirs && theirs.v === 1 && (theirs.updated || 0) > (state.updated || 0)) {
        state = { ...fresh(), ...JSON.parse(JSON.stringify(theirs)) }
        try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)) } catch {}
        hud()
        if (screen === 'map') renderMap()
      } else if (state.updated) save()
    } catch {}
  }

  const XP_PER_LEVEL = 250
  const level = xp => 1 + Math.floor(xp / XP_PER_LEVEL)
  const readiness = () => BOSS_ORDER.reduce((s, k) => s + Math.min(3, state.stars[k] || 0), 0) / (3 * BOSS_ORDER.length)
  const grade = r => (r >= 0.9 ? 'A' : r >= 0.8 ? 'B' : r >= 0.7 ? 'C' : r >= 0.6 ? 'D' : r > 0 ? 'F' : '–')
  const today = () => new Date().toLocaleDateString('en-CA')
  const nextUp = () => ORDER.find(k => (state.stars[k] || 0) < 2) ?? ORDER.find(k => (state.stars[k] || 0) < 3) ?? ORDER[0]

  // ---------- sound ----------
  let ac = null
  function audio() {
    if (state.muted) return null
    try {
      ac ??= new (window.AudioContext || window.webkitAudioContext)()
      if (ac.state === 'suspended') ac.resume()
      return ac
    } catch { return null }
  }
  function tone(freq, at, dur, type = 'triangle', gain = 0.16) {
    const a = audio()
    if (!a) return
    const t = a.currentTime + at
    const o = a.createOscillator()
    const g = a.createGain()
    o.type = type
    o.frequency.setValueAtTime(freq, t)
    g.gain.setValueAtTime(0.0001, t)
    g.gain.exponentialRampToValueAtTime(gain, t + 0.015)
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
    o.connect(g).connect(a.destination)
    o.start(t)
    o.stop(t + dur + 0.02)
  }
  const semis = (base, n) => base * Math.pow(2, n / 12)
  const sfx = {
    right(combo) {
      const base = semis(523.25, Math.min(combo, 12))
      tone(base, 0, 0.14)
      tone(semis(base, 7), 0.07, 0.22)
    },
    wrong() {
      tone(150, 0, 0.22, 'square', 0.07)
      tone(110, 0.09, 0.28, 'square', 0.06)
    },
    clear() { [0, 4, 7, 12, 16].forEach((n, i) => tone(semis(523.25, n), i * 0.09, 0.3)) },
    levelUp() { [0, 7, 12, 19, 24].forEach((n, i) => tone(semis(392, n), i * 0.07, 0.35, 'square', 0.06)) },
  }

  // ---------- confetti ----------
  const fx = document.getElementById('fx')
  const ctx = fx.getContext('2d')
  let bits = []
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches
  function burst(n = 120) {
    if (reduced()) return
    const cs = getComputedStyle(document.documentElement)
    const colors = ['--gold', '--rule', '--green', '--red', '--graphite'].map(v => cs.getPropertyValue(v).trim())
    const w = (fx.width = innerWidth * devicePixelRatio)
    fx.height = innerHeight * devicePixelRatio
    for (let i = 0; i < n; i++) {
      bits.push({
        x: w / 2 + (Math.random() - 0.5) * w * 0.3,
        y: fx.height * 0.35,
        vx: (Math.random() - 0.5) * 16 * devicePixelRatio,
        vy: (-6 - Math.random() * 12) * devicePixelRatio,
        r: (4 + Math.random() * 5) * devicePixelRatio,
        c: colors[i % colors.length],
        spin: Math.random() * 6,
        life: 0,
      })
    }
    if (bits.length === n) requestAnimationFrame(tick)
  }
  function tick() {
    ctx.clearRect(0, 0, fx.width, fx.height)
    bits = bits.filter(b => b.life < 160 && b.y < fx.height + 40)
    for (const b of bits) {
      b.life++
      b.vy += 0.35 * devicePixelRatio
      b.vx *= 0.99
      b.x += b.vx
      b.y += b.vy
      ctx.save()
      ctx.translate(b.x, b.y)
      ctx.rotate(b.spin + b.life * 0.1)
      ctx.fillStyle = b.c
      ctx.beginPath()
      ctx.ellipse(0, 0, b.r, b.r * 1.35, 0, 0, Math.PI * 2) // little filled-in bubbles
      ctx.fill()
      ctx.restore()
    }
    if (bits.length) requestAnimationFrame(tick)
    else ctx.clearRect(0, 0, fx.width, fx.height)
  }
  function pop(text, el) {
    const r = el.getBoundingClientRect()
    const s = document.createElement('span')
    s.className = 'pop'
    s.textContent = text
    s.style.left = Math.min(innerWidth - 90, r.right - 70) + 'px'
    s.style.top = r.top - 6 + 'px'
    document.body.append(s)
    setTimeout(() => s.remove(), 950)
  }
  function toast(text) {
    const s = document.createElement('div')
    s.className = 'toast'
    s.textContent = text
    document.body.append(s)
    setTimeout(() => s.remove(), 1650)
  }

  // ---------- the pet: it eats right answers and evolves through the distributions ----------
  const STAGES = [
    { name: 'Egg', says: 'something is in there', at: 0 },
    { name: 'Bernoulli', says: 'one trial at a time', at: 3 },
    { name: 'Binomial', says: 'counts its wins', at: 40 },
    { name: 'Poisson', says: 'lives at a steady rate', at: 120 },
    { name: 'Gamma', says: 'patiently waits for things', at: 260 },
    { name: 'Normal', says: 'perfectly balanced, the final form', at: 450 },
  ]
  const BOSS_FOR_FINAL = 17
  const clamp = v => Math.max(0, Math.min(100, v))
  function newPet() {
    return { name: 'Sigma', stage: 0, growth: 0, full: 70, happy: 70, last: Date.now(), starving: null, best: 0 }
  }
  // hunger and boredom build up while you are away; a day starving costs a stage
  function petTick() {
    const pet = (state.pet ??= newPet())
    const now = Date.now()
    const hours = Math.max(0, (now - pet.last) / 3.6e6)
    pet.last = now
    const before = pet.full
    pet.full = clamp(pet.full - hours * 5)
    pet.happy = clamp(pet.happy - hours * 2)
    if (pet.full > 0) pet.starving = null
    else if (pet.starving == null) pet.starving = now - Math.max(0, hours - before / 5) * 3.6e6
    if (pet.stage > 1 && pet.starving != null && now - pet.starving > 24 * 3.6e6) {
      const from = STAGES[pet.stage].name
      pet.stage--
      // back to halfway through the lower stage: it has to earn the form again
      pet.growth = STAGES[pet.stage].at + Math.floor((STAGES[pet.stage + 1].at - STAGES[pet.stage].at) / 2)
      pet.starving = now
      pet.happy = 20
      pet.note = `${pet.name} went hungry for a day and devolved from ${from} to ${STAGES[pet.stage].name}. Feed it a level to win it back.`
      return true
    }
    return false
  }
  const petMood = pet =>
    pet.stage === 0 ? 'egg' : pet.full <= 0 ? 'sick' : pet.full < 30 ? 'hungry' : pet.happy < 30 ? 'sad' : pet.happy > 70 && pet.full > 50 ? 'happy' : 'ok'
  // what stands between the pet and its next form, if anything
  function evolveBlock(pet) {
    const next = STAGES[pet.stage + 1]
    if (!next) return null
    if (pet.growth < next.at) return `${next.at - pet.growth} more growth to become ${next.name}.`
    if (pet.stage > 0 && pet.full < 40) return `Ready to become ${next.name}, but too hungry. Answer a few questions.`
    if (pet.stage > 0 && pet.happy < 40) return `Ready to become ${next.name}, but too sad. Clear a level.`
    if (pet.stage + 1 === STAGES.length - 1 && (state.boss?.best ?? 0) < BOSS_FOR_FINAL) return `The final form needs a Final Boss score of ${BOSS_FOR_FINAL}+.`
    return ''
  }
  function petEvolve() {
    const pet = state.pet
    while (evolveBlock(pet) === '') {
      pet.stage++
      pet.best = Math.max(pet.best, pet.stage)
      const s = STAGES[pet.stage]
      setTimeout(() => {
        toast(pet.stage === 1 ? `${pet.name} hatched!` : `${pet.name} evolved into ${s.name}!`)
        sfx.levelUp()
        burst(140)
        document.querySelectorAll('.buddy').forEach(el => {
          el.classList.remove('evolving')
          void el.offsetWidth
          el.classList.add('evolving')
        })
      }, 500)
    }
  }
  // right answers are snacks, cleared levels are meals, misses sting a little
  function petFeed({ full = 0, happy = 0, growth = 0 }) {
    petTick()
    const pet = state.pet
    if (full > 0) pet.note = null
    pet.full = clamp(pet.full + full)
    pet.happy = clamp(pet.happy + happy)
    pet.growth += growth
    petEvolve()
    renderBuddy()
  }
  function react(kind) {
    const b = document.getElementById('buddy')
    b.classList.remove('cheer', 'oops')
    void b.offsetWidth
    b.classList.add(kind)
  }

      { body: '<path d="M30 108 V70 Q30 50 60 50 Q90 50 90 70 V108 Z"/>', extra: '<rect x="36" y="38" width="10" height="14" rx="2"/><rect x="55" y="28" width="10" height="24" rx="2"/><rect x="74" y="42" width="10" height="10" rx="2"/>', face: [60, 78], fill: '--gold-soft', line: '--gold' },
      { body: '<path d="M18 108 C22 70 34 40 50 40 C66 40 78 70 102 108 Z"/>', extra: '', face: [50, 70], fill: '--red-soft', line: '--red' },
      { body: '<path d="M12 108 C16 60 30 36 44 36 C60 36 70 64 112 108 Z"/>', extra: '<path d="M96 104 q10 -6 14 -18" fill="none" stroke-width="2.5"/>', face: [44, 66], fill: '--rule-soft', line: '--rule' },
      { body: '<path d="M8 108 C34 108 40 34 60 34 C80 34 86 108 112 108 Z"/>', extra: '<path d="M46 32 L48 18 L54 26 L60 14 L66 26 L72 18 L74 32 Z" fill="var(--gold)" stroke="var(--gold)"/>', face: [60, 68], fill: '--gold-soft', line: '--gold' },
    ][pet.stage]
    const shadow = '<ellipse cx="60" cy="112" rx="34" ry="5" fill="var(--rule-soft)" stroke="none"/>'
    if (!P) {
      return `<svg viewBox="0 0 120 120" role="img" aria-label="An egg">${shadow}<g class="critter" fill="var(--sheet)" stroke="var(--rule)" stroke-width="3">
        <ellipse cx="60" cy="68" rx="30" ry="40"/><circle cx="48" cy="56" r="5" fill="var(--rule-soft)" stroke="none"/><circle cx="70" cy="76" r="7" fill="var(--rule-soft)" stroke="none"/><circle cx="56" cy="90" r="4" fill="var(--rule-soft)" stroke="none"/>

    }[mood]
    const mouth = {

      sad: `<path d="M${x - 7} ${y + 14} q7 -6 14 0" fill="none" stroke-width="2.5"/>`,

  // the small one in the corner while you answer
  function renderBuddy() {
    const b = document.getElementById('buddy')
    if (!b || !state.pet) return
    b.hidden = !['question', 'boss'].includes(screen)
    b.innerHTML = petSvg(state.pet)
  }

  // ---------- S Pen ink: only a stylus writes; fingers and the mouse scroll and tap ----------
  // The ink sits on the page (it scrolls with the question) and clears itself
  // when the screen changes. The pen's side button (or eraser end) erases.
  const ink = document.getElementById('ink')
  const inkCtx = ink.getContext('2d')
  const inkClear = document.getElementById('ink-tools')
  const inkEraseBtn = document.getElementById('ink-erase')
  // the pen writes in blue (a lighter blue on the dark theme)
  const penColor = () => getComputedStyle(document.documentElement).getPropertyValue('--pen-blue').trim() || '#1d4ed8'
  // the on-screen eraser, for when the side button is taken (Air Command)
  let inkEraseMode = false
  const setEraseMode = on => {
    inkEraseMode = on
    inkEraseBtn.setAttribute('aria-pressed', String(on))
    if (on) inkClear.hidden = false
  }
  inkEraseBtn.addEventListener('click', () => setEraseMode(!inkEraseMode))
  let inking = false
  let inkLast = null
  const pageSize = () => ({ w: document.documentElement.clientWidth, h: Math.max(document.documentElement.scrollHeight, innerHeight) })
  // keep = copy the strokes across (rotation, the page growing below them)
  function sizeInk(keep) {
    // measure the page without the ink layer, so it never props the page open
    const was = ink.style.height
    ink.style.height = '0px'
    const { w, h } = pageSize()
    ink.style.height = was
    const dpr = window.devicePixelRatio || 1
    let snap = null
    if (keep && ink.width && ink.height) {
      snap = document.createElement('canvas')
      snap.width = ink.width
      snap.height = ink.height
      snap.getContext('2d').drawImage(ink, 0, 0)
    }
    ink.width = Math.round(w * dpr)
    ink.height = Math.round(h * dpr)
    ink.style.width = w + 'px'
    ink.style.height = h + 'px'
    inkCtx.setTransform(dpr, 0, 0, dpr, 0, 0)
    inkCtx.lineCap = 'round'
    inkCtx.lineJoin = 'round'
    if (snap) inkCtx.drawImage(snap, 0, 0, snap.width / dpr, snap.height / dpr)
  }
  function clearInk() {
    inking = false
    inkLast = null
    sizeInk(false)
    inkClear.hidden = true
    setEraseMode(false)
  }
  const onControl = e => e.target instanceof Element && e.target.closest('button, input, a, select, textarea, label, [role="button"]')
  const sideButton = e => (e.buttons & 34) !== 0 || e.button === 2 || e.button === 5
  // where the pen is on the page: the screen spot plus how far the page is scrolled
  const onPage = e => ({ x: e.clientX + window.scrollX, y: e.clientY + window.scrollY })
  // With the side button held, some Samsung browsers stop calling the S Pen a pen and
  // report a right-button mouse instead. Take that as an erase stroke too, and once
  // a stroke starts, follow that pointer to the end whatever it is called.
  let inkPointer = null
  const penLike = e => e.pointerType === 'pen' || (e.pointerType === 'mouse' && sideButton(e))
  // Hold to erase: a stroke erases while the side button is held and writes again
  // once it is let go. Browsers report a held button in two ways:
  //  - the standard one: the pointer's buttons bit 2 (barrel) or 32 (eraser end) on
  //    every event while it is held (Samsung Internet);
  //  - only a right click as it goes down (Chrome): then the stroke it belongs to
  //    erases to its end, including what it drew before the click arrived.
  // Chrome can also cut a held-button drag short; if the pen keeps moving with the
  // button held, erasing picks back up.
  let heldAt = 0 // when the last right click from the side button arrived
  let strokeHeld = false // a right click came during (or just before) this stroke
  let strokePts = [] // this stroke's points, to wipe if it turns out to be an erase
  const held = e => sideButton(e) || strokeHeld
  const wipe = pts => {
    if (pts.length < 2) return
    inkCtx.save()
    inkCtx.globalCompositeOperation = 'destination-out'
    inkCtx.lineWidth = 26
    inkCtx.beginPath()
    inkCtx.moveTo(pts[0].x, pts[0].y)
    for (const pt of pts.slice(1)) inkCtx.lineTo(pt.x, pt.y)
    inkCtx.stroke()
    inkCtx.restore()
  }
  function sidePress(e) {
    if (onControl(e)) return
    e.preventDefault()
    window.getSelection()?.removeAllRanges()
    // during a stroke it belongs to that stroke; with the pen up, to the next touch
    if (!inking) heldAt = Date.now()
    else if (!strokeHeld) {
      strokeHeld = true
      wipe(strokePts)
    }
  }
  window.addEventListener('pointerdown', e => {
    penCheck(e)
    if (!penLike(e) || onControl(e)) return
    const { w, h } = pageSize()
    if (Math.abs(parseFloat(ink.style.width) - w) > 1 || parseFloat(ink.style.height) < h) sizeInk(true)
    inking = true
    inkPointer = e.pointerId
    // a right click just before the pen touched means the button is down
    strokeHeld = Date.now() - heldAt < 700
    inkLast = onPage(e)

      inking = true
      inkPointer = e.pointerId
      inkLast = onPage(e)
      strokePts = [inkLast]
    }
    if (!inking || e.pointerId !== inkPointer) return
    e.preventDefault()
    const erase = inkEraseMode || held(e)

    inkCtx.strokeStyle = penColor()

  window.addEventListener('pointerup', inkUp)

  // the readiness bell: the shaded left area under a normal curve is the share of stars earned
  function invPhi(p) {
    // Acklam's rational approximation
    const a = [-39.69683028665376, 220.9460984245205, -275.9285104469687, 138.357751867269, -30.66479806614716, 2.506628277459239]
    const b = [-54.47609879822406, 161.5858368580409, -155.6989798598866, 66.80131188771972, -13.28068155288572]
    const c = [-0.007784894002430293, -0.3223964580411365, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783]
    const d = [0.007784695709041462, 0.3224671290700398, 2.445134137142996, 3.754408661907416]
    const lo = 0.02425
    if (p < lo) {
      const q = Math.sqrt(-2 * Math.log(p))
      return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1)
    }
    if (p > 1 - lo) return -invPhi(1 - p)
    const q = p - 0.5
    const r = q * q
    return ((((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q) / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1)
  }
  function bellSvg(frac) {
    const W = 200, H = 96, base = 84, top = 10
    const X = z => ((z + 3.2) / 6.4) * W
    const Y = z => base - (base - top) * Math.exp(-(z * z) / 2)
    const pts = []
    for (let z = -3.2; z <= 3.2001; z += 0.1) pts.push([X(z), Y(z)])
    const curve = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')
    let shade = ''
    if (frac > 0) {
      const zc = frac >= 0.999 ? 3.2 : Math.max(-3.2, Math.min(3.2, invPhi(frac)))
      const sp = pts.filter(p => p[0] <= X(zc))
      sp.push([X(zc), Y(zc)])
      shade = `<path d="M${X(-3.2)} ${base} ${sp.map(p => 'L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')} L${X(zc).toFixed(1)} ${base} Z" fill="var(--gold)" opacity="0.85"/>
        <line x1="${X(zc).toFixed(1)}" y1="${base}" x2="${X(zc).toFixed(1)}" y2="${(Y(zc) - 6).toFixed(1)}" stroke="var(--ink)" stroke-width="1.5"/>`
    }
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Readiness ${Math.round(frac * 100)} percent">
      ${shade}
      <path d="${curve}" fill="none" stroke="var(--rule)" stroke-width="2.5"/>
      <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--rule)" stroke-width="1.5"/>
      ${[-2, -1, 0, 1, 2].map(z => `<line x1="${X(z)}" y1="${base}" x2="${X(z)}" y2="${base + 5}" stroke="var(--rule)" stroke-width="1.2"/>`).join('')}
    </svg>`
  }

  // ---------- screens ----------

  function openCard(short) {

        ? 'Test-style stories with traps: a rate that is really a fixed number of tries, a wait that is really uniform, a gamma that is really chi-squared, a pdf or an MGF to recognise. Ask what X counts or measures, then walk the tree.'
        : 'Every question starts here. Ask the questions top to bottom about what X is doing; each answer narrows it down until one distribution is left. Play the paths to watch it decide.'))

  async function startRound(short, paper = false) {
    view.replaceChildren(h('p', 'loading', 'Shuffling the deck…'))
    await mathBoot
    const queue = []
    if (isReview(short)) {
      // every level once, then more, shuffled; never the same level twice in a row
      const parts = REVIEW[short]
      const order = []
      while (order.length < roundSize(short)) {
        const next = shuffleArr(parts)
        if (next[0] === order[order.length - 1]) next.push(next.shift())
        order.push(...next)
      }
      for (const level of order.slice(0, roundSize(short))) queue.push({ p: problemFor(level), level, seen: 0, missed: false })
      round = { short, paper, queue, at: 0, combo: 0, best: 0, misses: 0, gained: 0, marks: [] }
      showQuestion()
      return
    }
    if (isTree(short)) {
      // every distribution once, then repeats, never the same one twice in a row
      const shuffled = () => Object.keys(LEAVES).sort(() => Math.random() - 0.5)
      const order = []
      while (order.length < roundSize(short)) {
        const next = shuffled()
        if (next[0] === order[order.length - 1]) next.push(next.shift())
        order.push(...next)
      }
      for (const leaf of order.slice(0, roundSize(short))) queue.push({ p: treeProblem(leaf, short === TREE_LEVEL2), seen: 0, missed: false })
    }
    const topics = isTree(short) ? [] : T2.guideTopics(unit, lineByShort[short])
    const weights = topics.map(t => t.templates.length)
    const total = weights.reduce((a, b) => a + b, 0)
    const pick = T2.createFreshPicker()
    // one of every kind first, in a random order
    if (!isTree(short)) {
      for (const { tp } of levelKinds(short).sort(() => Math.random() - 0.5)) queue.push({ p: tp.generate(), seen: 0, missed: false })
    }
    // then fill up to the round size with picks weighted toward the bigger topics
    for (let i = queue.length; i < (isTree(short) ? 0 : roundSize(short)); i++) {
      let r = Math.random() * total
      let t = topics[topics.length - 1]
      for (let j = 0; j < topics.length; j++) {
        r -= weights[j]
        if (r <= 0) { t = topics[j]; break }
      }
      queue.push({ p: pick(t), seen: 0, missed: false })
    }
    round = { short, paper, queue, at: 0, combo: 0, best: 0, misses: 0, gained: 0, marks: [] }
    showQuestion()
  }

  // one question from a level: a distribution story, or one of the level's kinds
  function problemFor(level) {
    if (isTree(level)) return treeProblem(undefined, level === TREE_LEVEL2)
    return pickOne(levelKinds(level)).tp.generate()
  }

  const comboTier = c => (c >= 10 ? 3 : c >= 6 ? 2 : c >= 3 ? 1 : 0)
  const MULT = [1, 1.5, 2, 3]

  // Six options where the question allows it: the answer plus five wrong ones.
  // Template distractors (the common mistakes) go first, then nearby values, the
  // same way the class app picks its four. Fixed lettered options stay as they are.
  const fmtChoice = v => String(parseFloat(Math.abs(v) < 1 ? v.toPrecision(4) : v.toFixed(4)))
  const shuffleArr = arr => {
    const a = [...arr]
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1))
      ;[a[i], a[j]] = [a[j], a[i]]
    }
    return a
  }
  const WRONG = 5
  function buildChoices6(p) {
    if (typeof p.answer === 'string') {
      if (p.options) return p.options.map((_, i) => ({ label: 'abcdefgh'[i], correct: 'abcdefgh'[i] === p.answer }))
      if (p.choices) {
        const wrong = [...new Set(p.choices.filter(c => c !== p.answer))].slice(0, WRONG)
        return shuffleArr([{ label: p.answer, correct: true }, ...wrong.map(w => ({ label: w, correct: false }))])
      }
      return T2.buildChoices(p)
    }
    const a = p.answer
    const tol = Math.max(p.tolerance ?? 1e-6, 1e-9)
    const generic =
      a > 0 && a < 1
        ? [1 - a, Math.min(0.99, a * 2), a / 2, Math.min(0.99, a + 0.1), Math.max(0.01, a - 0.1), Math.min(0.99, a + 0.05), Math.max(0.01, a - 0.05), Math.min(0.99, a + 0.2), Math.max(0.01, a - 0.2)]
        : Number.isInteger(a)
          ? [a + 1, a - 1, a * 2, Math.round(a / 2), a + 10, a + 2, a - 2, a * 3]
          : [a * 2, a / 2, a + 0.5, a - 0.5, a + 1, a - 1, a * 1.5]
    const used = new Set([fmtChoice(a)])
    const picked = []
    for (const c of [...(p.distractors ?? []), ...generic]) {
      if (picked.length === WRONG) break
      if (!Number.isFinite(c) || Math.abs(c - a) <= tol * (1 + 1e-9) || (a >= 0 && c < 0)) continue
      const l = fmtChoice(c)
      if (used.has(l) || Math.abs(parseFloat(l) - a) <= tol * (1 + 1e-9)) continue
      used.add(l)
      picked.push(c)
    }
    let bump = 1
    while (picked.length < WRONG) {
      const c = a + (Number.isInteger(a) ? bump : bump * 0.15)
      const l = fmtChoice(c)
      if (!used.has(l) && Math.abs(parseFloat(l) - a) > tol * (1 + 1e-9)) {
        used.add(l)
        picked.push(c)
      }
      bump += 1
    }
    return shuffleArr([{ label: fmtChoice(a), correct: true }, ...picked.map(v => ({ label: fmtChoice(v), correct: false }))])
  }
  // typed answers: the class app's check, except that "16" for 0.16 needs the % sign,
  // so a reciprocal slip (10 for 0.1) or a missing decimal is not marked right
  function checkTyped(raw, p) {
    const ok = T2.checkAnswer(raw, p)
    if (!ok || p.accept || typeof p.answer !== 'number' || /%/.test(raw)) return ok
    let t = String(raw).trim().toLowerCase().replace(/\s+/g, '').replace(/^[a-z]=/, '').replace(',', '.')
    const f = t.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/)
    const n = f ? (Number(f[2]) === 0 ? null : Number(f[1]) / Number(f[2])) : t !== '' && Number.isFinite(Number(t)) ? Number(t) : null
    return n !== null && Math.abs(n - p.answer) < (p.tolerance ?? 1e-6)
  }
  function choicesFor(p) {
    return buildChoices6(p).map(c => {
      if (p.options) {
        const o = p.options['abcdefgh'.indexOf(c.label)]
        if (typeof o === 'string') return { correct: c.correct, text: o }
        return o.name ? { correct: c.correct, name: o.name, tex: o.latex } : { correct: c.correct, tex: o.latex }
      }
      if (p.expr) return { correct: c.correct, tex: T2.toLatex(c.label, p.expr.vars) ?? c.label }
      return { correct: c.correct, text: c.label }
    })
  }

  function showQuestion() {
    screen = 'question'
    const q = round.queue[round.at]
    q.seen++
    const p = q.p
    view.replaceChildren()
    const sheet = h('section', 'sheet')
    const top = h('div', 'qtop')
    const prog = h('div', 'progress')
    round.queue.forEach((x, i) => {

    })
    const combo = h('div', 'combo')
    combo.append(h('strong', '', `${round.combo}×`))
    ;['1σ', '2σ', '3σ'].forEach((s, i) => combo.append(h('span', comboTier(round.combo) > i ? 'on' : '', s)))
    combo.title = 'Answer streak: 3 in a row is 1σ (×1.5 XP), 6 is 2σ (×2), 10 is 3σ (×3)'
    top.append(prog, combo)
    sheet.append(top)
    sheet.append(h('div', 'eyebrow', round.short + (q.level ? ' · ' + q.level : '') + (round.paper ? ' · paper mode' : '') + (q.seen > 1 ? ' · second chance' : '')))
    if (p.ask) sheet.append(h('p', 'ask', p.ask))
    if (p.text) sheet.append(h('p', 'story', p.text))
    const qMath = tex(p.latex)
    qMath.classList.add('q-math')
    sheet.append(qMath)
    if (round.paper) {
      paperQuestion(p, sheet)
      return
    }
    if (p.leaf && p.vars) {
      pickQuestion(p, sheet)
      view.append(sheet)
      window.scrollTo({ top: 0 })
      return
    }
    const list = h('div', 'choices')
    const opts = choicesFor(p)
    const buttons = opts.map((o, i) => {
      const b = h('button', 'choice')
      b.type = 'button'
      const val = h('span', 'val')
      if (o.name) val.append(h('b', 'choice-name', o.name), tex(o.tex, false))
      else if (o.tex) val.append(tex(o.tex, false))
      else val.textContent = o.text
      b.append(h('span', 'oval', 'ABCDEFGH'[i]), val)
      b.addEventListener('click', () => answer(i, opts, buttons, sheet))
      list.append(b)
      return b
    })
    if (opts.length > 4) list.classList.add('six')
    sheet.append(list)
    view.append(sheet)
    window.scrollTo({ top: 0 })
  }

  // XP, streak, sounds and the progress mark for a right answer
  function award(base, anchor) {
    state.answered++
    state.correct++
    round.combo++
    round.best = Math.max(round.best, round.combo)
    const before = level(state.xp)
    const tier = comboTier(round.combo)
    const gain = Math.round(base * MULT[tier])
    state.xp += gain
    round.gained += gain
    round.marks[round.at] = 'ok'
    pop('+' + gain, anchor)
    sfx.right(round.combo)
    if (round.combo === 3 || round.combo === 6 || round.combo === 10) toast(`${tier}σ streak · ×${MULT[tier]}`)
    if (level(state.xp) > before) setTimeout(() => { toast(`Level ${level(state.xp)}!`); sfx.levelUp(); burst(80) }, 300)
    petFeed({ full: 4, happy: round.combo === 3 || round.combo === 6 || round.combo === 10 ? 6 : 1, growth: base >= 20 ? 2 : 1 })
    react('cheer')
    hud()
  }
  // a miss: the streak resets, and the question comes back at the end of the round (up to twice)
  function miss(q) {
    state.answered++
    round.combo = 0
    if (!q.missed) {
      q.missed = true
      round.misses++
    }
    round.marks[round.at] = 'bad'
    if (q.seen < 3) round.queue.push(q)
    sfx.wrong()
    petFeed({ happy: -1 })
    react('oops')
    hud()
  }
  function gotIt(q) {
    const acts = h('div', 'row-actions')
    const cont = h('button', 'btn', q.seen < 3 ? 'Got it · it comes back later' : 'Got it')
    cont.type = 'button'
    cont.addEventListener('click', advance)
    acts.append(cont)
    return { acts, cont }
  }

  function answer(i, opts, buttons, sheet) {
    if (round.locked) return
    round.locked = true
    buttons.forEach(b => (b.disabled = true))
    const q = round.queue[round.at]
    if (opts[i].correct) {
      buttons[i].classList.add('right')
      award(10, buttons[i])
      const p = q.p
      if (p.leaf && p.vars) {
        showPlug(p, sheet)
        return
      }
      const level = q.level ?? round.short
      if (!isTree(level) && (p.answerLatex || p.hint)) {
        const next = h('button', 'btn', 'Next')
        next.type = 'button'
        next.addEventListener('click', advance)
        const panel = workPanel(p, { sheet, auto: true, next, level })
        sheet.append(panel)
        next.focus({ preventScroll: true })
        panel.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
        return
      }
      setTimeout(advance, 850)
      return
    }
    miss(q)
    buttons[i].classList.add('wrong')
    const good = opts.findIndex(o => o.correct)
    buttons[good].classList.add('reveal')
    const why = h('div', 'why')
    why.append(h('h3', '', 'How it works'))
    const p = q.p
    if (p.hint?.latex) why.append(tex(p.hint.latex))
    if (p.hint?.text) why.append(h('p', '', p.hint.text))
    const shown = T2.answerDisplay(p)
    if (!p.options && shown) {
      why.append(h('p', '', 'Worked answer:'))
      why.append(tex(shown))
    } else why.append(h('p', '', `The right bubble is ${'ABCDEFGH'[good]}.`))
    if (p.clue) sheet.querySelector('.story')?.replaceWith(storyEl({ text: p.text, clue: p.clue }, true))
    if (p.trap) why.append(h('p', 'trap', 'The trap: ' + p.trap))
    if (p.leaf) why.append(leafCard(p.leaf))
    const { acts, cont } = gotIt(q)
    why.append(acts)
    sheet.append(why)
    cont.focus({ preventScroll: true })
    why.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
  }

  // a button that plays the tree's path to one distribution, right where it is
  function walkButton(leaf) {
    const b = h('button', 'btn ghost tw-open', 'Walk the tree to the answer')
    b.type = 'button'
    b.addEventListener('click', () => b.replaceWith(treeWalk({ leaf })))
    return b
  }

  function showPlug(p, sheet) {
    const next = h('button', 'btn', 'Next')
    next.type = 'button'
    next.addEventListener('click', advance)
    const panel = plugPanel(p, { sheet, auto: true, next })
    sheet.append(panel)
    next.focus({ preventScroll: true })
    panel.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
  }

  // ---------- World 0: pick from every distribution ----------
  // All ten, in the tree's order (counting, then measuring), so where a name sits
  // gives nothing away. Picking one shows its formula; Check grades it.
  const PICK_ORDER = ['binomial', 'geometric', 'negbin', 'hyper', 'poisson', 'uniform', 'exponential', 'gamma', 'chi', 'normal']
  function pickQuestion(p, sheet) {
    const wrap = h('div', 'pick')
    const box = h('div', 'pick-box')
    const toggle = h('button', 'pick-toggle')
    toggle.type = 'button'
    toggle.setAttribute('aria-haspopup', 'listbox')
    toggle.setAttribute('aria-expanded', 'false')
    const shown = h('span', 'pick-shown', 'Choose a distribution…')
    toggle.append(shown, h('span', 'pick-caret', '▾'))
    // the list: every distribution with its formula, grouped like the tree
    const list = h('div', 'pick-list')
    list.setAttribute('role', 'listbox')
    list.setAttribute('aria-label', 'Distributions')
    list.hidden = true
    const rows = []
    PICK_ORDER.forEach((k, i) => {
      if (i === 0) list.append(h('div', 'pick-group', 'Counting · whole numbers (Ch 3)'))
      if (k === 'uniform') list.append(h('div', 'pick-group', 'Measuring · any decimal (Ch 4)'))
      const L = LEAVES[k]
      const row = h('button', 'pick-opt')
      row.type = 'button'
      row.setAttribute('role', 'option')
      row.setAttribute('aria-selected', 'false')
      row.dataset.k = k
      const name = h('span', 'pick-name', L.name)
      name.append(h('small', '', L.sec))
      row.append(name, tex(L.tex, false))
      row.addEventListener('click', () => choose(k))
      list.append(row)
      rows.push(row)
    })
    box.append(toggle, list)
    const check = h('button', 'btn', 'Check')
    check.type = 'button'
    check.disabled = true
    let chosen = null
    const away = e => {
      if (!box.contains(e.target)) open(false)
    }
    function open(on) {
      list.hidden = !on
      toggle.setAttribute('aria-expanded', String(on))
      if (on) {
        document.addEventListener('pointerdown', away, true)
        const at = rows.find(r => r.dataset.k === chosen) ?? rows[0]
        at.focus({ preventScroll: true })
        box.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' })
      } else document.removeEventListener('pointerdown', away, true)
    }
    function choose(k) {
      chosen = k
      const L = LEAVES[k]
      shown.replaceChildren(h('b', 'choice-name', L.name), tex(L.tex, false))
      rows.forEach(r => r.setAttribute('aria-selected', String(r.dataset.k === k)))
      check.disabled = false
      open(false)
      check.focus({ preventScroll: true })
    }
    toggle.addEventListener('click', () => open(list.hidden))
    list.addEventListener('keydown', e => {
      const i = rows.indexOf(document.activeElement)
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault()
        rows[Math.min(rows.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)))].focus()
      } else if (e.key === 'Escape') {
        open(false)
        toggle.focus()
      }
    })
    check.addEventListener('click', () => answerPick(chosen, p, sheet, { sel: toggle, check, wrap }))
    wrap.append(h('div', 'pick-label', 'Your answer'), box, check)
    sheet.append(wrap)
  }
  function answerPick(pick, p, sheet, { sel, check, wrap }) {
    if (round.locked || !LEAVES[pick]) return
    round.locked = true
    sel.disabled = true
    check.disabled = true
    const q = round.queue[round.at]
    if (pick === p.leaf) {
      wrap.classList.add('right')
      award(10, check)
      showPlug(p, sheet)
      return
    }
    miss(q)
    wrap.classList.add('wrong')
    const why = h('div', 'why')
    why.append(h('h3', '', 'How it works'))
    why.append(h('p', '', `You picked ${LEAVES[pick].name}. The answer is ${LEAVES[p.leaf].name}.`))
    if (p.hint?.text) why.append(h('p', '', p.hint.text))
    if (p.clue) sheet.querySelector('.story')?.replaceWith(storyEl({ text: p.text, clue: p.clue }, true))
    if (p.trap) why.append(h('p', 'trap', 'The trap: ' + p.trap))
    why.append(leafCard(p.leaf))
    why.append(walkButton(p.leaf))
    const { acts, cont } = gotIt(q)
    why.append(acts)
    sheet.append(why)
    cont.focus({ preventScroll: true })
    why.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
  }

  // ---------- written answers: paper mode and the boss ----------
  const typeable = p => !p.options
  // the right answer and how to get it
  function solution(p) {
    if (p.leaf) {
      const box = h('div', 'reveal-box')
      box.append(h('h3', '', 'Answer'), leafCard(p.leaf), h('h3', '', 'How the tree gets there'), h('p', '', p.hint.text), walkButton(p.leaf))
      if (p.vars) box.append(plugPanel(p))
      return box
    }
    const box = h('div', 'reveal-box')
    box.append(h('h3', '', 'Answer'))
    if (p.options) {
      const o = p.options['abcdefgh'.indexOf(p.answer)]
      box.append(typeof o === 'string' ? h('p', '', o) : tex(o.latex))
    } else box.append(tex(T2.answerDisplay(p)))
    if (p.hint?.latex || p.hint?.text) {
      box.append(h('h3', '', 'How it works'))
      if (p.hint.latex) box.append(tex(p.hint.latex))
      if (p.hint.text) box.append(h('p', '', p.hint.text))
    }
    return box
  }
  // a typed answer (formulas preview as you type), or a note to answer on paper
  // when the question only makes sense with its options
  function answerBox(p, onEnter) {
    const wrap = h('div', 'written')
    if (!typeable(p)) {
      wrap.append(h('p', 'paper-note', 'Write your answer on paper (the real test has no choices), then check it.'))
      return { el: wrap, input: null, value: () => '' }
    }
    const id = 'answer-' + Math.random().toString(36).slice(2, 8)
    const label = h('label', '', 'Your final answer (work it on paper first)')
    label.htmlFor = id
    const input = h('input', 'answer-input')
    input.id = id
    input.autocomplete = 'off'
    input.setAttribute('autocapitalize', 'none')
    input.spellcheck = false
    input.placeholder = p.placeholder ?? 'answer'
    input.enterKeyHint = 'go'
    wrap.append(label, input)
    if (p.expr) {
      const letters = p.expr.vars.join(', ')
      const hintText = `a formula in ${letters}: use ^ for powers, e^(...), C(n,k)`
      const preview = h('div', 'preview')
      let timer
      input.addEventListener('input', () => {
        clearTimeout(timer)
        timer = setTimeout(() => {
          const raw = input.value.trim()
          const l = raw ? T2.toLatex(raw, p.expr.vars) : null
          preview.replaceChildren(l ? tex(l, false) : document.createTextNode(raw ? `that doesn't read as a formula in ${letters} yet` : hintText))
        }, 200)
      })
      preview.textContent = hintText
      wrap.append(preview)
    }
    if (!p.expr && typeof p.answer === 'string' && p.choices?.length) {
      wrap.append(h('p', 'paper-note', 'Answer with one of: ' + [p.answer, ...p.choices].sort().join(', ')))
    }
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault()
        onEnter?.()
      }
    })
    return { el: wrap, input, value: () => input.value.trim() }
  }

  function paperQuestion(p, sheet) {
    const q = round.queue[round.at]
    const acts = h('div', 'row-actions')
    const box = answerBox(p, () => check.click())
    const check = h('button', 'btn', 'Check')
    check.type = 'button'
    const show = h('button', 'btn ghost', typeable(p) ? 'Show answer' : 'Check my answer')
    show.type = 'button'
    const settle = (right, revealed) => {
      if (round.locked) return
      round.locked = true
      acts.remove()
      if (box.input) box.input.disabled = true
      if (right) {
        sheet.append(h('div', 'verdict ok', revealed ? 'Counted. Nice.' : 'Correct!'))
        award(20, sheet.querySelector('.verdict.ok'))
        setTimeout(advance, revealed ? 600 : 1100)
        return
      }
      miss(q)
      sheet.append(h('div', 'verdict bad', revealed ? 'No problem: that is what practice is for.' : 'Not quite.'))
      if (!revealed) sheet.append(solution(p))
      const { acts: next, cont } = gotIt(q)
      sheet.append(next)
      cont.focus({ preventScroll: true })
      next.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' })
    }
    check.addEventListener('click', () => {
      const raw = box.value()
      if (!raw) return box.input?.focus()
      settle(checkTyped(raw, p), false)
    })
    show.addEventListener('click', () => {
      // look at the answer, then be honest about it
      acts.replaceChildren()
      sheet.insertBefore(solution(p), acts)
      const yes = h('button', 'btn', 'I had it')
      yes.type = 'button'
      yes.addEventListener('click', () => settle(true, true))
      const no = h('button', 'btn ghost', "I didn't")
      no.type = 'button'
      no.addEventListener('click', () => settle(false, true))
      acts.append(yes, no)
    })
    if (typeable(p)) acts.append(check)
    acts.append(show)
    sheet.append(box.el, acts)
    view.append(sheet)
    window.scrollTo({ top: 0 })
    box.input?.focus({ preventScroll: true })
  }

  function advance() {
    if (!round || screen !== 'question') return
    round.locked = false
    round.at++
    if (round.at >= round.queue.length) finish()
    else showQuestion()
  }

  function finish() {
    screen = 'results'
    const r = round
    const stars = r.misses === 0 ? 3 : r.misses <= 2 ? 2 : 1
    const before = level(state.xp)
    const bonus = 25 * stars
    state.xp += bonus
    const prev = state.stars[r.short] || 0
    state.stars[r.short] = Math.max(prev, stars)
    state.plays[r.short] = (state.plays[r.short] || 0) + 1
    petFeed({ full: 6 * stars, happy: 5 * stars, growth: 3 * stars })
    markDay()
    save()
    hud()

    view.replaceChildren()
    const sheet = h('section', 'sheet')
    sheet.append(h('div', 'eyebrow', r.paper ? 'Level cleared · paper mode' : 'Level cleared'))
    sheet.append(h('h2', '', r.short))
    const st = h('div', 'result-stars')
    for (let i = 0; i < 3; i++) {
      const s = h('span', i < stars ? '' : 'off', '★')
      s.style.animationDelay = i * 0.25 + 's'
      st.append(s)
    }
    sheet.append(st)
    const tally = h('div', 'tally')
    const cell = (label, value) => {
      const c = h('div')
      c.append(h('b', '', value), document.createTextNode(label))
      return c
    }
    tally.append(cell('XP this round', '+' + (r.gained + bonus)), cell('best streak', String(r.best)), cell('first-try misses', String(r.misses)))
    sheet.append(tally)
    const msg = stars === 3 ? 'Clean sheet. Every bubble right the first time.' : stars === 2 ? 'Solid. One clean run gets the third star.' : 'Cleared. Run it again: the questions change every time.'
    sheet.append(h('p', 'note', msg + (stars > prev && prev ? ' New best!' : '')))
    const acts = h('div', 'row-actions')
    const i = ORDER.indexOf(r.short)
    const nextShort = ORDER[(i + 1) % ORDER.length]
    const again = h('button', stars < 3 ? 'btn' : 'btn ghost', 'Run it again')
    again.type = 'button'
    again.addEventListener('click', () => startRound(r.short))
    const nxt = h('button', stars < 3 ? 'btn ghost' : 'btn', 'Next level')
    nxt.type = 'button'
    nxt.addEventListener('click', () => openCard(nextShort))
    const map = h('button', 'btn ghost', 'Map')
    map.type = 'button'
    map.addEventListener('click', renderMap)
    acts.append(again, nxt, map)
    sheet.append(acts)
    view.append(sheet)
    window.scrollTo({ top: 0 })
    setTimeout(() => {
      sfx.clear()
      burst(stars === 3 ? 160 : 90)
      if (level(state.xp) > before) setTimeout(() => { toast(`Level ${level(state.xp)}!`); sfx.levelUp() }, 700)
    }, 150)
    round = null
  }

  function markDay() {
    const d = today()
    if (state.lastDay === d) return
    const y = new Date(Date.now() - 864e5).toLocaleDateString('en-CA')
    state.days = state.lastDay === y ? state.days + 1 : 1
    state.lastDay = d
  }

  // ---------- the final boss: one written question per level, graded after hand-in ----------
  let boss = null
  let clockTimer = null
  const mmss = ms => {
    const s = Math.floor(ms / 1000)
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
  }
  function stopClock() {
    clearInterval(clockTimer)
    clockTimer = null
  }

  async function startBoss() {
    view.replaceChildren(h('p', 'loading', 'Summoning the boss…'))
    await mathBoot
    const pick = T2.createFreshPicker()
    const items = BOSS_ORDER.map(short => {
      if (isTree(short)) return { short, p: treeProblem(undefined, short === TREE_LEVEL2), raw: '', paper: false, result: null }
      const topics = T2.guideTopics(unit, lineByShort[short])
      // a question that can be answered without its options, when the level has one
      let p
      for (let k = 0; k < 12; k++) {
        p = pick(topics[Math.floor(Math.random() * topics.length)])
        if (typeable(p)) break
      }
      return { short, p, raw: '', paper: false, result: null }
    })
    boss = { items, at: 0, start: Date.now(), end: null }
    stopClock()
    clockTimer = setInterval(() => {
      const el = document.getElementById('boss-clock')
      if (el && boss && !boss.end) el.textContent = mmss(Date.now() - boss.start)
    }, 1000)
    showBoss()
  }

  const bossDone = it => Boolean(it.raw || it.paper)
  function showBoss(confirming = false) {
    screen = 'boss'
    const it = boss.items[boss.at]
    const p = it.p
    view.replaceChildren()
    const sheet = h('section', 'sheet')
    const top = h('div', 'qtop')
    const nav = h('nav', 'boss-nav')
    nav.setAttribute('aria-label', 'questions')
    boss.items.forEach((x, i) => {
      const b = h('button', (bossDone(x) ? 'done' : '') + (i === boss.at ? ' here' : ''), String(i + 1))
      b.type = 'button'
      b.setAttribute('aria-label', `question ${i + 1}: ${x.short}`)
      b.addEventListener('click', () => { boss.at = i; showBoss() })
      nav.append(b)
    })
    const clock = h('div', 'clock', mmss(Date.now() - boss.start))
    clock.id = 'boss-clock'
    top.append(nav, clock)
    sheet.append(top, h('div', 'eyebrow', `Final boss · ${boss.at + 1} of ${boss.items.length} · ${it.short}`))
    if (p.ask) sheet.append(h('p', 'ask', p.ask))
    if (p.text) sheet.append(h('p', 'story', p.text))
    sheet.append(tex(p.latex))
    const last = boss.at === boss.items.length - 1
    const box = answerBox(p, () => (last ? showBoss(true) : go(1)))
    if (box.input) {
      box.input.value = it.raw
      box.input.addEventListener('input', () => {
        it.raw = box.input.value.trim()
        nav.children[boss.at].classList.toggle('done', bossDone(it))
      })
    }
    sheet.append(box.el)
    const onPaper = h('button', 'tool toggle', 'Done on paper')
    onPaper.type = 'button'
    onPaper.setAttribute('aria-pressed', String(it.paper))
    onPaper.addEventListener('click', () => {
      it.paper = !it.paper
      onPaper.setAttribute('aria-pressed', String(it.paper))
      nav.children[boss.at].classList.toggle('done', bossDone(it))
    })
    const mark = h('div', 'row-actions')
    mark.append(onPaper)
    sheet.append(mark)

    const go = d => { boss.at += d; showBoss() }
    const acts = h('div', 'row-actions')
    if (boss.at > 0) {
      const back = h('button', 'btn ghost', 'Back')
      back.type = 'button'
      back.addEventListener('click', () => go(-1))
      acts.append(back)
    }
    if (!last) {
      const next = h('button', 'btn', 'Next')
      next.type = 'button'
      next.addEventListener('click', () => go(1))
      acts.append(next)
    }
    if (confirming) {
      const left = boss.items.filter(x => !bossDone(x)).length
      acts.append(h('span', 'paper-note', `${left ? `${left} not done yet. ` : ''}Hand it in?`))
      const yes = h('button', 'btn', 'Hand it in')
      yes.type = 'button'
      yes.addEventListener('click', handIn)
      const no = h('button', 'btn ghost', 'Keep working')
      no.type = 'button'
      no.addEventListener('click', () => showBoss())
      acts.append(yes, no)
    } else {
      const hand = h('button', last ? 'btn' : 'btn ghost', 'Hand in')
      hand.type = 'button'
      hand.addEventListener('click', () => showBoss(true))
      acts.append(hand)
    }
    sheet.append(acts)
    view.append(sheet)
    window.scrollTo({ top: 0 })
    box.input?.focus({ preventScroll: true })
  }

  function handIn() {
    boss.end = Date.now()
    stopClock()
    for (const it of boss.items) {
      if (it.raw && typeable(it.p)) it.result = checkTyped(it.raw, it.p) ? 'ok' : 'bad'
    }
    renderReview()
  }

  function renderReview() {
    screen = 'boss-review'
    view.replaceChildren()
    const sheet = h('section', 'sheet')
    sheet.append(h('div', 'eyebrow', `Final boss · handed in after ${mmss(boss.end - boss.start)}`))
    sheet.append(h('h2', '', 'Check your work'))
    sheet.append(h('p', 'paper-note', 'Typed answers are graded for you. For the rest, compare with your paper and be honest.'))
    const score = h('p', 'score-line')
    const finishBtn = h('button', 'btn', 'See my score')
    finishBtn.type = 'button'
    finishBtn.addEventListener('click', bossResults)
    const update = () => {
      const ok = boss.items.filter(x => x.result === 'ok').length
      const left = boss.items.filter(x => !x.result).length
      score.textContent = left ? `${ok} right so far · ${left} left to mark` : `${ok} / ${boss.items.length} right · all marked`
      finishBtn.disabled = left > 0
    }
    sheet.append(score)
    boss.items.forEach((it, i) => {
      const row = h('article', 'review-item')
      const head = h('h4', '', `${i + 1}. ${it.short}`)
      const badge = h('span', 'mark')
      const paint = () => {
        badge.className = 'mark ' + (it.result === 'ok' ? 'ok' : it.result === 'bad' ? 'bad' : 'todo')
        badge.textContent = it.result === 'ok' ? 'right' : it.result === 'bad' ? 'missed' : 'to mark'
      }
      paint()
      head.append(badge)
      row.append(head)
      if (it.p.ask) row.append(h('p', 'ask', it.p.ask))
      if (it.p.text) row.append(h('p', 'story', it.p.text))
      row.append(tex(it.p.latex))
      if (it.raw) row.append(h('p', 'wrote', 'You typed: ' + it.raw))
      row.append(solution(it.p))
      if (!it.result) {
        const acts = h('div', 'row-actions')
        const yes = h('button', 'btn', 'I had it')
        yes.type = 'button'
        const no = h('button', 'btn ghost', "I didn't")
        no.type = 'button'
        const decide = r => {
          it.result = r
          acts.remove()
          paint()
          update()
        }
        yes.addEventListener('click', () => decide('ok'))
        no.addEventListener('click', () => decide('bad'))
        acts.append(yes, no)
        row.append(acts)
      }
      sheet.append(row)
    })
    const end = h('div', 'row-actions')
    end.append(finishBtn)
    sheet.append(end)
    update()
    view.append(sheet)
    window.scrollTo({ top: 0 })
  }

  function bossResults() {
    screen = 'boss-results'
    const n = boss.items.length
    const ok = boss.items.filter(x => x.result === 'ok').length
    const r = ok / n
    const before = level(state.xp)
    const gain = 15 * ok + (r >= 0.9 ? 150 : r >= 0.7 ? 75 : 0)
    state.xp += gain
    state.boss = { best: Math.max(state.boss?.best ?? 0, ok), runs: (state.boss?.runs ?? 0) + 1, last: ok }
    petFeed({ full: 30, happy: r >= 0.7 ? 30 : 10, growth: ok })
    markDay()
    save()
    hud()
    view.replaceChildren()
    const sheet = h('section', 'sheet')
    sheet.append(h('div', 'eyebrow', 'Final boss'))
    sheet.append(h('h2', '', `${ok} / ${n} · ${grade(r)}`))
    const tally = h('div', 'tally')
    const cell = (label, value) => {
      const c = h('div')
      c.append(h('b', '', value), document.createTextNode(label))

    const top = Array.from({ length: small }, (_, i) => n - i)
    const line = { order: [], label: `How to get C(${n}, ${k})`, tex: () => `\\binom{${n}}{${k}} = \\frac{${n}!}{${k}!\\,${n - k}!}` }
    if (small === 0) return { ...line, steps: () => ['= 1'], tail: () => '\\quad (0! = 1)' }
    const cancel = `\\frac{${top.join(' \\cdot ')} \\cdot \\cancel{${big}!}}{${small}! \\cdot \\cancel{${big}!}}`
    if (small === 1) return { ...line, steps: () => [`= ${cancel}`, `= ${n}`] }
    if (small > 6) return { ...line, steps: () => [`= \\frac{${n} \\cdot ${n - 1} \\cdots ${big + 1}}{${small}!}`, `= ${num(C)}`], tail: () => '\\quad \\text{(nCr on a calculator)}' }
    const bottom = Array.from({ length: small }, (_, i) => small - i)
    return { ...line, steps: () => [`= ${cancel}`, `= \\frac{${top.join(' \\cdot ')}}{${bottom.join(' \\cdot ')}}`, `= \\frac{${num(prod(big + 1, n))}}{${num(fact(small))}}`, `= ${num(C)}`] }
