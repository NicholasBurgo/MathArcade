<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body { margin: 0; } [hidden] { display: none !important; } img { max-width: 100%; }</style>
<title>Math 3800 Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  --paper: #edf4ea;
  --sheet: #f8fbf6;
  --ink: #17241c;
  --muted: #5a6a5f;
  --rule: #2e7d4f;
  --rule-soft: #cfe3d3;
  --graphite: #343b36;
  --on-graphite: #f8fbf6;
  --gold: #c98407;
  --gold-soft: #fbe7bc;
  --red: #c8392f;
  --red-soft: #f7dad6;
  --green: #1d8a4b;
  --green-soft: #d3eedb;
  --shadow: 0 1px 0 rgba(23, 36, 28, 0.06), 0 8px 24px -12px rgba(23, 36, 28, 0.25);
  --display: 'Big Shoulders Display', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0f1612;
    --sheet: #17211b;
    --ink: #e4eee6;
    --muted: #93a598;
    --rule: #63c28a;
    --rule-soft: #26392c;
    --graphite: #dce5de;
    --on-graphite: #17211b;
    --gold: #f0b43a;
    --gold-soft: #3b2f12;
    --red: #ff7d71;
    --red-soft: #3d1f1b;
    --green: #5fd394;
    --green-soft: #173523;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 28px -14px rgba(0, 0, 0, 0.7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0f1612;
  --sheet: #17211b;
  --ink: #e4eee6;
  --muted: #93a598;
  --rule: #63c28a;
  --rule-soft: #26392c;
  --graphite: #dce5de;
  --on-graphite: #17211b;
  --gold: #f0b43a;
  --gold-soft: #3b2f12;
  --red: #ff7d71;
  --red-soft: #3d1f1b;
  --green: #5fd394;
  --green-soft: #173523;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 28px -14px rgba(0, 0, 0, 0.7);
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  /* faint scantron rule lines */
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule-soft) 31px 32px);
}
button { font: inherit; color: inherit; }
/* nothing here is meant to be selected: the S Pen side button drags would highlight text */
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--rule); outline-offset: 2px; }

.app { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 64px; }

/* ---------- heads-up bar ---------- */
.hud {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  padding: 10px 0;
  background: var(--paper);
  border-bottom: 2px solid var(--rule);
}
.wordmark {
  font-family: var(--display);
  font-weight: 800;
  font-size: 1.35rem;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--rule);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  margin-right: auto;
}
.stat { display: flex; align-items: baseline; gap: 6px; font-family: var(--mono); font-size: 0.85rem; color: var(--muted); }
.stat b { font-family: var(--display); font-size: 1.35rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 6px; }
.tool {
  border: 1.5px solid var(--rule);
  background: var(--sheet);
  color: var(--rule);
  border-radius: 999px;
  padding: 4px 11px;
  font-family: var(--mono);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
}
.tool[aria-pressed="true"] { background: var(--rule); color: var(--sheet); }

/* ---------- map ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; margin: 22px 0 8px; }
.hero h1 {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(2rem, 7vw, 3.1rem);
  line-height: 0.95;
  text-transform: uppercase;
  margin: 0 0 8px;
  text-wrap: balance;
}
.hero p { margin: 0; color: var(--muted); max-width: 46ch; }
.bell { width: 190px; max-width: 42vw; }
.bell svg { width: 100%; height: auto; display: block; }
.bell figcaption { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); text-align: center; margin-top: 2px; }
.bell figcaption b { color: var(--ink); font-family: var(--display); font-size: 1.6rem; display: block; line-height: 1; }
.cta {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; margin: 14px 0 6px; padding: 14px 18px;
  border: 0; border-radius: 14px; cursor: pointer; text-align: left;
  background: var(--rule); color: var(--sheet);
  box-shadow: var(--shadow);
}
.cta small { display: block; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
.cta strong { font-family: var(--display); font-size: 1.5rem; font-weight: 800; text-transform: uppercase; line-height: 1.05; }
.cta .go { font-family: var(--display); font-size: 2rem; }

.world { margin-top: 26px; }
.world-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; border-bottom: 1.5px solid var(--rule); padding-bottom: 4px; margin-bottom: 10px; }
.world-head h2 { font-family: var(--display); font-weight: 800; font-size: 1.5rem; text-transform: uppercase; margin: 0; color: var(--rule); letter-spacing: 0.02em; }
.world-head span { font-size: 0.9rem; color: var(--muted); }
.world-head em { font-style: normal; margin-left: auto; font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.level {
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 10px;
  padding: 10px 12px; text-align: left; cursor: pointer;
  background: var(--sheet); border: 1.5px solid var(--rule-soft); border-radius: 12px;
}
.level:hover { border-color: var(--rule); }
.level .oval {
  grid-row: span 2;
  width: 30px; height: 40px; border-radius: 50%;
  border: 2px solid var(--rule);
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 0.8rem; font-weight: 600; color: var(--rule);
}
.level.cleared .oval { background: var(--graphite); border-color: var(--graphite); color: var(--on-graphite); }
.level .name { font-weight: 700; line-height: 1.25; }
.level .stars { font-family: var(--mono); font-size: 0.85rem; color: var(--gold); letter-spacing: 0.15em; }
.level .stars .off { color: var(--rule-soft); }
.level.next { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
.level.next .oval { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.boss {
  display: grid; gap: 4px; width: 100%; margin-top: 26px; padding: 16px 18px; text-align: left; cursor: pointer;
  background: var(--sheet); border: 2px dashed var(--gold); border-radius: 14px; color: var(--muted);
}
.boss:hover { border-style: solid; }
.boss .boss-title { font-family: var(--display); font-weight: 800; font-size: 1.6rem; text-transform: uppercase; color: var(--gold); line-height: 1; }
.boss b { color: var(--ink); }

/* ---------- written answers: paper mode and the boss ---------- */
.written { display: grid; gap: 6px; margin-top: 14px; }
.written label { font-family: var(--mono); font-size: 0.74rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--rule); }
.answer-input {
  width: 100%; padding: 11px 13px; font: inherit; font-size: 1.1rem;
  color: var(--ink); background: var(--paper);
  border: 1.5px solid var(--rule-soft); border-radius: 10px;
}
.answer-input:focus { outline: 3px solid var(--rule); outline-offset: 1px; border-color: var(--rule); }
.preview { min-height: 1.6em; color: var(--muted); font-size: 0.95rem; overflow-x: auto; }
.paper-note { margin: 0; color: var(--muted); font-size: 0.95rem; }
.verdict { margin-top: 12px; padding: 9px 13px; border-radius: 10px; font-weight: 700; }
.verdict.ok { background: var(--green-soft); color: var(--green); }
.verdict.bad { background: var(--red-soft); color: var(--red); }
.reveal-box { margin-top: 12px; padding: 12px 14px; border-left: 4px solid var(--rule); background: var(--paper); border-radius: 0 10px 10px 0; }
.reveal-box h3 { margin: 6px 0 2px; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rule); }
.reveal-box h3:first-child { margin-top: 0; }
.reveal-box p { margin: 4px 0; }
.mode { display: block; font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.06em; opacity: 0.85; }
.boss-nav { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
.boss-nav button {
  width: 30px; height: 36px; padding: 0; border-radius: 50%; cursor: pointer;
  border: 2px solid var(--rule-soft); background: var(--sheet); color: var(--muted);
  font-family: var(--mono); font-size: 0.7rem; font-weight: 600;
}
.boss-nav button.done { background: var(--graphite); border-color: var(--graphite); color: var(--on-graphite); }
.boss-nav button.here { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
.clock { font-family: var(--display); font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); }
.toggle[aria-pressed="true"] { background: var(--graphite); border-color: var(--graphite); color: var(--on-graphite); }
.review-item { padding: 16px 0; border-top: 1.5px dashed var(--rule-soft); }
.review-item h4 { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--rule); }
.review-item h4 .mark { margin-left: auto; padding: 2px 9px; border-radius: 999px; font-size: 0.72rem; }
.mark.ok { background: var(--green-soft); color: var(--green); }
.mark.bad { background: var(--red-soft); color: var(--red); }
.mark.todo { background: var(--gold-soft); color: var(--gold); }
.wrote { font-family: var(--mono); font-size: 0.9rem; margin: 6px 0; }
.score-line { position: sticky; top: 64px; z-index: 2; margin: 0 0 8px; padding: 8px 12px; border-radius: 10px; background: var(--gold-soft); color: var(--ink); font-weight: 700; }
.redo { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* ---------- the tree: outline, story clues, distribution cards ---------- */
.outline ul { list-style: none; margin: 0 0 0 8px; padding: 0; }
.outline ul li { position: relative; padding: 4px 0 4px 22px; }
.outline ul li::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1.5px solid var(--rule-soft); }
.outline ul li:last-child::before { bottom: auto; height: 16px; }
.outline ul li::after { content: ''; position: absolute; left: 0; top: 16px; width: 14px; border-top: 1.5px solid var(--rule-soft); }
.oq { display: inline-block; margin: 3px 0; padding: 2px 10px; border: 1.5px solid var(--rule); border-radius: 8px; font-weight: 700; color: var(--rule); }
.oa { display: block; font-size: 0.95rem; color: var(--muted); }
.oa b { color: var(--ink); }
.oleaf { display: inline-block; margin-top: 3px; padding: 4px 10px; background: var(--paper); border-left: 3px solid var(--gold); font-size: 0.92rem; }
.oleaf b { font-family: var(--display); font-size: 1.15rem; text-transform: uppercase; letter-spacing: 0.02em; }
.clue { background: var(--gold-soft); color: var(--ink); border-bottom: 2px solid var(--gold); padding: 0 2px; }
.leafcard { margin-top: 12px; padding: 12px 14px; border-left: 4px solid var(--gold); background: var(--paper); border-radius: 0 10px 10px 0; }
.leafcard h3 { margin: 0 0 4px; font-family: var(--display); font-size: 1.7rem; text-transform: uppercase; line-height: 1; }
.leafcard h3 small { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); margin-left: 8px; }
.leafcard p { margin: 3px 0; }
.why .leafcard h3, .reveal-box .leafcard h3 { margin: 0 0 4px; font-family: var(--display); font-size: 1.7rem; letter-spacing: 0; text-transform: uppercase; color: var(--ink); line-height: 1; }
.leafcard p span { display: inline-block; min-width: 76px; color: var(--muted); font-family: var(--mono); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; }

/* ---------- the sheet (card, question, results) ---------- */
.sheet {
  position: relative;
  margin-top: 18px;
  background: var(--sheet);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 20px 20px 22px 38px;
  overflow: hidden;
}
/* scantron timing marks down the left edge */
.sheet::before {
  content: '';
  position: absolute; left: 12px; top: 18px; bottom: 18px; width: 10px;
  background: repeating-linear-gradient(to bottom, var(--graphite) 0 6px, transparent 6px 22px);
  opacity: 0.85;
}
.eyebrow { font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rule); font-weight: 600; }
.sheet h2 { font-family: var(--display); font-weight: 800; font-size: clamp(1.7rem, 5.5vw, 2.3rem); text-transform: uppercase; line-height: 1; margin: 6px 0 14px; text-wrap: balance; }
.points { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.points li { padding-left: 26px; position: relative; max-width: 62ch; }
.points li::before { content: ''; position: absolute; left: 0; top: 0.3em; width: 12px; height: 16px; border-radius: 50%; border: 2px solid var(--rule); }
.row-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.btn {
  border: 0; border-radius: 12px; padding: 12px 20px; cursor: pointer;
  background: var(--rule); color: var(--sheet);
  font-family: var(--display); font-weight: 800; font-size: 1.25rem; text-transform: uppercase; letter-spacing: 0.03em;
}
.btn.ghost { background: transparent; color: var(--rule); border: 2px solid var(--rule); }

.qtop { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.progress { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; min-width: 0; }
.progress i { width: 14px; height: 18px; border-radius: 50%; border: 2px solid var(--rule-soft); }
.progress i.ok { background: var(--graphite); border-color: var(--graphite); }
.progress i.bad { background: var(--red); border-color: var(--red); }
.progress i.now { border-color: var(--rule); }

.ask { margin: 14px 0 4px; font-weight: 700; }
.story { margin: 4px 0; max-width: 64ch; }
.math-d { overflow-x: auto; overflow-y: hidden; padding: 6px 0; text-align: center; }
.math-d mjx-container { margin: 0 !important; }
.math-d mjx-container svg { max-width: none; }
.pick { display: grid; gap: 10px; margin-top: 14px; max-width: 640px; justify-items: start; }
.pick-label { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pick-box { position: relative; width: 100%; }
.pick-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 58px; padding: 10px 14px; border: 2px solid var(--rule); border-radius: 10px; background: var(--sheet); color: var(--ink); font: inherit; font-size: 1.05rem; text-align: left; cursor: pointer; }
.pick-toggle:disabled { cursor: default; }
.pick-shown { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; overflow-x: auto; overflow-y: hidden; }
.pick-caret { color: var(--rule); font-size: 1.2rem; }
/* opens in place (the card would clip a floating list) */
.pick-list { margin-top: 6px; padding: 6px; border: 2px solid var(--rule); border-radius: 10px; background: var(--sheet); box-shadow: var(--shadow); }
.pick-group { padding: 10px 10px 4px; font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pick-opt { display: grid; grid-template-columns: minmax(140px, 32%) 1fr; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.pick-opt .math-i { overflow-x: auto; overflow-y: hidden; }
.pick-opt:hover, .pick-opt:focus-visible { background: var(--rule-soft); outline: none; }
.pick-opt[aria-selected="true"] { background: var(--green-soft); box-shadow: inset 0 0 0 2px var(--green); }
.pick-name { font-weight: 700; }
.pick-name small { display: block; font-family: var(--mono); font-size: 0.72rem; font-weight: 500; color: var(--muted); }
@media (max-width: 520px) { .pick-opt { grid-template-columns: 1fr; gap: 2px; } }
.pick.right .pick-toggle { border-color: var(--green); background: var(--green-soft); }
.pick.wrong .pick-toggle { border-color: var(--red); background: var(--red-soft); animation: shake 0.35s; }
.pick.answers { max-width: 760px; }
.pick.answers .pick-opt { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 1.05rem; }
.pick-text { line-height: 1.4; }
.pick-said { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.pick-said .math-i { overflow-x: auto; overflow-y: hidden; }
.twalk { margin-top: 10px; }
.twalk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 6px 0 10px; }
.twalk-hint { color: var(--muted); font-size: 0.9rem; }
.lineage-scroll { padding: 8px; border: 1px solid var(--rule-soft); border-radius: 12px; background: var(--paper); }
.lineage { display: block; width: 100%; height: auto; margin: 0 auto; font-family: var(--body); }
.sheet.wide { --w: min(900px, calc(100vw - 32px)); width: var(--w); margin-inline: calc((100% - var(--w)) / 2); }
.lineage .lt-line { fill: none; stroke: var(--rule-soft); stroke-width: 2; }
.lineage .lt-glow { fill: none; stroke: var(--gold); stroke-width: 3.5; stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0; }
.lineage .lt-glow.on { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset 0.7s ease-out; }
.lineage .lt-dot { fill: var(--gold); filter: drop-shadow(0 0 4px var(--gold)); }
.lineage .lt-node rect { fill: var(--sheet); stroke: var(--rule-soft); stroke-width: 1.5; transition: fill 0.35s, stroke 0.35s; }
.lineage .lt-node.root rect { stroke: var(--rule); stroke-width: 2; }
.lineage .lt-node.leaf rect { stroke: var(--gold); }
.lineage .lt-node.leaf { cursor: pointer; }
.lineage .lt-node.leaf:hover rect, .lineage .lt-node.leaf:focus-visible rect { fill: var(--gold-soft); }
.lineage .lt-node { transition: opacity 0.35s; outline: none; }
.lineage .lt-head { fill: var(--muted); font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; }
.lineage .lt-label { fill: var(--ink); font-size: 12.5px; transition: opacity 0.35s, fill 0.35s; }
.lineage .lt-label.big { font-weight: 700; font-size: 13.5px; }
.lineage.walking .lt-label { opacity: 0.35; }
.lineage .lt-label.lit { opacity: 1; fill: var(--gold); font-weight: 700; }
.lineage .lt-label.nope { opacity: 0.12; }
.lineage .lt-q { fill: var(--ink); font-size: 13.5px; font-weight: 700; }
.lineage .lt-name { fill: var(--ink); font-family: var(--display); font-size: 17px; font-weight: 800; }
.lineage .lt-sec { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.lineage.walking .lt-node { opacity: 0.35; }
.lineage.walking .lt-node.lit { opacity: 1; }
.lineage .lt-node.nope { opacity: 0.12 !important; }
.lineage .lt-node.lit rect { fill: var(--green-soft); stroke: var(--green); stroke-width: 2.5; }
.lineage .lt-node.leaf.lit rect { fill: var(--gold); stroke: var(--gold); }
.lineage .lt-node.leaf.lit text { fill: #17241c; }
.lineage .lt-node.here rect { stroke: var(--gold); stroke-width: 3; }
.lt-caption { margin: 0 0 10px; padding: 10px 14px; border-left: 4px solid var(--gold); background: var(--paper); border-radius: 0 10px 10px 0; animation: line-in 0.3s ease-out; }
.lt-caption p { margin: 2px 0; }
.lt-ask { font-weight: 700; color: var(--rule); }
.lt-why { color: var(--muted); }
.tw-open { margin-top: 10px; }
.read-block { margin: 6px 0 12px; padding: 8px 12px; border-left: 3px solid var(--gold); background: var(--paper); border-radius: 0 10px 10px 0; }
.read-block .math-d { margin: 6px 0; font-size: 1.2rem; }
.read-note { margin: 4px 0; padding-left: 8px; border-left: 3px solid currentColor; font-weight: 700; }
.read-shape { margin: 6px 0 0; color: var(--ink); font-weight: 700; }
.shapes { margin-top: 20px; }
.shapes-title { margin: 0 0 4px; font-family: var(--display); font-size: 1.5rem; text-transform: uppercase; }

.mgf-row { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 0 12px; align-items: center; padding: 4px 8px; border-radius: 8px; }

.mgf-why { grid-column: 2; margin: 0 0 4px; font-size: 0.92rem; color: var(--muted); }
.mv-a { color: var(--pv0); } .mv-b { color: var(--pv1); } .mv-c { color: var(--pv2); } .mv-d { color: var(--pv3); } .mv-e { color: var(--pv4); } .mv-s { color: var(--muted); }

.leafcard .math-i { font-size: 1.05rem; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
/* plug it in: the story's numbers fly into the formula */
:root { --pen-blue: #1d4ed8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pen-blue: #60a5fa; } }
:root[data-theme="dark"] { --pen-blue: #60a5fa; }
:root { --pv0: #c2410c; --pv1: #1d4ed8; --pv2: #9333ea; --pv3: #be185d; --pv4: #0f766e; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --pv0: #fb923c; --pv1: #60a5fa; --pv2: #c084fc; --pv3: #f472b6; --pv4: #2dd4bf; }
}
:root[data-theme="dark"] { --pv0: #fb923c; --pv1: #60a5fa; --pv2: #c084fc; --pv3: #f472b6; --pv4: #2dd4bf; }
.pv0 { color: var(--pv0); fill: var(--pv0); } .pv1 { color: var(--pv1); fill: var(--pv1); } .pv2 { color: var(--pv2); fill: var(--pv2); }
.pv3 { color: var(--pv3); fill: var(--pv3); } .pv4 { color: var(--pv4); fill: var(--pv4); } .pvres { color: var(--green); fill: var(--green); }
.plug { margin-top: 14px; padding: 12px 14px; border-left: 4px solid var(--green); background: var(--green-soft); border-radius: 0 10px 10px 0; }
.plug h3 { margin: 0 0 2px; font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--green); }
.plug-sub { margin: 0 0 6px; color: var(--muted); font-size: 0.9rem; }
.plug-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; min-height: 34px; }
.plug-chip { display: inline-flex; align-items: center; gap: 8px; padding: 3px 10px; border-radius: 999px; background: var(--sheet); border: 2px solid currentColor; font-family: var(--mono); font-weight: 600; font-size: 0.95rem; animation: chip-in 0.3s ease-out; }
.plug-chip small { color: var(--muted); font-family: var(--body); font-weight: 400; font-size: 0.8rem; }
.plug-line { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.plug-line .math-d { margin: 4px 0; }
.work-rows mjx-container[display="true"] { text-align: left !important; }
.work-rule { color: var(--muted); }
.work-rule.enter { animation: line-in 0.35s ease-out; }
.work-why { margin-top: 8px; }
.dgraph-wrap { margin: 12px 0 4px; }
.graph-title { font: 600 0.85rem var(--mono); color: var(--ink); margin-top: 2px; }
.dgraph { display: block; width: 100%; max-width: 560px; margin-top: 4px; background: var(--sheet); border: 1px solid var(--rule-soft); border-radius: 8px; overflow: visible; }
.dgraph .axis { stroke: var(--muted); stroke-width: 1; }
.dgraph .tick { fill: var(--muted); font: 600 9px var(--mono); }
.dgraph .tick.hit { fill: var(--ink); }
.dgraph .axis-name { fill: var(--muted); font: italic 10px var(--body); }
.dgraph .val { fill: var(--ink); font: 700 10px var(--mono); }
.dgraph .bar { fill: color-mix(in srgb, var(--rule) 55%, transparent); }
.dgraph .bar.hit { fill: var(--gold); }
.dgraph .curve { fill: none; stroke: var(--rule); stroke-width: 2; }
.dgraph .shade { fill: color-mix(in srgb, var(--gold) 45%, transparent); }
.dgraph .mark { stroke: var(--gold); stroke-width: 1.5; stroke-dasharray: 3 3; }
.dgraph.play .bar { transform-box: fill-box; transform-origin: bottom; animation: bar-up 0.45s ease-out both; animation-delay: calc(var(--i) * 35ms); }
.dgraph.play .curve { stroke-dasharray: 1000; animation: draw 1.1s ease-out both; }
.dgraph.play .shade, .dgraph.play .val, .dgraph.play .mark { animation: fade-in 0.4s ease-out 1s both; }
@keyframes bar-up { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.tlook { margin: 10px 0 4px; }
.tlook-scroll { overflow-x: auto; overflow-y: hidden; margin-top: 4px; border: 1px solid var(--rule-soft); border-radius: 8px; background: var(--sheet); }
.tlook-table { border-collapse: collapse; font-family: var(--mono); font-size: 0.82rem; white-space: nowrap; }
.tlook-table th, .tlook-table td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--rule-soft); transition: background 0.2s, color 0.2s; }
.tlook-table th { color: var(--muted); font-weight: 600; }
.tlook-table th.corner { text-align: left; }
.tlook-table tr.gap td { text-align: left; color: var(--muted); border: 0; padding: 0 8px; }
.tlook-table .on-row { background: color-mix(in srgb, var(--pv1) 18%, transparent); }
.tlook-table th.on-row { color: var(--pv1); }
.tlook-table .on-col { background: color-mix(in srgb, var(--pv0) 18%, transparent); }
.tlook-table th.on-col { color: var(--pv0); }
.tlook-table .on-row.on-col { background: color-mix(in srgb, var(--pv1) 14%, color-mix(in srgb, var(--pv0) 14%, transparent)); }
.tlook-table .scan { background: color-mix(in srgb, var(--gold) 22%, transparent); }
.tlook-table td.hit, .tlook-table td.hit.on-row.on-col { background: var(--gold); color: #17241c; font-weight: 700; box-shadow: 0 0 0 2px var(--gold); animation: hit 0.5s ease-out; }
/* the row labels stay in view while the table scrolls to the column */
.tlook-table tr > :first-child { position: sticky; left: 0; z-index: 1; background: var(--sheet); }
.tlook-table tr > th.on-row:first-child { background: color-mix(in srgb, var(--pv1) 30%, var(--sheet)); }
@keyframes hit { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
.tlook-cap { margin: 6px 0 0; font-size: 0.92rem; }
.piece-label { margin: 8px 0 0; font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.plug-sub.trap, .why .trap { color: var(--ink); font-weight: 700; }
.plug-line.work { opacity: 0.92; font-size: 0.92em; border-left: 2px dashed var(--rule-soft); padding-left: 10px; }
.plug-line.enter { animation: line-in 0.35s ease-out; }
.plug-line.bump { animation: bump 0.35s ease-out; }
.plug g.glow { animation: glow 0.6s ease-out; }
mark.pvmark { background: color-mix(in srgb, currentColor 16%, transparent); border-bottom: 3px solid currentColor; padding: 0 2px; border-radius: 3px; font-weight: 700; }
.flyer { position: fixed; left: 0; top: 0; z-index: 60; padding: 2px 8px; border-radius: 8px; background: var(--sheet); border: 2px solid currentColor; font: 700 1.05rem var(--mono); pointer-events: none; box-shadow: var(--shadow); white-space: nowrap; }
@keyframes chip-in { from { opacity: 0; transform: translateY(6px) scale(0.9); } to { opacity: 1; transform: none; } }
@keyframes line-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes glow { 0% { opacity: 0.2; } 35% { opacity: 1; filter: drop-shadow(0 0 5px currentColor); } 100% { filter: none; } }
.why { margin-top: 14px; padding: 12px 14px; border-left: 4px solid var(--red); background: var(--red-soft); border-radius: 0 10px 10px 0; }
.why h3 { margin: 0 0 4px; font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); }
.why p { margin: 4px 0; }
.toast {
  position: fixed; left: 50%; top: 30%; z-index: 30; transform: translateX(-50%);
  padding: 12px 22px; border-radius: 14px; background: var(--gold); color: var(--sheet);
  font-family: var(--display); font-weight: 800; font-size: 1.9rem; text-transform: uppercase; text-align: center;
  box-shadow: var(--shadow); animation: toast 1.6s ease-out forwards; pointer-events: none;
}
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 12px) scale(0.9); } 15%, 75% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -12px); } }

.result-stars { font-size: 3rem; letter-spacing: 0.15em; color: var(--gold); margin: 4px 0 6px; }

.tally { display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: var(--mono); color: var(--muted); font-size: 0.85rem; }

.table-wrap { overflow-x: auto; margin-top: 10px; }

/* the calculator floats over everything but the confetti, and stays where it is dragged */
.calc { position: fixed; z-index: 35; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100vw - 32px)); padding: 10px; border: 2px solid var(--rule); border-radius: 14px; background: var(--sheet); box-shadow: var(--shadow); }

.ink-clear {
  padding: 8px 14px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--rule); background: var(--sheet); color: var(--rule);
  font-family: var(--mono); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;

<script>
window.MathJax = {
  startup: { typeset: false },
  options: { enableMenu: false },
  svg: { fontCache: 'local' },
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg-full.js"></script>
<script src="engine.js"></script>
<script>
;(() => {
  const T2 = window.Test2
  const unit = T2.unit
  const lineByShort = Object.fromEntries(unit.guide.map(g => [g.short, g]))
  const ROUND = 6
  // a level of its own (not a study-guide line): name the distribution, every chapter,
  // from test-style stories with traps
  const TREE_LEVEL = 'Which distribution? (all chapters)'
  // where an MGF comes from: the recipe, then the moves, line by line
  const MGF_LEVEL = 'Build the MGF'
  // its numbers (n, p, r, N, k) and the values X can take, read off the story
  const PARAM_LEVEL = 'Read off the numbers'
  const isTree = short => short === TREE_LEVEL
  const isMgf = short => short === MGF_LEVEL
  const isParam = short => short === PARAM_LEVEL
  // World 0's own levels, not study-guide lines
  const isWorld0 = short => isTree(short) || isMgf(short) || isParam(short)
  const REVIEW_NAMES = { 'World 1 review': 1, 'World 2 review': 1, 'World 3 review': 1, 'World 4 review': 1, Everything: 1 }
  // every kind of question a level has (its templates, across its topics)
  const levelKinds = short => (isWorld0(short) || short in REVIEW_NAMES ? [] : topicsOf(short).flatMap(t => t.templates.map(tp => ({ t, tp }))))
  // a round shows every kind at least once, and never fewer than ROUND questions;
  // naming the distribution is quick, so its rounds run twice as long
  const roundSize = short => (short === 'Everything' ? REVIEW.Everything.length : short in REVIEW_NAMES ? 12 : isTree(short) ? ROUND * 2 : isMgf(short) ? 8 : isParam(short) ? 10 : Math.max(ROUND, levelKinds(short).length))

  // ---------- the path: the review list, easiest points first ----------
  const WORLDS = [
    {
      num: 0,
      name: 'The tree',
      blurb: 'Which distribution is it, what are its numbers, and where its MGF comes from. Every chapter, 3.4 to 4.4.',
      levels: [TREE_LEVEL, PARAM_LEVEL, MGF_LEVEL],
    },
    {
      num: 1,
      name: 'Free points',
      blurb: 'Read a table, name the story. No algebra.',
      levels: ['Normal table', 'Normal word problems', 'Binomial table', 'Chi-squared table'],
    },
    {
      num: 2,
      name: 'Plug it in',
      blurb: 'Know the formula, put the numbers in.',
      levels: ['Discrete probabilities', 'Uniform pdf', 'First event (exponential)', 'Continuous probabilities', 'Mean and variance from an MGF'],
    },
    {
      num: 3,
      name: 'The scripts',
      blurb: 'Derivations that come out the same every time.',
      levels: ['Geometric pdf', 'Geometric cdf', 'Derive the discrete pdfs', 'Verify a pdf, or find the constant'],
    },
    {
      num: 4,
      name: 'Calculus',
      blurb: 'Integrals and derivatives, one move at a time.',
      levels: ['pdf ↔ cdf', 'Mean and variance from a pdf', 'Integration by parts, gamma integrals'],
    },
  ].map(w => ({ ...w, levels: w.levels.filter(s => isWorld0(s) || lineByShort[s]) }))
  // a review at the end of Worlds 1–4 mixes that world's levels; World 5 mixes them all
  const REVIEW = {}
  for (const w of WORLDS) if (w.num >= 1 && w.num <= 4) {
    const name = `World ${w.num} review`
    REVIEW[name] = [...w.levels]
    w.levels.push(name)
  }
  WORLDS.push({ num: 5, name: 'Everything', blurb: 'Every world mixed: one question from every level, World 0 included.', levels: ['Everything'] })
  REVIEW.Everything = WORLDS.filter(w => w.num <= 4).flatMap(w => w.levels.filter(s => !REVIEW[s]))
  const isReview = short => short in REVIEW
  const DROP = {
    'Continuous probabilities': ['exponential:at-most', 'exponential:units', 'exponential:more-than', 'exponential:between', 'continuous-pdf:find-c-prob'],
    'pdf ↔ cdf': ['geometric-derive:cdf-series', 'geometric-derive:cdf-result', 'geometric-derive:cdf-numbers'],
    'Geometric cdf': ['geometric:cdf'],
    'Geometric pdf': ['geometric-derive:show-pdf'],
  }
  // a level's topics, without the kinds it leaves to another level
  const topicsOf = short =>
    T2.guideTopics(unit, lineByShort[short])
      .map(t => ({ ...t, templates: t.templates.filter(tp => !DROP[short]?.includes(`${t.id}:${tp.id}`)) }))
      .filter(t => t.templates.length)
  const WORLD1_LEVELS = new Set(WORLDS.find(w => w.num === 1).levels)
  const ORDER = WORLDS.flatMap(w => w.levels)
  const BOSS_ORDER = ORDER.filter(s => !isReview(s))

  // ---------- power-up cards: the whole idea in plain words ----------
  const CARDS = {
    'Normal table': [
      'The table gives the area to the LEFT of z: P(Z < z).',
      'Row = z cut off after one decimal (1.2, not rounded), column = the second decimal (0.05). Together: z = 1.25.',
      'Area on the right: 1 − the table value. Between two z values: bigger value − smaller value.',
      'Backwards: find the area inside the table, then read its z off the row and column.',
    ],
    'Normal word problems': [
      'Turn x into z: z = (x − μ)/σ. Round z to 2 decimals.',
      'Look z up: that is the area to the left, which is also the percentile.',
      'IQ (μ = 100, σ = 15): a 139 gives z = 2.6, the table says 0.9953, so the 99.53rd percentile.',
      'Backwards: area → z from the table → x = μ + zσ. The middle 95% is μ ± 1.96σ.',
    ],
    'Binomial table': [
      'Pick the table for your n (19 or 20), the column for p, the row for x. The entry is P(X ≤ x).',
      'Fewer than 8 means at most 7: read row 7. At least 8: 1 − row 7. More than 8: 1 − row 8.',
      'Exactly 8: row 8 − row 7.',
    ],
    'Chi-squared table': [
      'Rows: degrees of freedom γ. Columns: the area to the LEFT of the value.',
      'χ² with r in the subscript has area r on the RIGHT, so read the column for 1 − r. χ²₀.₀₅ lives in the 0.95 column.',
      'Given a value in a row, its column heading tells you the left area. The right area is 1 minus that.',
    ],
    'Discrete probabilities': [
      'Name the distribution and its numbers first, then put x into its formula.',
      'At most 2 = P(0) + P(1) + P(2). At least 1 = 1 − P(0).',
      'Binomial: C(n, x)·pˣ·qⁿ⁻ˣ with q = 1 − p. Poisson: e⁻ᵏkˣ/x! (on the formula sheet).',
    ],
    'Uniform pdf': [
      'Uniform on [A, B] means flat: every value is equally likely.',
      'The rectangle from A to B must have area 1, so its height is 1/(B − A). That height is the pdf.',
      'A probability is a length over the full length: P(c < X < d) = (d − c)/(B − A).',
    ],
    'First event (exponential)': [
      'Events arrive at rate λ (like 3 per hour). The wait W for the first one has pdf f(x) = λe^(−λx).',
      'P(W ≤ t) = 1 − e^(−λt). P(W > t) = e^(−λt).',
      '"1 every 5 hours" means λ = 1/5. Put the rate and the time in the same unit first.',
    ],
    'Continuous probabilities': [
      'For a continuous X, a probability is an area: P(a < X < b) = ∫ from a to b of f(x) dx.',
      'Find an antiderivative, plug in b, subtract what you get at a.',
      'A single point has probability 0, so < and ≤ give the same answer.',
    ],
    'Mean and variance from an MGF': [
      'E(X) = m′(0): differentiate the MGF, then plug in t = 0.',
      'E(X²) = m″(0). Variance = m″(0) − [m′(0)]².',
      'Shortcuts: (1 − βt)^(−α) has mean αβ and variance αβ². e^(μt + σ²t²/2) has mean μ and variance σ².',
    ],
    'Geometric pdf': [
      'X is the try on which the first success happens.',
      'That means x − 1 failures (q each) and then a success (p): f(x) = q^(x−1)·p.',
      'It sums to 1: a geometric series with a = p and r = q gives p/(1 − q) = p/p = 1.',
    ],
    'Geometric cdf': [
      'F(x) = P(X ≤ x): add q^(k−1)·p from k = 1 up to x.',
      'That is a finite geometric series (on the sheet): p(1 − qˣ)/(1 − q).',
      '1 − q is p, so the p cancels: F(x) = 1 − qˣ.',
    ],
    'Derive the discrete pdfs': [
      'Binomial: one particular order of x successes has probability pˣqⁿ⁻ˣ, and there are C(n, x) orders.',
      'Hypergeometric: good samples C(r, x)·C(N − r, n − x) over all samples C(N, n).',
      'Negative binomial: the last try is the r-th success, so f(x) = P(r − 1 successes in x − 1 tries) × p = C(x − 1, r − 1)·pʳ·q^(x−r).',
    ],
    'Verify a pdf, or find the constant': [
      'A pdf needs two things: f(x) ≥ 0 everywhere, and a total of 1 (the sum, or the integral).',
      'To find c: integrate with c out front, set the result equal to 1, solve for c.',
      'Example: c·x² on [0, 3]. The integral is c·9, so c = 1/9.',
    ],
    'pdf ↔ cdf': [
      'The cdf F(x) = P(X ≤ x): add up (discrete) or integrate (continuous) everything up to x.',
      'Continuous: integrate f from the left end of its range up to x. Before the range F = 0, after it F = 1.',
      'Going back: f(x) = F′(x). Discrete: f(x) is the jump F makes at x.',
    ],
    'Mean and variance from a pdf': [
      'E(X) = Σ x·f(x), or ∫ x·f(x) dx for a continuous X.',
      'E(X²) = Σ x²·f(x), or ∫ x²·f(x) dx.',
      'Variance = E(X²) − [E(X)]². Gamma shortcut: mean αβ, variance αβ².',
    ],
    'Integration by parts, gamma integrals': [
      '∫ u dv = uv − ∫ v du. For x·e^(ax): u = x, dv = e^(ax) dx.',
      'Result: (x/a)e^(ax) − e^(ax)/a² + C. You only ever do this once on the test.',
      'xⁿe^(−x) from 0 to ∞ is NOT by parts: it is Γ(n + 1) = n!. So x⁴e^(−x) gives 4! = 24.',
    ],
  }

  // ---------- progress ----------
  const LOCAL_KEY = 'math3800-arcade.v1'
  const fresh = () => ({ v: 1, stars: {}, plays: {}, recent: {}, practice: {}, muted: false, answered: 0, correct: 0, boss: null, updated: 0 })
  // progress saved before XP, the pet and the day streak were taken out still carries them
  const tidy = s => {
    for (const k of ['xp', 'pet', 'days', 'lastDay']) delete s[k]
    return s
  }
  let state = fresh()
  try {
    const s = JSON.parse(localStorage.getItem(LOCAL_KEY))
    if (s && s.v === 1) state = tidy({ ...fresh(), ...s })
  } catch {}

  let remote = null // the viewer's own progress document, when the page can sync
  let writing = Promise.resolve()
  function save() {
    state.updated = Date.now()
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)) } catch {}
    if (remote) {
      const body = JSON.parse(JSON.stringify(state))
      writing = writing.then(() => remote.set(body)).catch(() => {})
    }
  }
  async function connect() {
    try {
      if (!window.claude?.use) return
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')])
      if (!db || !user) return
      const id = await user.id()
      if (!id) return
      const ref = db.doc('data/users/' + id + '/arcade')
      const snap = await ref.get()
      remote = ref
      const theirs = snap.exists ? snap.data() : null
      if (theirs && theirs.v === 1 && (theirs.updated || 0) > (state.updated || 0)) {
        state = tidy({ ...fresh(), ...JSON.parse(JSON.stringify(theirs)) })
        try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)) } catch {}
        hud()
        if (screen === 'map') renderMap()
      } else if (state.updated) save()
    } catch {}
  }

  // ---------- readiness: every topic on the review list, and the levels that drill it ----------
  const TOPICS = [
    { name: 'Name the distribution from a story', levels: [TREE_LEVEL] },
    { name: 'Its numbers (p, r, n, N, k) and the values X can take', levels: [PARAM_LEVEL] },
    { name: 'MGFs: derive one, and name a given one', levels: [MGF_LEVEL] },
    { name: 'Mean and variance from an MGF', levels: ['Mean and variance from an MGF'] },
    { name: 'Mean and variance from a pdf', levels: ['Mean and variance from a pdf'] },
    { name: 'Geometric: derive the pdf, cdf and MGF', levels: ['Geometric pdf', 'Geometric cdf', MGF_LEVEL] },
    { name: 'Derive the binomial, negative binomial and hypergeometric pdfs', levels: ['Derive the discrete pdfs'] },
    { name: 'Verify a pdf, or find the constant', levels: ['Verify a pdf, or find the constant'] },
    { name: 'pdf ↔ cdf', levels: ['pdf ↔ cdf', 'Geometric cdf'] },
    { name: 'Discrete probabilities: P(1) + P(2) + …', levels: ['Discrete probabilities'] },
    { name: 'Continuous probabilities: ∫ f(x) dx', levels: ['Continuous probabilities'] },
    { name: 'Uniform: the pdf from A and B', levels: ['Uniform pdf'] },
    { name: 'Time of the first event (exponential)', levels: ['First event (exponential)'] },
    { name: 'Normal table and word problems', levels: ['Normal table', 'Normal word problems'] },
    { name: 'Binomial table', levels: ['Binomial table'] },
    { name: 'Chi-squared table', levels: ['Chi-squared table'] },
    { name: 'Integration by parts, gamma integrals', levels: ['Integration by parts, gamma integrals'] },
  ]
  // How ready one level is, 0 to 1: its best round (stars), its last 12 first tries
  // (counted as if two more had been missed, so a lucky pair isn't 100%), and its
  // question on the last practice test. Nothing played yet is 0.
  function levelReady(k) {
    const parts = []
    if (state.stars[k] || state.plays[k]) parts.push([(state.stars[k] || 0) / 3, 1])
    const r = state.recent?.[k]
    if (r?.length) parts.push([r.reduce((a, b) => a + b, 0) / (r.length + 2), 1])
    if (k in (state.practice ?? {})) parts.push([state.practice[k] ? 1 : 0, 0.5])
    const w = parts.reduce((t, [, x]) => t + x, 0)
    return w ? parts.reduce((t, [v, x]) => t + v * x, 0) / w : 0
  }
  const topicReady = t => t.levels.reduce((a, k) => a + levelReady(k), 0) / t.levels.length
  const readiness = () => TOPICS.reduce((a, t) => a + topicReady(t), 0) / TOPICS.length
  const grade = r => (r >= 0.9 ? 'A' : r >= 0.8 ? 'B' : r >= 0.7 ? 'C' : r >= 0.6 ? 'D' : r > 0 ? 'F' : '–')
  const nextUp = () => ORDER.find(k => (state.stars[k] || 0) < 2) ?? ORDER.find(k => (state.stars[k] || 0) < 3) ?? ORDER[0]

  // ---------- sound ----------
  let ac = null
  function audio() {
    if (state.muted) return null
    try {
      ac ??= new (window.AudioContext || window.webkitAudioContext)()
      if (ac.state === 'suspended') ac.resume()
      return ac
    } catch { return null }
  }
  function tone(freq, at, dur, type = 'triangle', gain = 0.16) {
    const a = audio()
    if (!a) return
    const t = a.currentTime + at
    const o = a.createOscillator()
    const g = a.createGain()
    o.type = type
    o.frequency.setValueAtTime(freq, t)
    g.gain.setValueAtTime(0.0001, t)
    g.gain.exponentialRampToValueAtTime(gain, t + 0.015)
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
    o.connect(g).connect(a.destination)
    o.start(t)
    o.stop(t + dur + 0.02)
  }
  const semis = (base, n) => base * Math.pow(2, n / 12)
  const sfx = {
    right(combo) {
      const base = semis(523.25, Math.min(combo, 12))
      tone(base, 0, 0.14)
      tone(semis(base, 7), 0.07, 0.22)
    },
    wrong() {
      tone(150, 0, 0.22, 'square', 0.07)
      tone(110, 0.09, 0.28, 'square', 0.06)
    },
    clear() { [0, 4, 7, 12, 16].forEach((n, i) => tone(semis(523.25, n), i * 0.09, 0.3)) },
  }

  // ---------- confetti ----------
  const fx = document.getElementById('fx')
  const ctx = fx.getContext('2d')
  let bits = []
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches
  function burst(n = 120) {
    if (reduced()) return
    const cs = getComputedStyle(document.documentElement)
    const colors = ['--gold', '--rule', '--green', '--red', '--graphite'].map(v => cs.getPropertyValue(v).trim())
    const w = (fx.width = innerWidth * devicePixelRatio)
    fx.height = innerHeight * devicePixelRatio
    for (let i = 0; i < n; i++) {
      bits.push({
        x: w / 2 + (Math.random() - 0.5) * w * 0.3,
        y: fx.height * 0.35,
        vx: (Math.random() - 0.5) * 16 * devicePixelRatio,
        vy: (-6 - Math.random() * 12) * devicePixelRatio,
        r: (4 + Math.random() * 5) * devicePixelRatio,
        c: colors[i % colors.length],
        spin: Math.random() * 6,
        life: 0,
      })
    }
    if (bits.length === n) requestAnimationFrame(tick)
  }
  function tick() {
    ctx.clearRect(0, 0, fx.width, fx.height)
    bits = bits.filter(b => b.life < 160 && b.y < fx.height + 40)
    for (const b of bits) {
      b.life++
      b.vy += 0.35 * devicePixelRatio
      b.vx *= 0.99
      b.x += b.vx
      b.y += b.vy
      ctx.save()
      ctx.translate(b.x, b.y)
      ctx.rotate(b.spin + b.life * 0.1)
      ctx.fillStyle = b.c
      ctx.beginPath()
      ctx.ellipse(0, 0, b.r, b.r * 1.35, 0, 0, Math.PI * 2) // little filled-in bubbles
      ctx.fill()
      ctx.restore()
    }
    if (bits.length) requestAnimationFrame(tick)
    else ctx.clearRect(0, 0, fx.width, fx.height)
  }
  function toast(text) {
    const s = document.createElement('div')
    s.className = 'toast'
    s.textContent = text
    document.body.append(s)
    setTimeout(() => s.remove(), 1650)
  }

  // ---------- S Pen ink: only a stylus writes; fingers and the mouse scroll and tap ----------
  // The ink sits on the page (it scrolls with the question) and clears itself
  // when the screen changes. The pen's side button (or eraser end) erases.
  const ink = document.getElementById('ink')
  const inkCtx = ink.getContext('2d')
  const inkClear = document.getElementById('ink-tools')
  const inkEraseBtn = document.getElementById('ink-erase')
  // the pen writes in blue (a lighter blue on the dark theme)
  const penColor = () => getComputedStyle(document.documentElement).getPropertyValue('--pen-blue').trim() || '#1d4ed8'
  // the on-screen eraser, for when the side button is taken (Air Command)
  let inkEraseMode = false
  const setEraseMode = on => {
    inkEraseMode = on
    inkEraseBtn.setAttribute('aria-pressed', String(on))
    if (on) inkClear.hidden = false
  }
  inkEraseBtn.addEventListener('click', () => setEraseMode(!inkEraseMode))
  let inking = false
  let inkLast = null
  const pageSize = () => ({ w: document.documentElement.clientWidth, h: Math.max(document.documentElement.scrollHeight, innerHeight) })
  // keep = copy the strokes across (rotation, the page growing below them)
  function sizeInk(keep) {
    // measure the page without the ink layer, so it never props the page open
    const was = ink.style.height
    ink.style.height = '0px'
    const { w, h } = pageSize()
    ink.style.height = was
    const dpr = window.devicePixelRatio || 1
    let snap = null
    if (keep && ink.width && ink.height) {
      snap = document.createElement('canvas')
      snap.width = ink.width
      snap.height = ink.height
      snap.getContext('2d').drawImage(ink, 0, 0)
    }
    ink.width = Math.round(w * dpr)
    ink.height = Math.round(h * dpr)
    ink.style.width = w + 'px'
    ink.style.height = h + 'px'
    inkCtx.setTransform(dpr, 0, 0, dpr, 0, 0)
    inkCtx.lineCap = 'round'
    inkCtx.lineJoin = 'round'
    if (snap) inkCtx.drawImage(snap, 0, 0, snap.width / dpr, snap.height / dpr)
  }
  function clearInk() {
    inking = false
    inkLast = null
    sizeInk(false)
    inkClear.hidden = true
    setEraseMode(false)
  }
  const onControl = e => e.target instanceof Element && e.target.closest('button, input, a, select, textarea, label, [role="button"]')
  const sideButton = e => (e.buttons & 34) !== 0 || e.button === 2 || e.button === 5
  // where the pen is on the page: the screen spot plus how far the page is scrolled
  const onPage = e => ({ x: e.clientX + window.scrollX, y: e.clientY + window.scrollY })
  // With the side button held, some Samsung browsers stop calling the S Pen a pen and
  // report a right-button mouse instead. Take that as an erase stroke too, and once
  // a stroke starts, follow that pointer to the end whatever it is called.
  let inkPointer = null
  const penLike = e => e.pointerType === 'pen' || (e.pointerType === 'mouse' && sideButton(e))
  // Hold to erase: a stroke erases while the side button is held and writes again
  // once it is let go. Browsers report a held button in two ways:
  //  - the standard one: the pointer's buttons bit 2 (barrel) or 32 (eraser end) on
  //    every event while it is held (Samsung Internet);
  //  - only a right click as it goes down (Chrome): then the stroke it belongs to
  //    erases to its end, including what it drew before the click arrived.
  // Chrome can also cut a held-button drag short; if the pen keeps moving with the
  // button held, erasing picks back up.
  let heldAt = 0 // when the last right click from the side button arrived
  let strokeHeld = false // a right click came during (or just before) this stroke
  let strokePts = [] // this stroke's points, to wipe if it turns out to be an erase
  const held = e => sideButton(e) || strokeHeld
  const wipe = pts => {
    if (pts.length < 2) return
    inkCtx.save()
    inkCtx.globalCompositeOperation = 'destination-out'
    inkCtx.lineWidth = 26
    inkCtx.beginPath()
    inkCtx.moveTo(pts[0].x, pts[0].y)
    for (const pt of pts.slice(1)) inkCtx.lineTo(pt.x, pt.y)
    inkCtx.stroke()
    inkCtx.restore()
  }
  function sidePress(e) {
    if (onControl(e)) return
    e.preventDefault()
    window.getSelection()?.removeAllRanges()
    // during a stroke it belongs to that stroke; with the pen up, to the next touch
    if (!inking) heldAt = Date.now()
    else if (!strokeHeld) {
      strokeHeld = true

  // the readiness bell: the shaded left area under a normal curve is the share of stars earned
  function invPhi(p) {
    // Acklam's rational approximation
    const a = [-39.69683028665376, 220.9460984245205, -275.9285104469687, 138.357751867269, -30.66479806614716, 2.506628277459239]
    const b = [-54.47609879822406, 161.5858368580409, -155.6989798598866, 66.80131188771972, -13.28068155288572]
    const c = [-0.007784894002430293, -0.3223964580411365, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783]
    const d = [0.007784695709041462, 0.3224671290700398, 2.445134137142996, 3.754408661907416]
    const lo = 0.02425
    if (p < lo) {
      const q = Math.sqrt(-2 * Math.log(p))
      return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1)
    }
    if (p > 1 - lo) return -invPhi(1 - p)
    const q = p - 0.5
    const r = q * q
    return ((((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q) / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1)
  }
  function bellSvg(frac) {
    const W = 200, H = 96, base = 84, top = 10
    const X = z => ((z + 3.2) / 6.4) * W
    const Y = z => base - (base - top) * Math.exp(-(z * z) / 2)
    const pts = []
    for (let z = -3.2; z <= 3.2001; z += 0.1) pts.push([X(z), Y(z)])
    const curve = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')
    let shade = ''
    if (frac > 0) {
      const zc = frac >= 0.999 ? 3.2 : Math.max(-3.2, Math.min(3.2, invPhi(frac)))
      const sp = pts.filter(p => p[0] <= X(zc))
      sp.push([X(zc), Y(zc)])
      shade = `<path d="M${X(-3.2)} ${base} ${sp.map(p => 'L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')} L${X(zc).toFixed(1)} ${base} Z" fill="var(--gold)" opacity="0.85"/>

    }
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Readiness ${Math.round(frac * 100)} percent">
      ${shade}
      <path d="${curve}" fill="none" stroke="var(--rule)" stroke-width="2.5"/>
      <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--rule)" stroke-width="1.5"/>
      ${[-2, -1, 0, 1, 2].map(z => `<line x1="${X(z)}" y1="${base}" x2="${X(z)}" y2="${base + 5}" stroke="var(--rule)" stroke-width="1.2"/>`).join('')}
    </svg>`
  }

  async function startRound(short, paper = false) {
    view.replaceChildren(h('p', 'loading', 'Shuffling the deck…'))
    await mathBoot
    const queue = []
    if (isReview(short)) {
      // every level once, then more, shuffled; never the same level twice in a row
      const parts = REVIEW[short]
      const order = []
      while (order.length < roundSize(short)) {
        const next = shuffleArr(parts)
        if (next[0] === order[order.length - 1]) next.push(next.shift())
        order.push(...next)
      }
      for (const level of order.slice(0, roundSize(short))) queue.push({ p: problemFor(level), level, seen: 0, missed: false })
      round = { short, paper, queue, at: 0, combo: 0, best: 0, misses: 0, marks: [] }
      showQuestion()
      return
    }
    if (isTree(short)) {
      // every distribution once, then repeats, never the same one twice in a row
      const shuffled = () => Object.keys(LEAVES).sort(() => Math.random() - 0.5)
      const order = []
      while (order.length < roundSize(short)) {
        const next = shuffled()
        if (next[0] === order[order.length - 1]) next.push(next.shift())
        order.push(...next)
      }
      for (const leaf of order.slice(0, roundSize(short))) queue.push({ p: treeProblem(leaf, true), seen: 0, missed: false })
    }
    if (isMgf(short)) for (const p of mgfRound(roundSize(short))) queue.push({ p, seen: 0, missed: false })
    if (isParam(short)) for (const p of paramRound(roundSize(short))) queue.push({ p, seen: 0, missed: false })
    const topics = isWorld0(short) ? [] : topicsOf(short)
    const weights = topics.map(t => t.templates.length)
    const total = weights.reduce((a, b) => a + b, 0)
    const pick = T2.createFreshPicker()
    // one of every kind first, in a random order
    if (!isWorld0(short)) {
      for (const { tp } of levelKinds(short).sort(() => Math.random() - 0.5)) queue.push({ p: tp.generate(), seen: 0, missed: false })
    }
    // then fill up to the round size with picks weighted toward the bigger topics
    for (let i = queue.length; i < (isWorld0(short) ? 0 : roundSize(short)); i++) {
      let r = Math.random() * total
      let t = topics[topics.length - 1]
      for (let j = 0; j < topics.length; j++) {
        r -= weights[j]
        if (r <= 0) { t = topics[j]; break }
      }
      queue.push({ p: pick(t), seen: 0, missed: false })
    }
    round = { short, paper, queue, at: 0, combo: 0, best: 0, misses: 0, marks: [] }
    showQuestion()
  }

  // one question from a level: a distribution story, or one of the level's kinds
  function problemFor(level) {
